<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viral Matrix Launchpad</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        body { background-color: #0b0e14; color: #ffffff; font-family: system-ui, sans-serif; text-align: center; padding: 20px; margin: 0; }
        .header h1 { color: #00f2fe; margin-bottom: 5px; }
        .card { background: #151a23; border-radius: 16px; padding: 20px; max-width: 420px; margin: 20px auto; border: 1px solid #232d3f; }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #2a3547; background: #0b0e14; color: #fff; }
        button { background: linear-gradient(135deg, #00c6ff, #0072ff); color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 95%; }
        #status { font-size: 14px; margin-top: 15px; color: #00f2fe; }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚡ Viral Matrix Launchpad</h1>
        <p>منصة إطلاق العملات الرقمية ($VMAX)</p>
    </div>

    <div class="card">
        <button id="connectBtn" onclick="connectWallet()">🔗 ربط المحفظة</button>
        <p id="walletAddress" style="font-size:12px; color:#10b981;"></p>
    </div>

    <div class="card">
        <h3>إطلاق عملة جديدة</h3>
        <input type="text" id="tokenName" placeholder="اسم العملة (Viral Matrix)">
        <input type="text" id="tokenSymbol" placeholder="رمز العملة (VMAX)">
        <button onclick="createToken()">🚀 إطلاق العملة فوراً</button>
        <div id="status"></div>
    </div>

    <script>
        const FACTORY_ADDRESS = "0xfAF6861788010A1A7f6C65DE7133baC24945b332";
        const FACTORY_ABI = [{"inputs":[{"internalType":"string","name":"name","type":"string"},{"internalType":"string","name":"symbol","type":"string"}],"name":"createToken","outputs":[{"internalType":"address","name":"tokenAddress","type":"address"}],"stateMutability":"payable","type":"function"}];

        let provider, signer, factoryContract;

        async function connectWallet() {
            if (window.ethereum) {
                try {
                    provider = new ethers.BrowserProvider(window.ethereum);
                    signer = await provider.getSigner();
                    const address = await signer.getAddress();
                    document.getElementById("walletAddress").innerText = "تم الربط: " + address.substring(0,6) + "..." + address.substring(address.length - 4);
                    factoryContract = new ethers.Contract(FACTORY_ADDRESS, FACTORY_ABI, signer);
                } catch (err) { alert("خطأ: " + err.message); }
            } else { alert("يرجى فتح الرابط من داخل متصفح Web3 في بينانس أو MetaMask"); }
        }

        async function createToken() {
            const name = document.getElementById("tokenName").value;
            const symbol = document.getElementById("tokenSymbol").value;
            const status = document.getElementById("status");
            if (!name || !symbol) { alert("ادخل الاسم والرمز"); return; }
            if (!factoryContract) { alert("ربط المحفظة أولاً"); return; }
            try {
                status.innerText = "⏳ جاري إرسال الطلب للمحفظة...";
                const tx = await factoryContract.createToken(name, symbol);
                status.innerText = "🌐 جاري التأكيد على البلوكتشين...";
                await tx.wait();
                status.innerText = "🎉 تم إنشاء العملة بنجاح!";
            } catch (err) { status.innerText = "❌ حدث خطأ أو إلغاء المعاملة."; }
        }
    </script>
</body>
</html>
