<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Decay (ADL) - Control Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        .card {
            background: #0f172a;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid #334155;
        }
        label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 5px; }
        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #1e293b;
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
        }
        input:focus { border-color: #38bdf8; outline: none; }
        button {
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }
        button:hover { background: #0ea5e9; }
        .btn-green { background: #22c55e; color: #fff; }
        .btn-green:hover { background: #16a34a; }
        .btn-orange { background: #f59e0b; color: #fff; }
        .btn-orange:hover { background: #d97706; }
        #status {
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            color: #38bdf8;
            word-break: break-all;
            border: 1px dashed #334155;
            min-height: 40px;
        }
        .wallet-info { font-size: 13px; color: #34d399; margin-bottom: 15px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>Alpha Decay (ADL)</h2>
    <div class="subtitle">لوحة التحكم التفاعلية لمحرك التسونامي</div>

    <div class="wallet-info" id="walletStatus">المحفظة غير متصلة</div>
    <button onclick="connectWallet()" class="btn-green">ربط محفظة MetaMask 🦊</button>

    <div class="card">
        <label>عنوان العقد الذكي (Contract Address):</label>
        <input type="text" id="contractAddress" placeholder="0x...">
    </div>

    <div class="card">
        <label>كمية الـ ETH:</label>
        <input type="text" id="ethAmount" value="0.001" placeholder="0.001">
        <button onclick="buyTokens()">شراء توكنات (تغذية المسبح تلقائياً) 🚀</button>
    </div>

    <div class="card">
        <label>كمية التوكنات للبيع (ADL):</label>
        <input type="text" id="tokenAmount" placeholder="1000">
        <button onclick="sellTokens()" class="btn-orange">بيع واسترداد الـ ETH 🔄</button>
    </div>

    <div class="card">
        <button onclick="depositDirectBounty()" style="background: #8b5cf6; color: #fff;">ضخ ETH مباشر للمسبح 100% ⚡</button>
        <button onclick="triggerTsunamiManual()" style="background: #ef4444; color: #fff;">تشغيل مهارة التسونامي يدوياً 🔥</button>
    </div>

    <div class="card">
        <label>حالة العمليات:</label>
        <div id="status">جاهز للاستخدام...</div>
    </div>
</div>

<script>
    let provider, signer, contract;

    // ABI العقد المبسط لتفعيل الدوال الأساسية
    const abi = [
        "function swapETHForTokens() external payable",
        "function swapTokensForETH(uint256 tokenAmount) external",
        "function triggerTsunami() external",
        "receive() external payable"
    ];

    async function connectWallet() {
        if (typeof window.ethereum !== 'undefined') {
            try {
                await ethereum.request({ method: 'eth_requestAccounts' });
                provider = new ethers.providers.Web3Provider(window.ethereum);
                signer = provider.getSigner();
                const address = await signer.getAddress();
                document.getElementById("walletStatus").innerText = "متصل: " + address.substring(0, 6) + "..." + address.substring(38);
                document.getElementById("status").innerText = "تم ربط المحفظة بنجاح!";
            } catch (error) {
                document.getElementById("status").innerText = "❌ فشل الربط: " + error.message;
            }
        } else {
            alert("يرجى تثبيت متصفح يدعم MetaMask أو استخدام متصفح محفظة Web3!");
        }
    }

    function getContract() {
        const addr = document.getElementById("contractAddress").value.trim();
        if (!addr) { alert("الرجاء إدخال عنوان العقد أولاً!"); return null; }
        return new ethers.Contract(addr, abi, signer);
    }

    async function buyTokens() {
        try {
            const c = getContract();
            if (!c) return;
            const ethVal = document.getElementById("ethAmount").value;
            document.getElementById("status").innerText = "⏳ جاري تنفيذ الشراء وتغذية المسبح...";
            
            const tx = await c.swapETHForTokens({ value: ethers.utils.parseEther(ethVal) });
            document.getElementById("status").innerText = "⏳ بانتظار التأكيد... Tx: " + tx.hash;
            await tx.wait();
            document.getElementById("status").innerText = "✅ تمت عملية الشراء وتفعيل مسبح التسونامي بنجاح!";
        } catch (err) {
            document.getElementById("status").innerText = "❌ خطأ: " + (err.reason || err.message);
        }
    }

    async function sellTokens() {
        try {
            const c = getContract();
            if (!c) return;
            const tokenVal = document.getElementById("tokenAmount").value;
            const parsedTokens = ethers.utils.parseUnits(tokenVal, 18);
            
            document.getElementById("status").innerText = "⏳ جاري بيع التوكنات لاسترداد الـ ETH...";
            const tx = await c.swapTokensForETH(parsedTokens);
            document.getElementById("status").innerText = "⏳ بانتظار التأكيد... Tx: " + tx.hash;
            await tx.wait();
            document.getElementById("status").innerText = "✅ تم البيع بنجاح واسترداد الـ ETH!";
        } catch (err) {
            document.getElementById("status").innerText = "❌ خطأ: " + (err.reason || err.message);
        }
    }

    async function depositDirectBounty() {
        try {
            const addr = document.getElementById("contractAddress").value.trim();
            if (!addr) { alert("أدخل عنوان العقد أولاً!"); return; }
            const ethVal = document.getElementById("ethAmount").value;
            
            document.getElementById("status").innerText = "⏳ جاري ضخ الـ ETH مباشرة للمسبح...";
            const tx = await signer.sendTransaction({
                to: addr,
                value: ethers.utils.parseEther(ethVal)
            });
            document.getElementById("status").innerText = "⏳ بانتظار التأكيد... Tx: " + tx.hash;
            await tx.wait();
            document.getElementById("status").innerText = "⚡ تم ضخ الـ ETH بالكامل لتغذية المسبح!";
        } catch (err) {
            document.getElementById("status").innerText = "❌ خطأ: " + (err.reason || err.message);
        }
    }

    async function triggerTsunamiManual() {
        try {
            const c = getContract();
            if (!c) return;
            document.getElementById("status").innerText = "⏳ جاري استدعاء دالة التسونامي اليدوية...";
            const tx = await c.triggerTsunami();
            document.getElementById("status").innerText = "⏳ بانتظار التأكيد... Tx: " + tx.hash;
            await tx.wait();
            document.getElementById("status").innerText = "🔥 تم تشغيل التسونامي بنجاح واستلام المكافأة!";
        } catch (err) {
            document.getElementById("status").innerText = "❌ خطأ: " + (err.reason || err.message);
        }
    }
</script>

</body>
</html>
