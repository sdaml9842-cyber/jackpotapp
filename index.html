<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Launchpad | Terminal</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Header -->
    <header class="w-full p-6 flex justify-between items-center border-b border-slate-800">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></div>
            <span class="font-bold tracking-wider text-lg">QUANTUM ENGINE</span>
        </div>
        <button id="connectBtn" onclick="connectWallet()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2.5 rounded-xl font-medium transition shadow-lg shadow-emerald-900/30">
            Connect Wallet
        </button>
    </header>

    <!-- Main Content -->
    <main class="max-w-xl mx-auto p-6 w-full flex-grow flex flex-col justify-center">
        <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 backdrop-blur-xl shadow-2xl">
            <h1 class="text-2xl font-black mb-2 text-center bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">
                Predator Protocol Active
            </h1>
            <p class="text-slate-400 text-sm text-center mb-6">
                Execute bonding curve acquisition securely via decentralized routing.
            </p>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Amount to Swap (BNB)</label>
                    <div class="relative">
                        <input type="number" id="ethAmount" value="0.01" step="0.001" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 transition">
                        <span class="absolute right-4 top-3 text-slate-500 font-bold">BNB</span>
                    </div>
                </div>

                <button onclick="executeBuy()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-3.5 rounded-xl transition shadow-xl shadow-emerald-950">
                    Execute Predator Buy
                </button>
            </div>

            <div id="status" class="mt-4 text-center text-xs text-slate-400"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full p-6 text-center text-xs text-slate-600 border-t border-slate-900">
        Contract: <span class="font-mono text-slate-500">0x5F29f10faF6C24E5E34cFeB186cF650C5CE36b6D</span>
    </footer>

    <script>
        const contractAddress = "0x5F29f10faF6C24E5E34cFeB186cF650C5CE36b6D";
        const contractABI = [
            "function executePredatorBuy() external payable"
        ];

        let provider, signer, contract;

        async function connectWallet() {
            if (window.ethereum) {
                try {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = provider.getSigner();
                    contract = new ethers.Contract(contractAddress, contractABI, signer);
                    
                    const address = await signer.getAddress();
                    document.getElementById("connectBtn").innerText = address.substring(0, 6) + "..." + address.substring(38);
                    document.getElementById("status").innerText = "Wallet Connected Successfully.";
                } catch (err) {
                    console.error(err);
                    document.getElementById("status").innerText = "Connection failed.";
                }
            } else {
                alert("Please install MetaMask or Web3 Mobile Browser!");
            }
        }

        async function executeBuy() {
            if (!contract) {
                alert("Please connect your wallet first!");
                return;
            }
            try {
                const amount = document.getElementById("ethAmount").value;
                const txValue = ethers.utils.parseEther(amount);
                
                document.getElementById("status").innerText = "Submitting transaction...";
                const tx = await contract.executePredatorBuy({ value: txValue });
                
                document.getElementById("status").innerText = "Transaction sent: " + tx.hash;
                await tx.wait();
                document.getElementById("status").innerText = "Transaction confirmed successfully!";
            } catch (err) {
                console.error(err);
                document.getElementById("status").innerText = "Error: " + (err.data?.message || err.message);
            }
        }
    </script>
</body>
</html>
