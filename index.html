<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEV Arbitrage Router - لوحة التحكم السريعة</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #0f172a; color: #f8fafc; text-align: center; padding: 40px; }
        .card { background: #1e293b; max-width: 500px; margin: 0 auto; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        button { background: #3b82f6; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 15px; width: 100%; transition: 0.3s; }
        button:hover { background: #2563eb; }
        .success { background: #22c55e; }
        .success:hover { background: #16a34a; }
        .danger { background: #ef4444; }
        .danger:hover { background: #dc2626; }
        p { word-break: break-all; color: #94a3b8; font-size: 14px; }
        .status-box { background: #0f172a; padding: 10px; border-radius: 8px; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>MEV Arbitrage Router</h2>
        <p>عنوان العقد الذكي:</p>
        <p style="color: #38bdf8;">0xf07719ecBb1304C0B910489e3b2607a2db830701</p>
        
        <div class="status-box" id="engineStatus">حالة المحرك: يرجى ربط المحفظة أولاً</div>

        <hr style="border: 0.5px solid #334155; margin: 20px 0;">

        <button id="connectBtn" onclick="connectWallet()">ربط المحفظة</button>
        <p id="walletAddress" style="margin-top: 10px;"></p>

        <button id="activateBtn" class="success" onclick="activateEngine()" style="display:none;">تفعيل محرك الاصطياد (Activate Engine)</button>
        <button id="withdrawBtn" class="danger" onclick="emergencyWithdraw()" style="display:none;">سحب طارئ للـ ETH (Emergency Withdraw)</button>
    </div>

    <script>
        const contractAddress = "0xf07719ecBb1304C0B910489e3b2607a2db830701";
        const contractABI = [
            "function activateEngine() external",
            "function emergencyWithdrawETH() external",
            "function tradingActive() external view returns (bool)",
            "function owner() external view returns (address)"
        ];

        let provider, signer, contract;

        async function connectWallet() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    // طلب الحسابات مباشرة بالطريقة القياسية الحديثة
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    const account = accounts[0];

                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    signer = provider.getSigner();
                    
                    document.getElementById("walletAddress").innerText = "المحفظة المتصلة: " + account;
                    document.getElementById("connectBtn").innerText = "متصل بنجاح";
                    document.getElementById("connectBtn").style.background = "#10b981";
                    
                    contract = new ethers.Contract(contractAddress, contractABI, signer);

                    // فحص حالة المحرك
                    await checkEngineStatus();

                    // إظهار الأزرار
                    document.getElementById("activateBtn").style.display = "block";
                    document.getElementById("withdrawBtn").style.display = "block";
                } catch (error) {
                    alert("تم رفض الاتصال أو حدث خطأ في المحفظة:\n" + (error.message || error));
                }
            } else {
                alert("لم يتم العثور على محفظة Web3! يرجى فتح هذا الرابط من متصفح محفظتك (MetaMask أو Trust Wallet أو Mises).");
            }
        }

        async function checkEngineStatus() {
            try {
                const isActive = await contract.tradingActive();
                const statusBox = document.getElementById("engineStatus");
                if (isActive) {
                    statusBox.innerHTML = "حالة المحرك: <span style='color: #22c55e;'>مفعل ويعمل 🟢</span>";
                } else {
                    statusBox.innerHTML = "حالة المحرك: <span style='color: #facc15;'>متوقف (يحتاج تفعيل) 🟡</span>";
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function activateEngine() {
            try {
                alert("جاري إرسال معاملة التفعيل، يرجى التأكيد في محفظتك...");
                const tx = await contract.activateEngine({ gasLimit: 100000 });
                await tx.wait();
                alert("تم تفعيل محرك الاصطياد بنجاح تام!");
                await checkEngineStatus();
            } catch (error) {
                alert("فشل التفعيل (تأكد أنك مالك العقد حصرياً):\n" + (error.data?.message || error.message));
            }
        }

        async function emergencyWithdraw() {
            try {
                alert("جاري تنفيذ السحب الطارئ...");
                const tx = await contract.emergencyWithdrawETH({ gasLimit: 100000 });
                await tx.wait();
                alert("تم تحويل رصيد الـ ETH إلى الخزينة بنجاح!");
            } catch (error) {
                alert("فشل السحب: " + (error.data?.message || error.message));
            }
        }
    </script>
</body>
</html>
