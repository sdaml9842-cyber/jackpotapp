<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABSOLUTE ZENITH // Quantum Nexus v3.0</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --bg-deep: #020408;
            --surface-glass: rgba(10, 15, 24, 0.85);
            --neon-cyan: #00ffcc;
            --neon-pink: #ff0055;
            --neon-purple: #9d00ff;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --border-cyber: rgba(0, 255, 204, 0.2);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, 'Segoe UI', Tahoma;
        }
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            padding: 12px;
            max-width: 520px;
            margin: 0 auto;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(157, 0, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 255, 204, 0.08) 0%, transparent 40%),
                linear-gradient(to bottom, #020408, #050b14);
            min-height: 100vh;
        }
        .nexus-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border: 1px solid var(--border-cyber);
            border-radius: 12px;
            background: var(--surface-glass);
            backdrop-filter: blur(12px);
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.08);
            position: sticky;
            top: 10px;
            z-index: 1000;
        }
        .nexus-logo {
            font-size: 0.9rem;
            font-weight: 900;
            color: var(--neon-cyan);
            text-shadow: 0 0 12px var(--neon-cyan);
            letter-spacing: 2px;
        }
        .quantum-connect-btn {
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink));
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.75rem;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
            transition: 0.3s;
        }
        .cyber-panel {
            background: var(--surface-glass);
            border: 1px solid var(--border-cyber);
            border-radius: 12px;
            padding: 16px;
            margin: 14px 0;
            backdrop-filter: blur(10px);
        }
        .panel-header {
            font-size: 0.8rem;
            color: var(--neon-cyan);
            font-weight: bold;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
            padding-bottom: 6px;
        }
        .cyber-group {
            margin-bottom: 10px;
        }
        .cyber-group label {
            display: block;
            font-size: 0.68rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            letter-spacing: 1px;
        }
        .cyber-input, .cyber-select {
            width: 100%;
            background: rgba(3, 5, 8, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 9px;
            color: #fff;
            font-size: 0.8rem;
            direction: ltr;
        }
        .cyber-input:focus, .cyber-select:focus {
            border-color: var(--neon-cyan);
            outline: none;
        }
        .btn-quantum-action {
            width: 100%;
            background: linear-gradient(90deg, var(--neon-purple), var(--neon-cyan));
            color: #020408;
            border: none;
            padding: 11px;
            border-radius: 6px;
            font-weight: 900;
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 6px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
            letter-spacing: 1px;
        }
        .status-box {
            margin-top: 10px;
            font-size: 0.72rem;
            color: var(--neon-cyan);
            text-align: center;
            direction: ltr;
            word-break: break-all;
        }
        .footer-nexus {
            text-align: center;
            font-size: 0.62rem;
            color: var(--text-muted);
            margin-top: 25px;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 12px;
            direction: ltr;
        }
    </style>
</head>
<body>

    <header class="nexus-header">
        <div class="nexus-logo">⚡ ZENITH // NEXUS</div>
        <button class="quantum-connect-btn" id="connectWalletBtn" onclick="connectWallet()">ربط المحفظة</button>
    </header>

    <div class="cyber-panel">
        <div class="panel-header">
            <span>🚀 إطلاق التوكن (Factory Engine)</span>
        </div>
        <div class="cyber-group">
            <label>اسم العملة (Token Name)</label>
            <input type="text" id="tokenName" class="cyber-input" placeholder="e.g. Cybernetic Zenith">
        </div>
        <div class="cyber-group">
            <label>رمز العملة (Ticker Symbol)</label>
            <input type="text" id="tokenSymbol" class="cyber-input" placeholder="e.g. $CZ">
        </div>
        <div class="cyber-group">
            <label>هدف التخرج المرن (Graduation Target BNB/ETH)</label>
            <select id="graduationTarget" class="cyber-select">
                <option value="4">4 BNB/ETH (انفجار سريع)</option>
                <option value="10" selected>10 BNB/ETH (توازن مؤسسي)</option>
                <option value="20">20 BNB/ETH (سيولة عميقة)</option>
            </select>
        </div>
        <button class="btn-quantum-action" onclick="deployNewToken()">تنفيذ النشر عبر العقد الذكي</button>
        <div class="status-box" id="statusMessage"></div>
    </div>

    <div class="footer-nexus">
        FACTORY CONTRACT: <span id="contractDisplay" style="color: var(--neon-cyan);">ضع عنوان عقدك هنا</span>
    </div>

    <script>
        // 🛠️ **خطوة أساسية:** استبدلي هذا العنوان بعنوان عقد المصنع (Factory) الحقيقي الخاص بكِ
        const FACTORY_ADDRESS = "0xYOUR_DEPLOYED_FACTORY_CONTRACT_ADDRESS";
        
        // 🛠️ تأكدي أن واجهة الـ ABI مطابقة لدالة إنشاء التوكن في عقدك الذكي
        const FACTORY_ABI = [
            "function createViralToken(string memory name, string memory symbol, uint256 graduationTarget) external payable returns (address)"
        ];

        let provider, signer;

        document.getElementById("contractDisplay").innerText = FACTORY_ADDRESS;

        async function connectWallet() {
            if (window.ethereum) {
                try {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = provider.getSigner();
                    const address = await signer.getAddress();
                    document.getElementById("connectWalletBtn").innerText = address.substring(0,6) + "..." + address.substring(address.length-4);
                    document.getElementById("statusMessage").innerText = "Connected: " + address;
                } catch (e) {
                    alert("فشل ربط المحفظة.");
                }
            } else {
                alert("يرجى استخدام متصفح يدعم Web3 (مثل Mises أو Kiwi أو MetaMask).");
            }
        }

        async function deployNewToken() {
            const name = document.getElementById("tokenName").value;
            const symbol = document.getElementById("tokenSymbol").value;
            const targetVal = document.getElementById("graduationTarget").value;

            if(!name || !symbol) {
                alert("الرجاء إدخال الاسم والرمز!");
                return;
            }
            if(!signer) {
                alert("الرجاء ربط المحفظة أولاً!");
                await connectWallet();
                return;
            }

            try {
                document.getElementById("statusMessage").innerText = "جاري تحضير المعاملة...";
                const targetWei = ethers.utils.parseEther(targetVal);
                // تعديل رسوم الإنشاء بحسب ما يطلبه عقْدك الذكي (مثلاً 0.01 أو 0)
                const creationFee = ethers.utils.parseEther("0.01"); 

                const factoryContract = new ethers.Contract(FACTORY_ADDRESS, FACTORY_ABI, signer);

                document.getElementById("statusMessage").innerText = "يرجى تأكيد المعاملة في محفظتك...";
                const tx = await factoryContract.createViralToken(name, symbol, targetWei, { value: creationFee });
                
                document.getElementById("statusMessage").innerText = `تم الإرسال! Tx: ${tx.hash}`;
                await tx.wait();
                document.getElementById("statusMessage").innerText = "🎉 تم إنشاء العملة وإطلاقها بنجاح تام على الشبكة!";
            } catch (error) {
                document.getElementById("statusMessage").innerText = "خطأ: " + (error.data?.message || error.message);
            }
        }
    </script>
</body>
</html>
