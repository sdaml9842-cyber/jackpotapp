<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemeFactory | Next-Gen Token Launchpad</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ethers.js v6 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #090d16; color: #f8fafc; }
        .glass-card {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.7) 0%, rgba(30, 41, 59, 0.4) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .glow-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.4);
            transition: all 0.3s ease;
        }
        .glow-btn:hover {
            box-shadow: 0 0 35px rgba(59, 130, 246, 0.6);
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white">

    <!-- شريط علوي أنيق واحترافي -->
    <header class="border-b border-slate-800/80 bg-slate-950/60 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/20 text-white font-black text-lg">
                    ⚡
                </div>
                <div>
                    <span class="font-extrabold text-xl tracking-tight text-white">Meme<span class="text-blue-500">Factory</span></span>
                    <span class="block text-[10px] text-slate-400 font-semibold tracking-widest uppercase">Base Protocol</span>
                </div>
            </div>
            
            <button id="connectWalletBtn" onclick="connectWallet()" class="bg-slate-900 hover:bg-slate-800 border border-slate-700/80 text-blue-400 font-semibold px-5 py-2.5 rounded-xl transition-all text-sm shadow-sm flex items-center space-x-2 space-x-reverse">
                <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
                <span>ربط المحفظة</span>
            </button>
        </div>
    </header>

    <!-- المحتوى الرئيسي الفاخر -->
    <main class="max-w-xl mx-auto px-4 py-16 w-full flex-grow flex items-center">
        <div class="glass-card rounded-3xl p-8 sm:p-10 w-full relative overflow-hidden">
            <!-- تأثيرات إضاءة خلفية ناعمة -->
            <div class="absolute -top-24 -right-24 w-56 h-56 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-24 -left-24 w-56 h-56 bg-indigo-600/10 rounded-full blur-3xl pointer-events-none"></div>

            <div class="mb-8 text-center sm:text-right">
                <span class="text-xs font-bold text-blue-400 uppercase tracking-widest bg-blue-500/10 px-3 py-1 rounded-full border border-blue-500/20">منصة إطلاق فورية</span>
                <h1 class="text-2xl sm:text-3xl font-black mt-3 text-white tracking-tight">إطلاق أصل رقمي جديد</h1>
                <p class="text-slate-400 text-sm mt-1.5">أنشئ رمزك المالي على شبكة Base بمعايير أمان موثوقة وعالية الكفاءة.</p>
            </div>

            <!-- نموذج الإطلاق -->
            <form id="launchForm" onsubmit="handleLaunch(event)" class="space-y-6">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider mb-2 text-slate-300">اسم العملة (Token Name)</label>
                    <input type="text" id="tokenName" required placeholder="مثال: Base Protocol" class="w-full bg-slate-900/90 border border-slate-800 rounded-xl px-4 py-3.5 focus:outline-none focus:border-blue-500 transition-all text-slate-100 text-sm placeholder:text-slate-600 shadow-inner">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider mb-2 text-slate-300">رمز العملة (Token Symbol)</label>
                    <input type="text" id="tokenSymbol" required placeholder="مثال: BP" class="w-full bg-slate-900/90 border border-slate-800 rounded-xl px-4 py-3.5 focus:outline-none focus:border-blue-500 transition-all text-slate-100 text-sm placeholder:text-slate-600 uppercase shadow-inner">
                </div>

                <!-- صندوق الملخص المالي الراقي -->
                <div class="bg-slate-950/50 border border-slate-800/60 rounded-2xl p-4 text-xs space-y-3 text-slate-400">
                    <div class="flex justify-between items-center">
                        <span>إجمالي المعروض الثابت:</span>
                        <span class="font-bold text-slate-200">1,000,000,000 التوكن</span>
                    </div>
                    <div class="flex justify-between items-center border-t border-slate-800/60 pt-2.5">
                        <span>رسوم الإطلاق للبروتوكول:</span>
                        <span class="font-bold text-blue-400">0.00025 ETH</span>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full glow-btn text-white font-bold py-4 rounded-xl transition-all text-sm tracking-wide">
                    تأكيد وإطلاق العملة الآن 🚀
                </button>
            </form>

            <!-- صندوق الحالة العصري -->
            <div id="statusBox" class="mt-6 hidden p-4 rounded-2xl text-xs border backdrop-blur-md"></div>
        </div>
    </main>

    <!-- الفوتر الرسمي -->
    <footer class="border-t border-slate-900 bg-slate-950/40 text-center py-6 text-xs text-slate-500">
        <p>جميع الحقوق محفوظة © 2026 - MemeFactory Protocol على شبكة Base الآمنة</p>
    </footer>

    <!-- منطق التشغيل والتفاعل التقني -->
    <script>
        const CONTRACT_ADDRESS = "0x92aBcf983Bf92f24A74D97A05d3F4e7F46A64E45";
        const BASE_CHAIN_ID = "0x2105";

        const CONTRACT_ABI = [
            {
                "inputs": [
                    { "internalType": "string", "name": "name", "type": "string" },
                    { "internalType": "string", "name": "symbol", "type": "string" }
                ],
                "name": "deployNewToken",
                "outputs": [{ "internalType": "address", "name": "", "type": "address" }],
                "stateMutability": "payable",
                "type": "function"
            },
            {
                "inputs": [{ "internalType": "address", "name": "_feeRecipient", "type": "address" }],
                "stateMutability": "nonpayable",
                "type": "constructor"
            },
            {
                "inputs": [{ "internalType": "address", "name": "owner", "type": "address" }],
                "name": "OwnableInvalidOwner",
                "type": "error"
            },
            {
                "inputs": [{ "internalType": "address", "name": "account", "type": "address" }],
                "name": "OwnableUnauthorizedAccount",
                "type": "error"
            },
            {
                "inputs": [],
                "name": "ReentrancyGuardReentrantCall",
                "type": "error"
            },
            {
                "anonymous": false,
                "inputs": [
                    { "indexed": true, "internalType": "address", "name": "previousOwner", "type": "address" },
                    { "indexed": true, "internalType": "address", "name": "newOwner", "type": "address" }
                ],
                "name": "OwnershipTransferred",
                "type": "event"
            },
            {
                "inputs": [],
                "name": "renounceOwnership",
                "outputs": [],
                "stateMutability": "nonpayable",
                "type": "function"
            },
            {
                "inputs": [{ "internalType": "uint256", "name": "_newFee", "type": "uint256" }],
                "name": "setCreationFee",
                "outputs": [],
                "stateMutability": "nonpayable",
                "type": "function"
            },
            {
                "inputs": [{ "internalType": "address", "name": "_newRecipient", "type": "address" }],
                "name": "setFeeRecipient",
                "outputs": [],
                "stateMutability": "nonpayable",
                "type": "function"
            },
            {
                "anonymous": false,
                "inputs": [
                    { "indexed": true, "internalType": "address", "name": "tokenAddress", "type": "address" },
                    { "indexed": false, "internalType": "string", "name": "name", "type": "string" },
                    { "indexed": false, "internalType": "string", "name": "symbol", "type": "string" },
                    { "indexed": true, "internalType": "address", "name": "creator", "type": "address" }
                ],
                "name": "TokenLaunched",
                "type": "event"
            },
            {
                "inputs": [{ "internalType": "address", "name": "newOwner", "type": "address" }],
                "name": "transferOwnership",
                "outputs": [],
                "stateMutability": "nonpayable",
                "type": "function"
            },
            {
                "inputs": [],
                "name": "withdrawStuckEther",
                "outputs": [],
                "stateMutability": "nonpayable",
                "type": "function"
            },
            {
                "stateMutability": "payable",
                "type": "receive"
            },
            {
                "inputs": [{ "internalType": "uint256", "name": "", "type": "uint256" }],
                "name": "allTokens",
                "outputs": [{ "internalType": "address", "name": "", "type": "address" }],
                "stateMutability": "view",
                "type": "function"
            },
            {
                "inputs": [],
                "name": "creationFee",
                "outputs": [{ "internalType": "uint256", "name": "", "type": "uint256" }],
                "stateMutability": "view",
                "type": "function"
            },
            {
                "inputs": [],
                "name": "feeRecipient",
                "outputs": [{ "internalType": "address", "name": "", "type": "address" }],
                "stateMutability": "view",
                "type": "function"
            },
            {
                "inputs": [],
                "name": "getAllTokensCount",
                "outputs": [{ "internalType": "uint256", "name": "", "type": "uint256" }],
                "stateMutability": "view",
                "type": "function"
            },
            {
                "inputs": [],
                "name": "owner",
                "outputs": [{ "internalType": "address", "name": "", "type": "address" }],
                "stateMutability": "view",
                "type": "function"
            }
        ];

        let provider, signer, contract;

        async function connectWallet() {
            if (typeof window.ethereum === "undefined") {
                showStatus("يرجى استخدام متصفح محفظة ويب 3 مدعومة.", "error");
                return;
            }

            try {
                await window.ethereum.request({ method: "eth_requestAccounts" });
                
                const chainId = await window.ethereum.request({ method: "eth_chainId" });
                if (chainId !== BASE_CHAIN_ID) {
                    try {
                        await window.ethereum.request({
                            method: "wallet_switchEthereumChain",
                            params: [{ chainId: BASE_CHAIN_ID }]
                        });
                    } catch (switchError) {
                        showStatus("يرجى التحويل إلى شبكة Base الرئيسية في محفظتك.", "error");
                        return;
                    }
                }

                provider = new ethers.BrowserProvider(window.ethereum);
                signer = await provider.getSigner();
                contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

                const address = await signer.getAddress();
                const shortAddr = address.substring(0, 6) + "..." + address.substring(address.length - 4);
                
                const btn = document.getElementById("connectWalletBtn");
                btn.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span><span>${shortAddr}</span>`;
                btn.className = "bg-slate-900 border border-slate-700 text-slate-200 font-semibold px-4 py-2.5 rounded-xl text-sm flex items-center space-x-2 space-x-reverse";
                
                showStatus("تم الاتصال بالمحفظة بنجاح.", "success");
            } catch (error) {
                console.error(error);
                showStatus("فشل الاتصال بالمحفظة.", "error");
            }
        }

        async function handleLaunch(event) {
            event.preventDefault();
            
            if (!contract) {
                showStatus("يرجى ربط المحفظة أولاً.", "error");
                await connectWallet();
                return;
            }

            const name = document.getElementById("tokenName").value.trim();
            const symbol = document.getElementById("tokenSymbol").value.trim();
            const submitBtn = document.getElementById("submitBtn");

            try {
                submitBtn.disabled = true;
                submitBtn.innerText = "جاري معالجة المعاملة...";

                const requiredFee = 250000000000000n; // 0.00025 ETH
                const txOptions = {
                    value: requiredFee,
                    gasLimit: 600000n 
                };

                showStatus("يرجى تأكيد المعاملة من داخل محفظتك...", "info");

                const tx = await contract.deployNewToken(name, symbol, txOptions);
                
                submitBtn.innerText = "جاري تأكيد المعاملة...";
                showStatus(`تم إرسال المعاملة بنجاح. <a href="https://basescan.org/tx/${tx.hash}" target="_blank" class="underline font-semibold text-blue-400">متابعة على BaseScan</a>`, "info");

                const receipt = await tx.wait();

                submitBtn.disabled = false;
                submitBtn.innerText = "تأكيد وإطلاق العملة الآن 🚀";
                
                showStatus(`تم إتمام إطلاق العملة الرقمية بنجاح.<br><a href="https://basescan.org/tx/${receipt.hash}" target="_blank" class="underline font-semibold text-blue-400">عرض تفاصيل المعاملة النهائية</a>`, "success");
                
                document.getElementById("launchForm").reset();

            } catch (error) {
                console.error(error);
                submitBtn.disabled = false;
                submitBtn.innerText = "تأكيد وإطلاق العملة الآن 🚀";
                
                let errorMsg = "حدث خطأ أثناء تنفيذ المعاملة.";
                if (error.message.includes("user rejected") || error.message.includes("ACTION_REJECTED")) {
                    errorMsg = "تم إلغاء المعاملة من قِبل المستخدم.";
                } else if (error.message.includes("insufficient funds")) {
                    errorMsg = "رصيد الإيثيريوم على شبكة Base غير كافي لدفع الرسوم والغاز.";
                }
                showStatus(errorMsg, "error");
            }
        }

        function showStatus(message, type) {
            const box = document.getElementById("statusBox");
            box.classList.remove("hidden", "bg-emerald-950/40", "border-emerald-800/60", "text-emerald-300", "bg-rose-950/40", "border-rose-800/60", "text-rose-300", "bg-blue-950/40", "border-blue-800/60", "text-blue-300");
            
            if (type === "success") {
                box.classList.add("bg-emerald-950/40", "border-emerald-800/60", "text-emerald-300");
            } else if (type === "error") {
                box.classList.add("bg-rose-950/40", "border-rose-800/60", "text-rose-300");
            } else {
                box.classList.add("bg-blue-950/40", "border-blue-800/60", "text-blue-300");
            }
            box.innerHTML = message;
        }
    </script>
</body>
</html>
