<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viral Launchpad | Binance Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.8.0/ethers.umd.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #0b0e11; color: #eaecef; }
        .bg-panel { background-color: #181a20; }
        .border-panel { border-color: #2b3139; }
        .text-binance { color: #fcd535; }
        .bg-binance { background-color: #fcd535; color: #181a20; }
        .bg-binance:hover { background-color: #f0c822; }
        .input-dark { background-color: #2b3139; border: 1px solid #474d57; color: #eaecef; }
        .input-dark:focus { border-color: #fcd535; outline: none; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0b0e11; }
        ::-webkit-scrollbar-thumb { background: #474d57; border-radius: 3px; }
    </style>
</head>
<body class="h-screen flex flex-col justify-between overflow-x-hidden">

    <!-- Topbar -->
    <header class="h-16 bg-panel border-b border-panel flex items-center justify-between px-6">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-rocket text-binance text-2xl"></i>
            <span class="font-black text-xl text-white">VIRAL LAUNCHPAD</span>
            <span class="px-2 py-0.5 bg-yellow-500/10 text-binance border border-yellow-500/30 rounded text-xs">Base Network</span>
        </div>
        <button id="connectBtn" class="bg-binance font-bold py-2 px-5 rounded hover:opacity-90 transition">
            <i class="fa-solid fa-wallet ml-2"></i> ربط المحفظة
        </button>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Creation Form -->
        <div class="lg:col-span-2 bg-panel rounded-xl border border-panel p-6 shadow-2xl flex flex-col justify-between">
            <div>
                <h2 class="text-xl font-bold mb-6 text-binance border-b border-panel pb-3">
                    <i class="fa-solid fa-plus-circle ml-2"></i> إنشاء عملة جديدة
                </h2>

                <form id="tokenForm" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-gray-400 mb-2">اسم العملة</label>
                            <input type="text" id="name" required class="w-full input-dark rounded p-3" placeholder="مثال: Viral Token">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-400 mb-2">رمز العملة (Symbol)</label>
                            <input type="text" id="symbol" required class="w-full input-dark rounded p-3" placeholder="مثال: VRL">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-400 mb-2">هدف التخرج إلى DEX (محدد بالعقد)</label>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                            <label class="cursor-pointer">
                                <input type="radio" name="target" value="4" class="peer sr-only" checked>
                                <div class="p-3 text-center rounded border border-[#474d57] peer-checked:border-[#fcd535] peer-checked:text-[#fcd535] bg-[#2b3139] font-bold">4 ETH/BNB</div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="target" value="10" class="peer sr-only">
                                <div class="p-3 text-center rounded border border-[#474d57] peer-checked:border-[#fcd535] peer-checked:text-[#fcd535] bg-[#2b3139] font-bold">10 ETH/BNB</div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="target" value="20" class="peer sr-only">
                                <div class="p-3 text-center rounded border border-[#474d57] peer-checked:border-[#fcd535] peer-checked:text-[#fcd535] bg-[#2b3139] font-bold">20 ETH/BNB</div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="target" value="50" class="peer sr-only">
                                <div class="p-3 text-center rounded border border-[#474d57] peer-checked:border-[#fcd535] peer-checked:text-[#fcd535] bg-[#2b3139] font-bold">50 ETH/BNB</div>
                            </label>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" disabled class="w-full bg-[#474d57] text-gray-400 py-4 rounded font-bold transition cursor-not-allowed">
                        قم بربط المحفظة أولاً
                    </button>
                </form>
            </div>

            <div class="mt-4 p-3 bg-gray-900 rounded border border-panel text-xs text-gray-400">
                العقد المسجل: <span class="font-mono text-gray-200">0xb641f9B099963443951180Eea91ad59390Bd1A7a</span>
            </div>
        </div>

        <!-- Terminal Logs -->
        <div class="bg-panel rounded-xl border border-panel p-4 flex flex-col h-full">
            <h3 class="text-sm font-bold border-b border-panel pb-2 text-gray-400 mb-3">
                <i class="fa-solid fa-code ml-1"></i> سجل الأحداث (Logs)
            </h3>
            <div id="logs" class="flex-1 bg-[#0b0e11] rounded p-3 font-mono text-xs overflow-y-auto space-y-2 text-gray-300">
                <div>> النظام في انتظار الاتصال بالمحفظة...</div>
            </div>
        </div>
    </main>

    <script>
        const CONTRACT_ADDRESS = "0xb641f9B099963443951180Eea91ad59390Bd1A7a";
        const BASE_CHAIN_ID = "0x2105"; // Base Mainnet (8453)
        const ABI = [
            "function creationFee() external view returns (uint256)",
            "function createViralToken(string name, string symbol, uint256 graduationTargetBnb) external payable returns (address)"
        ];

        let provider, signer, contract;

        function log(msg, color = "text-gray-300") {
            const logsDiv = document.getElementById("logs");
            logsDiv.innerHTML += `<div class="${color}">> ${msg}</div>`;
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        async function ensureBaseNetwork() {
            const network = await provider.getNetwork();
            if (network.chainId !== 8453n) {
                log("جاري طلب التحويل إلى شبكة Base...", "text-yellow-400");
                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: BASE_CHAIN_ID }],
                    });
                } catch (err) {
                    if (err.code === 4902) {
                        await window.ethereum.request({
                            method: 'wallet_addEthereumChain',
                            params: [{
                                chainId: BASE_CHAIN_ID,
                                chainName: 'Base Mainnet',
                                nativeCurrency: { name: 'ETH', symbol: 'ETH', decimals: 18 },
                                rpcUrls: ['https://mainnet.base.org'],
                                blockExplorerUrls: ['https://basescan.org']
                            }],
                        });
                    } else {
                        throw err;
                    }
                }
            }
        }

        document.getElementById("connectBtn").addEventListener("click", async () => {
            if (!window.ethereum) {
                alert("يرجى استخدام متصفح يحتوي على محفظة MetaMask");
                return;
            }

            try {
                provider = new ethers.BrowserProvider(window.ethereum);
                await ensureBaseNetwork();
                signer = await provider.getSigner();
                contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);

                const address = await signer.getAddress();
                document.getElementById("connectBtn").innerText = `${address.substring(0,6)}...${address.substring(address.length-4)}`;
                
                const submitBtn = document.getElementById("submitBtn");
                submitBtn.disabled = false;
                submitBtn.className = "w-full bg-binance text-[#181a20] py-4 rounded font-bold hover:opacity-90 transition";
                submitBtn.innerText = "إنشاء العملة الآن";

                log(`تم الاتصال بالمحفظة: ${address}`, "text-green-400");
            } catch (err) {
                log(`فشل الاتصال: ${err.message}`, "text-red-400");
            }
        });

        document.getElementById("tokenForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            if (!contract) return;

            const name = document.getElementById("name").value;
            const symbol = document.getElementById("symbol").value;
            const targetVal = document.querySelector('input[name="target"]:checked').value;

            try {
                await ensureBaseNetwork();
                log(`جاري قراءة رسوم الإنشاء للهدف ${targetVal}...`);
                
                const fee = await contract.creationFee();
                const targetWei = ethers.parseEther(targetVal); // التحويل الدقيق إلى Wei لتجاوز Revert العقد

                log(`إرسال المعاملة... الرسوم المطلوب إرسالها: ${ethers.formatEther(fee)} ETH`, "text-yellow-400");
                
                const tx = await contract.createViralToken(name, symbol, targetWei, { value: fee });
                log(`تم إرسال المعاملة. الهاش: ${tx.hash}`, "text-yellow-400");

                const receipt = await tx.wait();
                log(`تمت المعاملة بنجاح في الكتلة: ${receipt.blockNumber}`, "text-green-400");
            } catch (err) {
                log(`خطأ في المعاملة: ${err.reason || err.message}`, "text-red-400");
            }
        });
    </script>
</body>
</html>
