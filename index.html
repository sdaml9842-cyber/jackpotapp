    async function connectWallet() {
        const t = translations[currentLang];

            const provider = window.phantom?.solana || window.solana;
            if (provider && provider.isPhantom) {
                const response = await provider.connect();
                userAddress = response.publicKey.toString();
            } else {
                const currentUrl = window.location.href;
                window.location.href = `https://phantom.app/ul/browse/${encodeURIComponent(currentUrl)}?ref=${encodeURIComponent(window.location.origin)}`;
                return;
            }
        } catch (err) {
            showStatus("Connection canceled or failed.", "error");
            return;
        }

        if(userAddress) {
            const shortAddr = userAddress.substring(0, 4) + "..." + userAddress.substring(userAddress.length - 4);
            document.getElementById("connectWalletBtn").innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span><span>${shortAddr}</span>`;
            document.getElementById('referralLinkInput').value = `${window.location.origin}${window.location.pathname}?ref=${userAddress}`;
            showStatus(t.walletConnectedMsg, "success");
        }
    }

    function initCanvas() {
        canvas = document.getElementById('logoCanvas');
        if(!canvas) return;
        ctx = canvas.getContext('2d');
        ctx.strokeStyle = brushColor;
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.fillStyle = '#080c14';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startPosition(e.touches[0]); });
        canvas.addEventListener('touchend', (e) => { e.preventDefault(); endPosition(); });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e.touches[0]); });
    }

    function setBrushColor(color, element) {
        brushColor = color;
        if(ctx) ctx.strokeStyle = brushColor;
        document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('active'));
        element.classList.add('active');
    }

    function startPosition(e) { painting = true; draw(e); }
    function endPosition() { painting = false; ctx.beginPath(); }
    function draw(e) {
        if(!painting) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.pageX) - rect.left;
        const y = (e.clientY || e.pageY) - rect.top;
        ctx.strokeStyle = brushColor;
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);
    }
    function clearCanvas() {
        if(!ctx) return;
        ctx.fillStyle = '#080c14';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    function useCanvasAsLogo() {
        if(!canvas) return;
        const dataUrl = canvas.toDataURL('image/png');
        document.getElementById('previewLogoContainer').innerHTML = `<img src="${dataUrl}" class="w-full h-full object-cover rounded-lg">`;
        showStatus(currentLang === 'ar' ? "تم اعتماد الرسم الحر بنجاح!" : "Custom drawing applied successfully!", "success");
