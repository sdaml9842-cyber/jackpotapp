<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viral Tsunami Launchpad - Base</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ethers.js v6 CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.11.1/ethers.umd.min.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .gradient-text {
            background: linear-gradient(135deg, #06b6d4, #3b82f6, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-[#030712] text-white min-h-screen flex flex-col items-center py-10 px-4">

    <!-- Header -->
    <header class="w-full max-w-4xl flex justify-between items-center mb-10 border-b border-gray-800 pb-5">
        <div class="flex items-center gap-3">
            <span class="text-3xl">🌊</span>
            <span class="font-black text-2xl tracking-wider gradient-text">TSUNAMI</span>
        </div>
        <button id="connectBtn" onclick="connectWallet()" class="bg-gradient-to-r from-cyan-500 to-blue-600 font-bold px-6 py-3 rounded-xl hover:opacity-90 transition-all shadow-[0_0_20px_rgba(6,182,212,0.4)]">
            ربط المحفظة
        </button>
    </header>

    <!-- App Container -->
    <main class="w-full max-w-2xl space-y-8">

        <!-- 1. Section: Create Token / Launchpad -->
        <div id="launchpadCard" class="bg-gray-900/80 border border-cyan-500/30 p-8 rounded-3xl shadow-2xl space-y-6">
            <div class="text-center">
                <h2 class="text-3xl font-black gradient-text">إطلاق عملة فيروسية جديدة</h2>
                <p class="text-gray-400 text-sm mt-2">عبر الفاكتوري الموثق على شبكة Base</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-cyan-400 mb-1">اسم العملة (Token Name)</label>
                    <input type="text" id="tokenName" placeholder="مثال: Viral Tsunami" class="w-full bg-black border border-gray-800 rounded-xl p-4 text-white focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-cyan-400 mb-1">الرمز (Symbol)</label>
                    <input type="text" id="tokenSymbol" placeholder="مثال: TSUNAMI" class="w-full bg-black border border-gray-800 rounded-xl p-4 text-white focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-cyan-400 mb-1">هدف التخرج (ETH)</label>
                    <select id="graduationTarget" class="w-full bg-black border border-gray-800 rounded-xl p-4 text-white focus:outline-none focus:border-cyan-500">
                        <option value="4">4 ETH</option>
                        <option value="10" selected>10 ETH</option>
                        <option value="20">20 ETH</option>
                        <option value="50">50 ETH</option>
                    </select>
                </div>
                <button onclick="createToken()" class="w-full bg-gradient-to-r from-cyan-500 to-purple-600 font-black text-lg py-4 rounded-xl hover:scale-[1.01] transition-transform shadow-[0_0_25px_rgba(6,182,212,0.4)]">
                    إنشاء ونشر العملة
                </button>
            </div>

            <!-- Enter Existing Token Address -->
            <div class="border-t border-gray-800 pt-6 text-center">
                <p class="text-gray-400 text-xs mb-3">أو ادخل عنوان عملة تم إنشاؤها سابقاً للتداول:</p>
                <div class="flex gap-2">
                    <input type="text" id="existingAddress" placeholder="0x..." class="flex-1 bg-black border border-gray-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-cyan-500">
                    <button onclick="loadTokenDashboard()" class="bg-cyan-500/20 text-cyan-400 border border-cyan-500/50 px-5 font-bold rounded-xl hover:bg-cyan-500/30">
                        فتح
                    </button>
                </div>
            </div>
        </div>

        <!-- 2. Section: Token Trading Dashboard (Ape & HFT Terminal) -->
        <div id="dashboardCard" class="hidden bg-gray-900 border border-gray-800 p-8 rounded-3xl shadow-2xl space-y-6">
            <div class="flex justify-between items-center border-b border-gray-800 pb-4">
                <button onclick="showLaunchpad()" class="text-xs font-bold text-gray-400 hover:text-white">← العودة للفاكتوري</button>
                <span id="activeTokenAddr" class="text-xs font-mono text-cyan-400"></span>
            </div>

            <!-- Mode Selector -->
            <div class="flex gap-3 bg-black p-2 rounded-2xl border border-gray-800">
                <button id="apeTabBtn" onclick="switchTab('ape')" class="flex-1 py-3 font-bold rounded-xl bg-cyan-500 text-white">🦍 Ape & Whales</button>
                <button id="terminalTabBtn" onclick="switchTab('terminal')" class="flex-1 py-3 font-bold font-mono rounded-xl text-gray-500">🤖 HFT Terminal</button>
            </div>

            <!-- Ape View -->
            <div id="apeView" class="space-y-6">
                <div>
                    <div class="flex justify-between text-cyan-400 font-bold text-sm mb-2">
                        <span>تقدم التخرج لـ DEX</span>
                        <span id="progressText">0%</span>
                    </div>
                    <div class="w-full bg-black rounded-full h-5 overflow-hidden border border-gray-800">
                        <div id="progressBar" class="bg-gradient-to-r from-cyan-500 to-purple-600 h-full w-0 transition-all duration-500"></div>
                    </div>
                </div>

                <div class="bg-orange-500/10 border border-orange-500/30 p-4 rounded-2xl flex justify-between items-center">
                    <div>
                        <h4 class="text-orange-400 font-bold">🔥 Hot Streak Active!</h4>
                        <p class="text-xs text-gray-400">رسوم الشراء منخفضة الآن لتوالي العمليات</p>
                    </div>
                    <span class="text-3xl font-black text-orange-500">0.25%</span>
                </div>

                <div class="space-y-3">
                    <input type="number" id="buyAmount" placeholder="0.01 ETH" class="w-full bg-black border border-gray-800 text-white text-2xl font-bold p-4 rounded-2xl focus:outline-none focus:border-cyan-500">
                    <button onclick="executeBuy()" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 font-black text-xl py-5 rounded-2xl hover:scale-[1.01] transition-transform shadow-[0_0_30px_rgba(6,182,212,0.4)]">
                        APE IN NOW 🚀
                    </button>
                </div>
            </div>

            <!-- Terminal View -->
            <div id="terminalView" class="hidden space-y-6 font-mono text-green-500">
                <div class="bg-black p-4 rounded-2xl border border-green-900 flex justify-between">
                    <div>
                        <div class="text-xs text-gray-500">ARBITRAGE BOUNTY POOL</div>
                        <div id="bountyPoolVal" class="text-2xl font-bold text-yellow-400">0.00 ETH</div>
                    </div>
                    <div>
                        <div class="text-xs text-gray-500">FLASH LOAN FEE</div>
                        <div class="text-2xl font-bold text-purple-400">1 BPS</div>
                    </div>
                </div>
                <button onclick="executeBounty()" class="w-full bg-green-900/30 border border-green-500 text-green-400 font-bold py-4 rounded-xl hover:bg-green-800/50">
                    &gt; EXECUTE_ARBITRAGE_BOUNTY
                </button>
            </div>
        </div>
    </main>

    <!-- Logic Script -->
    <script>
        const FACTORY_ADDRESS = "0xb641f9B099963443951180Eea91ad59390Bd1A7a";
        const FACTORY_ABI = [
            "function createViralToken(string name, string symbol, uint256 graduationTargetBnb) payable returns (address)",
            "function creationFee() view returns (uint256)"
        ];
        const TOKEN_ABI = [
            "function realBnbReserve() view returns (uint256)",
            "function graduationTargetBnb() view returns (uint256)",
            "function bountyPoolBalance() view returns (uint256)",
            "function buy(uint256 minTokensOut, address referrer) payable",
            "function executeArbitrageBounty(uint256 minTokensOut, uint256 bountyRewardRequested, address referrer) payable"
        ];

        let provider, signer, currentTokenAddr;

        async function connectWallet() {
            if (window.ethereum) {
                provider = new ethers.BrowserProvider(window.ethereum);
                signer = await provider.getSigner();
                const userAddr = await signer.getAddress();
                
                // Ensure Base Chain (0x2105)
                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: '0x2105' }],
                    });
                } catch (e) {}

                document.getElementById('connectBtn').innerText = userAddr.slice(0, 6) + "..." + userAddr.slice(-4);
            } else {
                alert("يرجى تثبيت محفظة MetaMask أو محفظة Web3 أخرى!");
            }
        }

        async function createToken() {
            if (!signer) await connectWallet();
            const name = document.getElementById('tokenName').value;
            const symbol = document.getElementById('tokenSymbol').value;
            const target = document.getElementById('graduationTarget').value;

            if (!name || !symbol) return alert("يرجى تعبئة الاسم والرمز!");

            const factoryContract = new ethers.Contract(FACTORY_ADDRESS, FACTORY_ABI, signer);
            try {
                const fee = await factoryContract.creationFee();
                const tx = await factoryContract.createViralToken(name, symbol, ethers.parseEther(target), { value: fee });
                alert("تم إرسال المعاملة! انتظر التأكيد ثم استخرج العنوان من BaseScan.");
            } catch (err) {
                alert("خطأ: " + err.message);
            }
        }

        function loadTokenDashboard() {
            const addr = document.getElementById('existingAddress').value;
            if (!ethers.isAddress(addr)) return alert("العنوان غير صحيح!");
            currentTokenAddr = addr;
            document.getElementById('activeTokenAddr').innerText = addr.slice(0, 6) + "..." + addr.slice(-4);
            document.getElementById('launchpadCard').classList.add('hidden');
            document.getElementById('dashboardCard').classList.remove('hidden');
            updateDashboardData();
        }

        function showLaunchpad() {
            document.getElementById('dashboardCard').classList.add('hidden');
            document.getElementById('launchpadCard').classList.remove('hidden');
        }

        async function updateDashboardData() {
            if (!currentTokenAddr || !provider) return;
            const tokenContract = new ethers.Contract(currentTokenAddr, TOKEN_ABI, provider);
            try {
                const reserve = await tokenContract.realBnbReserve();
                const target = await tokenContract.graduationTargetBnb();
                const bounty = await tokenContract.bountyPoolBalance();

                const progress = (Number(reserve) / Number(target)) * 100;
                document.getElementById('progressText').innerText = progress.toFixed(2) + "%";
                document.getElementById('progressBar').style.width = Math.min(progress, 100) + "%";
                document.getElementById('bountyPoolVal').innerText = ethers.formatEther(bounty) + " ETH";
            } catch (e) {}
        }

        function switchTab(tab) {
            if (tab === 'ape') {
                document.getElementById('apeView').classList.remove('hidden');
                document.getElementById('terminalView').classList.add('hidden');
                document.getElementById('apeTabBtn').className = "flex-1 py-3 font-bold rounded-xl bg-cyan-500 text-white";
                document.getElementById('terminalTabBtn').className = "flex-1 py-3 font-bold font-mono rounded-xl text-gray-500";
            } else {
                document.getElementById('apeView').classList.add('hidden');
                document.getElementById('terminalView').classList.remove('hidden');
                document.getElementById('terminalTabBtn').className = "flex-1 py-3 font-bold font-mono rounded-xl bg-green-950 text-green-400 border border-green-500";
                document.getElementById('apeTabBtn').className = "flex-1 py-3 font-bold rounded-xl text-gray-500";
            }
        }

        async function executeBuy() {
            if (!signer) await connectWallet();
            const amount = document.getElementById('buyAmount').value;
            if (!amount) return;
            const tokenContract = new ethers.Contract(currentTokenAddr, TOKEN_ABI, signer);
            try {
                const tx = await tokenContract.buy(0, ethers.ZeroAddress, { value: ethers.parseEther(amount) });
                await tx.wait();
                alert("تمت عملية الشراء بنجاح!");
                updateDashboardData();
            } catch (e) {
                alert("خطأ: " + e.message);
            }
        }
    </script>
</body>
</html>
