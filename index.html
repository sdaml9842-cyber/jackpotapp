<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChainPump | Base Network Launchpad</title>
    <!-- Ethers.js v5 -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-green: #10b981;
            --accent-blue: #0052ff;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 15px;
        }

        .app-container {
            width: 100%; max-width: 480px; background: var(--card-bg);
            border: 1px solid var(--border-color); border-radius: 20px;
            padding: 20px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .header { text-align: center; margin-bottom: 12px; }
        .header h1 {
            font-size: 20px; font-weight: 800;
            background: linear-gradient(135deg, #0052ff, var(--accent-green));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header p { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

        /* شريط جاهزية العقد */
        .readiness-bar-container {
            background: #0b0f19; border: 1px solid var(--border-color);
            border-radius: 8px; padding: 8px; margin-bottom: 12px;
        }
        .readiness-text { font-size: 10px; display: flex; justify-content: space-between; margin-bottom: 4px; color: var(--text-muted); }
        .progress-bar { width: 100%; height: 6px; background: #1f2937; border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent-green); width: 50%; transition: width 0.3s ease; }

        /* معاينة حية للبطاقة */
        .live-preview {
            background: linear-gradient(135deg, #1f2937, #0b0f19);
            border: 1px dashed var(--accent-blue); border-radius: 12px;
            padding: 10px; margin-bottom: 12px; display: flex; align-items: center; gap: 10px;
        }
        .preview-avatar { width: 40px; height: 40px; border-radius: 50%; background: #0052ff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; overflow: hidden; }
        .preview-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .preview-info { font-size: 11px; }
        .preview-info .p-name { font-weight: 700; color: #fff; }
        .preview-info .p-symbol { color: #38bdf8; font-size: 9px; }

        .btn {
            width: 100%; border: none; padding: 11px; border-radius: 10px;
            font-size: 12px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: 0.2s;
        }
        .btn-wallet { background: var(--accent-blue); color: white; margin-bottom: 10px; }
        .btn-green { background: var(--accent-green); color: white; margin-top: 10px; }
        .btn-clear { background: #ef4444; color: white; padding: 5px 10px; font-size: 10px; border-radius: 6px; }

        .wallet-status { font-size: 10px; color: #38bdf8; text-align: center; margin-bottom: 12px; word-break: break-all; }

        .section-card {
            background: #0b0f19; border: 1px solid var(--border-color);
            border-radius: 12px; padding: 12px; margin-bottom: 12px;
        }
        .section-title {
            font-size: 11px; font-weight: 700; color: #38bdf8;
            margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
            border-bottom: 1px solid var(--border-color); padding-bottom: 6px;
        }

        .form-group { margin-bottom: 10px; }
        label { display: block; font-size: 10px; color: var(--text-muted); margin-bottom: 3px; }
        input { width: 100%; padding: 9px; background: #111827; border: 1px solid var(--border-color); color: white; border-radius: 8px; font-size: 12px; outline: none; }
        
        .logo-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
        .logo-tab { flex: 1; padding: 7px; background: #111827; border: 1px solid var(--border-color); color: var(--text-muted); border-radius: 6px; cursor: pointer; font-size: 10px; font-weight: bold; text-align: center; transition: 0.2s; }
        .logo-tab.active { background: rgba(0, 82, 255, 0.2); border-color: var(--accent-blue); color: #38bdf8; }

        .drawing-container { background: #111827; border: 1px solid var(--border-color); border-radius: 10px; padding: 8px; text-align: center; }
        canvas { background: #ffffff; width: 100%; height: 110px; border-radius: 6px; cursor: crosshair; touch-action: none; display: block; }
        .drawing-tools { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
        .color-picker { width: 26px; height: 26px; border: none; border-radius: 50%; cursor: pointer; background: transparent; }

        .ai-presets { display: flex; gap: 4px; margin-bottom: 6px; flex-wrap: wrap; }
        .ai-chip { font-size: 9px; background: #1f2937; border: 1px solid var(--border-color); color: #38bdf8; padding: 3px 6px; border-radius: 4px; cursor: pointer; }
        .ai-chip:hover { background: var(--accent-blue); color: #fff; }

        .ai-result-box { margin-top: 8px; text-align: center; }
        .ai-result-box img { max-width: 90px; height: 90px; border-radius: 8px; border: 1px solid var(--accent-blue); object-fit: cover; margin-top: 5px; }

        .price-tag {
            font-size: 10px; color: var(--accent-green); margin-top: 4px; font-weight: 600;
            display: flex; justify-content: space-between;
        }

        .status-box { font-size: 10px; text-align: center; padding: 7px; background: #0b0f19; border-radius: 8px; border: 1px solid var(--border-color); margin-top: 10px; color: #38bdf8; word-break: break-all; }
    </style>
</head>

        <h1>⚡ ChainPump Base</h1>
        <p>Next-Gen Secure Launchpad</p>
    </div>

        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>
