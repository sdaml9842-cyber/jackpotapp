<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تداول العقد | Quantum Launchpad</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4 font-sans">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <div class="inline-flex items-center gap-2 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-full text-emerald-400 text-xs font-semibold">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                تم تفعيل التداول بنجاح
            </div>
            <h1 class="text-xl font-extrabold tracking-tight text-white">إدارة عقد المفترس</h1>
            <p class="text-[11px] text-slate-400 font-mono break-all bg-slate-950 p-2 rounded-xl border border-slate-800">
                0x93eb91E922784eE08bFf436b5be1F0A86990eDD1
            </p>
        </div>

        <!-- Connect Button -->
        <button id="connectBtn" onclick="connectWallet()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-2xl transition shadow-lg shadow-blue-950 flex items-center justify-center gap-2 text-sm">
            <span>ربط المحفظة</span>
        </button>

        <hr class="border-slate-800">

        <!-- Actions -->
        <div class="space-y-4">
            <!-- Test Buy Section -->
            <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3">
                <label class="block text-xs font-medium text-slate-400">حدد كمية BNB للشراء (تأكد من إرسال قيمة أكبر من الصفر)</label>
                <div class="flex gap-2">
                    <input type="number" id="buyAmount" value="0.001" step="0.0001" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-white text-sm text-center focus:outline-none focus:border-emerald-500">
                    <button onclick="executeBuy()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-5 py-2 rounded-xl text-xs whitespace-nowrap transition shadow-lg shadow-emerald-950">
                        شراء الآن
                    </button>
                </div>
            </div>
        </div>

        <!-- Status Log -->
        <div id="status" class="text-center text-xs text-slate-400 bg-slate-950/50 p-3 rounded-xl min-h-[50px] flex items-center justify-center border border-slate-900">
            جاهز للاستخدام، يرجى ربط المحفظة...
        </div>

    </div>

    <script>
        const contractAddress = "0x93eb91E922784eE08bFf436b5be1F0A86990eDD1";
        const contractABI = [
            "function executePredatorBuy() external payable"
        ];

        let provider, signer, contract;

        async function connectWallet() {
            if (window.ethereum) {
                try {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", [], );
                    signer = provider.getSigner();
                    contract = new ethers.Contract(contractAddress, contractABI, signer);
                    
                    const address = await signer.getAddress();
                    document.getElementById("connectBtninnerText" || "connectBtn").innerText = "تم الربط: " + address.substring(0, 6) + "..." + address.substring(38);
                    document.getElementById("connectBtn").className = "w-full bg-slate-800 text-white font-bold py-3.5 rounded-2xl transition border border-slate-700 text-sm";
                    document.getElementById("status").innerText = "المحفظة متصلة بنجاح، يمكنك تنفيذ الشراء.";
                } catch (err) {
                    console.error(err);
                    document.getElementById("status").innerText = "فشل الاتصال بالمحفظة.";
                }
            } else {
                alert("يرجى فتح الصفحة من داخل متصفح يدعم Web3 (مثل MetaMask Mobile)!");
            }
        }

        async function executeBuy() {
            if (!contract) {
                alert("يرجى ربط المحفظة أولاً!");
                return;
            }
            try {
                const amount = document.getElementById("buyAmount").value;
                if(!amount || parseFloat(amount) <= 0) {
                    alert("الرجاء إدخال قيمة صحيحة للـ BNB أكبر من الصفر");
                    return;
                }
                
                const txValue = ethers.utils.parseEther(amount.toString());
                
                document.getElementById("status").innerText = "جاري إرسال معاملة الشراء وتحويل الـ BNB...";
                
                // إرسال المعاملة مع تحديد قيمة الـ value بـ Wei بشكل صحيح
                const tx = await contract.executePredatorBuy({ 
                    value: txValue,
                    gasLimit: 300000 // تخصيص حد أمان للغاز لضمان النجاح
                });
                
                document.getElementById("status").innerText = "تم إرسال المعاملة، بانتظار التأكيد...";
                await tx.wait();
                
                document.getElementById("status").innerHTML = "<span class='text-emerald-400 font-bold'>✅ تمت عملية الشراء بنجاح وتم تنشيط Mempool العقد!</span>";
            } catch (err) {
                console.error(err);
                let errMsg = err.data?.message || err.message || "خطأ غير معروف";
                document.getElementById("status").innerText = "فشلت المعاملة: " + errMsg;
            }
        }
    </script>
</body>
</html>
