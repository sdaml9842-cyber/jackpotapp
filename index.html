<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أداة سحب المجمع مباشرة</title>
    <!-- تضمين مكتبة Ethers.js للتعامل مع Web3 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; padding: 20px; text-align: center; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; max-width: 400px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; }
        button { background: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        button:hover { background: #059669; }
        #status { margin-top: 15px; font-size: 14px; word-break: break-all; }
    </style>
</head>
<body>

    <div class="card">
        <h2>سحب المجمع مباشرة</h2>
        <button onclick="connectWallet()">ربط المحفظة</button>
        <p id="walletAddress" style="font-size: 12px; color: #94a3b8;"></p>

        <hr style="border-color: #475569; margin: 15px 0;">

        <!-- حقول مخصصة حسب نوع العقد والدالة المراد استدعاؤها -->
        <label>عنوان عقد المجمع (LP/Router):</label>
        <input type="text" id="contractAddress" placeholder="0x...">

        <label>الكمية أو معرف المركز (Token ID / Liquidity):</label>
        <input type="text" id="amountOrId" placeholder="أدخل القيمة أو الـ ID">

        <button onclick="withdrawLiquidity()">تنفيذ السحب</button>

        <div id="status"></div>
    </div>

    <script>
        let provider, signer, userAddress;

        async function connectWallet() {
            if (window.ethereum) {
                try {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = provider.getSigner();
                    userAddress = await signer.getAddress();
                    document.getElementById("walletAddress").innerText = "تم الاتصال: " + userAddress;
                } catch (error) {
                    document.getElementById("status").innerText = "فشل الاتصال: " + error.message;
                }
            } else {
                alert("يرجى فتح الصفحة من متصفح يدعم المحافظ (مثل MetaMask أو Mises)");
            }
        }

        async function withdrawLiquidity() {
            const address = document.getElementById("contractAddress").value;
            const amountOrId = document.getElementById("amountOrId").value;

            if (!address || !amountOrId) {
                alert("الرجاء ملء جميع الحقول");
                return;
            }

            try {
                document.getElementById("status").innerText = "جاري تنفيذ المعاملة...";

                // مثال على ABI مبسط لدالة سحب شائعة (يمكنك تعديله حسب دالة العقد الفعلية لديك مثل removeLiquidity أو withdraw)
                const abi = [
                    "function withdraw(uint256 amount) external",
                    "function removeLiquidity(address tokenA, address tokenB, uint liquidity, uint amountAMin, uint amountBMin, address to, uint deadline) external returns (uint amountA, uint amountB)"
                ];

                const contract = new ethers.Contract(address, abi, signer);
                
                // استدعاء الدالة (تأكد من مطابقة اسم الدالة والباراميترات لعقدك المحدد)
                const tx = await contract.withdraw(amountOrId); 
                
                document.getElementById("status").innerText = "تم إرسال المعاملة، بانتظار التأكيد...\nHash: " + tx.hash;
                await tx.wait();
                document.getElementById("status").innerText = "تم السحب بنجاح!";
            } catch (error) {
                document.getElementById("status").innerText = "حدث خطأ: " + (error.data?.message || error.message);
            }
        }
    </script>
</body>
</html>
