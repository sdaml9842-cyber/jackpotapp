<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3 Stealth DApp</title>
    <!-- استدعاء مكتبة Firebase الرسمية والخفيفة -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151d2a;
            --text-color: #f3f4f6;
            --accent-green: #10b981;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* شريط التنقل العلوي (Header) */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background-color: var(--card-bg);
            border-bottom: 1px solid #1f2937;
        }

        .logo {
            font-weight: bold;
            font-size: 18px;
            color: var(--accent-green);
        }

        /* عنصر التمويه الذكي: يبدو كمؤشر شبكة عادي */
        .network-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: #10b981;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
            transition: transform 0.2s;
        }

        /* المحتوى الرئيسي للمنصة */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #1e293b;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ DApp Engine</div>
        
        <!-- عنصر التمويه (Stealth Trigger) -->
        <div class="network-badge" id="stealth-trigger" title="Network Status">
            <span class="status-dot"></span>
            <span id="badge-text">BSC Mainnet</span>
        </div>
    </header>

    <main>
        <div class="card">
            <h2>Web3 Application Portal</h2>
            <p style="color: #9ca3af;">Smart contracts connected & protocol ready.</p>
        </div>
    </main>

    <script>
        // 1. إعدادات Firebase الخاصة بك (احصل عليها مجاناً في 2 دقيقة من firebase.google.com)
        const firebaseConfig = {
            databaseURL: "https://YOUR-DATABASE-NAME.firebaseio.com" // 👈 ضع رابط قاعدة البيانات هنا
        };

        // تهيئة الخدمة
        if (firebaseConfig.databaseURL !== "https://YOUR-DATABASE-NAME.firebaseio.com") {
            firebase.initializeApp(firebaseConfig);
            const db = firebase.database();
            const visitsRef = db.ref('stats/visitors');

            // تسجيل زيارة جديدة واحدة لكل الجلسة (Session)
            if (!sessionStorage.getItem('v_recorded')) {
                visitsRef.transaction((current) => (current || 0) + 1);
                sessionStorage.setItem('v_recorded', 'true');
            }
        }

        // 2. خدعة التمويه العبقرية (Stealth Toggle Mechanics)
        const trigger = document.getElementById('stealth-trigger');
        const badgeText = document.getElementById('badge-text');
        const originalText = badgeText.textContent;
        let clickTimer = null;
        let clicks = 0;

        trigger.addEventListener('click', () => {
            clicks++;
            if (clicks === 1) {
                clickTimer = setTimeout(() => { clicks = 0; }, 1500); // إعطاء مهلة ثانيتين للنقرات
            } else if (clicks === 3) { // عند النقر 3 مرات متتالية بسرعة
                clearTimeout(clickTimer);
                clicks = 0;
                revealVisitorCount();
            }
        });

        async function revealVisitorCount() {
            // جلب الرقم الحقيقي من Firebase أو حساب محلي ذكي
            badgeText.style.color = '#ffffff';
            badgeText.textContent = 'Fetching...';

            if (typeof firebase !== 'undefined' && firebase.apps.length) {
                const snapshot = await firebase.database().ref('stats/visitors').once('value');
                const count = snapshot.val() || 0;
                badgeText.textContent = `👁️ ${count.toLocaleString()} Users`;
            } else {
                // وضع محاكاة تلقائي في حال عدم ربط Firebase بعد
                badgeText.textContent = `👁️ 1,482 Users`;
            }

            // العودة لوضع التمويه الطبيعي تلقائياً بعد 4 ثوانٍ
            setTimeout(() => {
                badgeText.style.color = '#10b981';
                badgeText.textContent = originalText;
            }, 4000);
        }
    </script>
</body>
</html>
