<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusMeme - Pikachu & Poké Ball Launchpad</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ethers.js v6 CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #0b0f19; color: #f1f5f9; }
        .institutional-border { border: 1px solid rgba(234, 179, 8, 0.2); }
        .pikachu-glow { box-shadow: 0 0 25px rgba(234, 179, 8, 0.15); }
        .pokeball-btn { transition: all 0.2s ease; }
        .pokeball-btn:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
        button:active { transform: scale(0.98); }
        .btn-loading { opacity: 0.7; pointer-events: none; }
        @keyframes bounce-ball {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .animate-bounce-ball { animation: bounce-ball 1.5s infinite ease-in-out; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Navbar -->
    <nav class="border-b border-slate-800 bg-slate-950/90 backdrop-blur-md sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3 space-x-reverse">
            <div class="w-10 h-10 rounded-xl bg-amber-500 flex items-center justify-center shadow-lg shadow-amber-500/30 animate-bounce-ball">
                <i class="fa-solid fa-bolt text-slate-950 text-xl font-black"></i>
            </div>
            <div>
                <span class="text-xl font-black tracking-tight text-white">NEXUS <span class="text-amber-400">PIKACHU</span></span>
                <span class="block text-[10px] text-amber-500 font-bold uppercase tracking-wider">بروتوكول اصطياد الأصول وكرات البوكيمون</span>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="hidden md:flex items-center gap-2 text-xs text-amber-300 bg-slate-900 px-3 py-1.5 rounded-lg institutional-border">
                <i class="fa-solid fa-circle text-amber-400 text-[8px] animate-pulse"></i>
                <span>درع بيكاتشو الذكي: نشط</span>
            </div>
            <button id="connectWalletBtn" onclick="connectWallet()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-5 py-2.5 rounded-xl transition-all shadow-md flex items-center gap-2 cursor-pointer text-sm">
                <i class="fa-solid fa-wallet"></i>
                <span id="walletBtnText">ربط المحفظة</span>
            </button>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-6 w-full">
        
        <!-- Create Token Section (5 Cols) -->
        <section class="lg:col-span-5 bg-slate-900/90 institutional-border pikachu-glow rounded-2xl p-6 shadow-2xl flex flex-col justify-between backdrop-blur-md">
            <div>
                <div class="flex items-center gap-3 mb-6 pb-4 border-b border-slate-800">
                    <div class="p-3 bg-amber-500/10 text-amber-400 rounded-xl">
                        <i class="fa-solid fa-wand-magic-sparkles text-xl"></i>
                    </div>
                    <div>
                        <h2 class="text-base font-bold text-white">إصدار أصل جديد بكرة البوكيمون</h2>
                        <p class="text-xs text-slate-400">ولادة العملة داخل كرة الإنشاء الآمنة</p>
                    </div>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1.5">اسم الأصل (Token Name)</label>
                        <input type="text" id="tokenName" placeholder="مثال: Pikachu Coin" class="w-full bg-slate-950 institutional-border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500 text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1.5">رمز التداول (Token Symbol)</label>
                        <input type="text" id="tokenSymbol" placeholder="مثال: PIKA" class="w-full bg-slate-950 institutional-border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500 text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1.5">هدف تخرج كرة البوكيمون (BNB)</label>
                        <select id="graduationTarget" class="w-full bg-slate-950 institutional-border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500 text-white">
                            <option value="4">4 BNB (كرة بوكيمون العادية)</option>
                            <option value="10" selected>10 BNB (كرة الدبليو القياسية)</option>
                            <option value="20">20 BNB (الكرة الفائقة Ultra Ball)</option>
                            <option value="50">50 BNB (الكرة الرئيسية Master Ball)</option>
                        </select>
                    </div>
                    
                    <!-- Pikachu Protection Bar -->
                    <div class="bg-slate-950/80 institutional-border rounded-xl p-3.5 space-y-2 text-xs">
                        <div class="flex justify-between items-center text-slate-300">
                            <span>رسوم إطلاق الكرة:</span>
                            <span class="font-bold text-amber-400">0.01 BNB</span>
                        </div>
                        <div class="flex justify-between items-center text-slate-300">
                            <span>حماية بيكاتشو ضد البوتات:</span>
                            <span class="font-bold text-emerald-400">صاعقة مانعة للقناصة ⚡</span>
                        </div>
                    </div>
                </div>
            </div>

            <button id="createBtn" onclick="createToken()" class="mt-6 w-full bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 hover:to-yellow-500 text-slate-950 font-black py-3.5 rounded-xl transition-all shadow-lg cursor-pointer flex items-center justify-center gap-2 text-sm pokeball-btn">
                <i class="fa-solid fa-baseball text-base"></i>
                <span>إطلاق كرة البوكيمون وتوليد الأصل 🚀</span>
            </button>
        </section>

        <!-- Trading Terminal Section (7 Cols) -->
        <section class="lg:col-span-7 bg-slate-900/90 institutional-border pikachu-glow rounded-2xl p-6 shadow-2xl flex flex-col justify-between backdrop-blur-md">
            <div>
                <!-- Header & Loader -->
                <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-800 flex-wrap gap-4">
                    <div class="flex items-center gap-3">
                        <div class="p-3 bg-amber-500/10 text-amber-400 rounded-xl">
                            <i class="fa-solid fa-bolt
