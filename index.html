<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusMeme - Institutional Launchpad & Guardian Protocols</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ethers.js v6 CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #0b0f19; color: #f1f5f9; }
        .institutional-border { border: 1px solid rgba(59, 130, 246, 0.2); }
        .guardian-card { transition: all 0.3s ease; }
        .guardian-card:hover { transform: translateY(-3px); border-color: rgba(59, 130, 246, 0.6); box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.15); }
        button:active { transform: scale(0.99); }
        .btn-loading { opacity: 0.7; pointer-events: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Navbar -->
    <nav class="border-b border-slate-800 bg-slate-950/90 backdrop-blur-md sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3 space-x-reverse">
            <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-900/40">
                <i class="fa-solid fa-shield-halved text-white text-lg"></i>
            </div>
            <div>
                <span class="text-xl font-black tracking-tight text-white">NEXUSMÉME</span>
                <span class="block text-[10px] text-blue-400 font-bold uppercase tracking-wider">بروتوكول الأصول وحراس النظام</span>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="hidden md:flex items-center gap-2 text-xs text-slate-400 bg-slate-900 px-3 py-1.5 rounded-lg institutional-border">
                <i class="fa-solid fa-circle text-emerald-400 text-[8px] animate-pulse"></i>
                <span>نظام حراس البوكيمون: نشط</span>
            </div>
            <button id="connectWalletBtn" onclick="connectWallet()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-5 py-2.5 rounded-xl transition-all shadow-md flex items-center gap-2 cursor-pointer text-sm">
                <i class="fa-solid fa-wallet"></i>
                <span id="walletBtnText">ربط المحفظة النظامية</span>
            </button>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-6 w-full">
        
        <!-- Create Token Section (5 Cols) -->
        <section class="lg:col-span-5 bg-slate-900/90 institutional-border rounded-2xl p-6 shadow-2xl flex flex-col justify-between backdrop-blur-md">
            <div>
                <div class="flex items-center gap-3 mb-6 pb-4 border-b border-slate-800">
                    <div class="p-3 bg-blue-500/10 text-blue-400 rounded-xl">
                        <i class="fa-solid fa-file-contract text-xl"></i>
                    </div>
                    <div>
                        <h2 class="text-base font-bold text-white">إصدار أصل رقمي مع حراس النظام</h2>
                        <p class="text-xs text-slate-400">تفعيل خوارزميات الحماية المتقدمة تلقائياً</p>
                    </div>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1.5">اسم الأصل (Token Name)</label>
                        <input type="text" id="tokenName" placeholder="مثال: Guardian Asset" class="w-full bg-slate-950 institutional-border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1.5">رمز التداول (Token Symbol)</label>
                        <input type="text" id="tokenSymbol" placeholder="مثال: GUA" class="w-full bg-slate-950 institutional-border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1.5">هدف التخرج النظامي (Graduation Target BNB)</label>
                        <select id="graduationTarget" class="w-full bg-slate-950 institutional-border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 text-white">
                            <option value="4">4 BNB (مسار بيكاتشو السريع)</option>
                            <option value="10" selected>10 BNB (مسار تشاريزارد المعياري)</option>
                            <option value="20">20 BNB (مسار ميوتو المؤسسي)</option>
                            <option value="50">50 BNB (مسار صناديق الحيتان الكبرى)</option>
                        </select>
                    </div>
                    
                    <!-- Guardians Selection Indicator Bar -->
                    <div class="bg-slate-950/80 institutional-border rounded-xl p-3.5 space-y-2 text-xs">
                        <div class="flex justify-between items-center text-slate-300">
                            <span>رسوم الإنشاء الرسمية:</span>
                            <span class="font-bold text-amber-400">0.01 BNB</span>
                        </div>
                        <div class="flex justify-between items-center text-slate-300">
                            <span>الحراس المفعلون بالعقد:</span>
                            <span class="font-bold text-emerald-400">Pikachu, Charizard & Mewtwo</span>
                        </div>
                    </div>
                </div>
            </div>

            <button id="createBtn" onclick="createToken()" class="mt-6 w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg cursor-pointer flex items-center justify-center gap-2 text-sm">
                <i class="fa-solid fa-shield-dog"></i>
                <span>إصدار الأصل وتفعيل حراسة الأبطال ⚡</span>
            </button>
        </section>

        <!-- Trading Terminal Section & Guardians Grid (7 Cols) -->
        <section class="lg:col-span-7 bg-slate-900/90 institutional-border rounded-2xl p-6 shadow-2xl flex flex-col justify-between backdrop-blur-md">
            <div>
                <!-- Header & Loader -->
                <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-800 flex-wrap gap-4">
                    <div class="flex items-center gap
