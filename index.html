<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>كشف وسحب المجمعات تلقائياً</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; padding: 20px; text-align: center; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; max-width: 450px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        select, input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { background: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        button:hover { background: #059669; }
        #status { margin-top: 15px; font-size: 14px; word-break: break-all; }
        .info { font-size: 12px; color: #94a3b8; text-align: right; }
    </style>
</head>
<body>

    <div class="card">
        <h2>أداة السحب التلقائي للمجمعات</h2>
        <button onclick="connectAndDetect()">ربط المحفظة والتعرف على المجمع</button>
        <p id="walletAddress" class="info"></p>

        <hr style="border-color: #475569; margin: 15px 0;">

        <label class="info">المجمعات المكتشفة في المحفظة:</label>
        <select id="poolsList">
            <option value="">-- اربط المحفظة أولاً --</option>
        </select>

        <label class="info">الكمية المراد سحبها:</label>
        <input type="text" id="withdrawAmount" placeholder="أدخل الكمية (مثال: 100 أو All)">

        <button onclick="withdrawSelectedPool()">سحب المجمع المحدد</button>

        <div id="status"></div>
    </div>

    <script>
        let provider, signer, userAddress;

        async function connectAndDetect() {
            if (!window.ethereum) {
                alert("يرجى استخدام متصفح يدعم Web3 (مثل MetaMask أو Mises)");
                return;
            }

            try {
                provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                signer = provider.getSigner();
                userAddress = await signer.getAddress();
                
                document.getElementById("walletAddress").innerText = "المحفظة: " + userAddress;
                document.getElementById("status").innerText = "جاري البحث عن المجمعات والمراكز المرتبطة...";

                // هنا يتم جلب الأرصدة أو استعلام عقد الموجه (Router) أو العقود الشهيرة
                // كمثال توضيحي للربط التلقائي، سنتحقق من رصيد محفظتك ونفترض إضافة خيار افتراضي لعقد المجمع النشط
                let balance = await provider.getBalance(userAddress);
                let formattedBal = ethers.utils.formatEther(balance);

                let select = document.getElementById("poolsList");
                select.innerHTML = ""; // تفريغ القائمة

                // إضافة خيار تجريبي أو اكتشافي بناءً على العنوان النشط
                let option = document.createElement("option");
                option.value = "0xYourPoolOrRouterContractHere"; // استبدله بعنوان العقد الفعلي إذا رغبت
                option.text = "مجمع سيولة نشط (رصيد BNB/ETH بالمحفظة: " + parseFloat(formattedBal).toFixed(4) + ")";
                select.appendChild(option);

                document.getElementById("status").innerText = "تم التعرف على المحفظة بنجاح، يختار المجمع وتتم عملية السحب.";

            } catch (error) {
                document.getElementById("status").innerText = "خطأ في الاتصال: " + error.message;
            }
        }

        async function withdrawSelectedPool() {
            const poolAddress = document.getElementById("poolsList").value;
            const amount = document.getElementById("withdrawAmount").value;

            if (!poolAddress || !amount) {
                alert("الرجاء التأكد من اختيار المجمع وتحديد الكمية");
                return;
            }

            try {
                document.getElementById("status").innerText = "جاري إرسال معاملة السحب...";

                // مثال على ABI الخاص بالسحب
                const abi = ["function withdraw(uint256 amount) external"];
                const contract = new ethers.Contract(poolAddress, abi, signer);

                const tx = await contract.withdraw(ethers.utils.parseUnits(amount, 18));
                document.getElementById("status").innerText = "تم إرسال المعاملة، بانتظار التأكيد...\nHash: " + tx.hash;
                
                await tx.wait();
                document.getElementById("status").innerText = "تم السحب بنجاح!";
            } catch (error) {
                document.getElementById("status").innerText = "فشل السحب: " + (error.data?.message || error.message);
            }
        }
    </script>
</body>
</html>
