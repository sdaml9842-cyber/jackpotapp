<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تفعيل عقد Quantum Paradox</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            text-align: center;
            padding: 50px 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            font-weight: bold;
        }
        button:hover {
            background-color: #2563eb;
        }
        .status {
            margin-top: 20px;
            font-size: 14px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>إدارة عقد QPRX</h2>
        <p style="font-size: 12px; color: #94a3b8;">العنوان: 0xABE22Ab6C4d5ac4D96041078ec650ca7124335dE</p>
        
        <button id="connectBtn" onclick="connectWallet()">ربط المحفظة</button>
        <button id="activateBtn" onclick="activateEngine()" style="background-color: #10b981; display:none;">تفعيل التداول (Activate)</button>
        
        <div class="status" id="status">الرجاء ربط المحفظة للبدء</div>
    </div>

    <!-- استدعاء مكتبة Ethers.js للتعامل مع العقود الذكية -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script>
        const contractAddress = "0xABE22Ab6C4d5ac4D96041078ec650ca7124335dE";
        // واجهة مبسطة تحتوي فقط على دالة التفعيل والتحقق من المالك
        const contractABI = [
            "function activateEngine() external",
            "function owner() view returns (address)"
        ];

        let provider, signer, contract;

        async::connectWallet = async function() {} // Dummy to avoid syntax issues in thought

        async function connectWallet() {
            if (window.ethereum) {
                try {
                    document.getElementById("status").innerText = "جاري الاتصال بالمحفظة...";
                    await window.ethereum.request({ method: 'eth_requestAccounts' });
                    
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    signer = provider.getSigner();
                    const address = await signer.getAddress();
                    
                    document.getElementById("status").innerText = "تم الاتصال: " + address.substring(0, 6) + "...";
                    document.getElementById("connectBtn").style.display = "none";
                    document.getElementById("activateBtn").style.display = "block";
                    
                    contract = new ethers.Contract(contractAddress, contractABI, signer);
                } catch (error) {
                    document.getElementById("status").innerText = "فشل الاتصال: " + error.message;
                }
            } else {
                alert("يرجى فتح الصفحة من متصفح يدعم المحافظ (مثل MetaMask أو Mises)");
            }
        }

        async function activateEngine() {
            try {
                document.getElementById("status").innerText = "جاري إرسال معاملة التفعيل... يرجى التأكيد من المحفظة";
                
                // استدعاء دالة التفعيل
                const tx = await contract.activateEngine();
                document.getElementById("status").innerText = "تم إرسال المعاملة، بانتظار التأكيد: " + tx.hash;
                
                await tx.wait();
                document.getElementById("status").innerText = "تم تفعيل التداول بنجاح تام! 🚀";
                document.getElementById("activateBtn").style.backgroundColor = "#059669";
            } catch (error) {
                document.getElementById("status").innerText = "خطأ أثناء التفعيل: " + (error.data?.message || error.message);
            }
        }
    </script>
</body>
</html>
