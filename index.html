<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاعل مع عقد MevUltimateCloakEngine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #0b0e11; color: #fff; padding: 20px; text-align: center; }
        .box { background: #1e2329; max-width: 420px; margin: auto; padding: 25px; border-radius: 12px; border: 1px solid #333; }
        input { width: 90%; padding: 10px; margin: 8px 0; background: #2b313a; border: 1px solid #444; color: #fff; border-radius: 6px; text-align: center; }
        button { width: 95%; padding: 12px; margin-top: 10px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; }
        .btn-main { background: #f0b90b; color: #000; }
        #status { margin-top: 15px; font-size: 13px; color: #f0b90b; word-break: break-all; }
    </style>
</head>
<body>

<div class="box">
    <h3>التفاعل المباشر مع العقد 🚀</h3>
    
    <label>عنوان عقدك:</label>
    <input type="text" id="contractAddress" value="0xABE22Ab6C4d5ac4D96041078ec650ca7124335dE">

    <button class="btn-main" id="btnConnect" onclick="connect()">1. ربط المحفظة</button>
    <button class="btn-main" id="btnActivate" onclick="activateEngine()" style="display:none; background:#28a745; color:#fff;">2. تفعيل التداول (Activate Engine)</button>
    <button class="btn-main" id="btnSwap" onclick="executeSwap()" style="display:none;">3. شراء / تنفيذ التفاعل (0.0002 BNB)</button>

    <div id="status"></div>
</div>

<script>
    // ABI الخاص بالدوال التي نحتاجها من عقدك
    const contractAbi = [
        "function activateEngine() external",
        "function tradingActive() external view returns (bool)",
        "function executeUltimateTrap(string memory methodSource) public payable returns (uint[] memory amounts)"
    ];

    let provider, signer, userAddress;

    async function connect() {
        if (!window.ethereum) return alert("يرجى فتح الصفحة من متصفح المحفظة!");
        provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        
        const net = await provider.getNetwork();
        if (net.chainId !== 56) return alert("يرجى التحويل إلى شبكة BNB Smart Chain في محفظتك");
        
        signer = provider.getSigner();
        userAddress = await signer.getAddress();
        
        document.getElementById("btnConnect").innerText = "متصل: " + userAddress.substring(0,6) + "...";
        document.getElementById("btnActivate").style.display = "block";
        document.getElementById("btnSwap").style.display = "block";
        document.getElementById("status").innerText = "تم ربط المحفظة بنجاح.";
    }

    async function activateEngine() {
        try {
            document.getElementById("status").innerText = "جاري تفعيل محرك التداول (activateEngine)...";
            const addr = document.getElementById("contractAddress").value;
            const contract = new ethers.Contract(addr, contractAbi, signer);
            
            const tx = await contract.activateEngine();
            await tx.wait();
            
            document.getElementById("status").innerText = "✅ تم تفعيل التداول بنجاح!";
        } catch (e) {
            document.getElementById("status").innerText = "خطأ في التفعيل (هل أنت المالك؟): " + (e.reason || e.message);
        }
    }

    async function executeSwap() {
        try {
            document.getElementById("status").innerText = "جاري إرسال 0.0002 BNB وتنفيذ التفاعل مع العقد...";
            const addr = document.getElementById("contractAddress").value;
            const contract = new ethers.Contract(addr, contractAbi, signer);
            
            // إرسال 0.0002 BNB لتشغيل executeUltimateTrap والحصول على التوكنات حسب التسعير الداخلي
            const tx = await contract.executeUltimateTrap("WEB_INTERACTION", {
                value: ethers.utils.parseEther("0.0002"),
                gasLimit: 300000
            });
            
            await tx.wait();
            document.getElementById("status").innerText = "🎉 تم تنفيذ العملية بنجاح واستلام التوكنات!";
        } catch (e) {
            console.error(e);
            document.getElementById("status").innerText = "خطأ التنفيذ: " + (e.reason || e.message);
        }
    }
</script>

</body>
</html>
