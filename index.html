<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أداة سحب المجمع المتطورة</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; padding: 20px; text-align: center; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; max-width: 450px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { background: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        button:hover { background: #059669; }
        #status { margin-top: 15px; font-size: 13px; word-break: break-all; text-align: right; line-height: 1.5; color: #fbbf24; }
    </style>
</head>
<body>

    <div class="card">
        <h2>سحب المجمع الذكي</h2>
        <button onclick="connectWallet()">1. ربط المحفظة</button>
        <p id="walletAddress" style="font-size: 12px; color: #94a3b8;"></p>

        <hr style="border-color: #475569; margin: 15px 0;">

        <label style="font-size: 12px; display: block; text-align: right;">عنوان العقد:</label>
        <input type="text" id="contractAddress" value="0x76488cd4317470569201e004f5870affc0267c3c">

        <label style="font-size: 12px; display: block; text-align: right;">نوع دالة السحب في العقد:</label>
        <select id="functionType">
            <option value="withdraw">withdraw(amount)</option>
            <option value="withdrawAll">withdrawAll()</option>
            <option value="removeLiquidity">removeLiquidityETH / Max</option>
            <option value="emergencyWithdraw">emergencyWithdraw(pid)</option>
            <option value="claim">claim()</option>
        </select>

        <label style="font-size: 12px; display: block; text-align: right;">القيمة / الكمية / Token ID:</label>
        <input type="text" id="withdrawAmount" placeholder="1 أو 0 أو All">

        <button onclick="executeWithdraw()">2. تنفيذ السحب</button>

        <div id="status"></div>
    </div>

    <script>
        let provider, signer, userAddress;

        async function connectWallet() {
            if (!window.ethereum) { alert("يرجى فتح الصفحة من متصفح يدعم Web3"); return; }
            try {
                provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                signer = provider.getSigner();
                userAddress = await signer.getAddress();
                document.getElementById("walletAddress").innerText = "المحفظة: " + userAddress;
                document.getElementById("status").innerText = "تم الاتصال بنجاح.";
            } catch (err) {
                document.getElementById("status").innerText = "خطأ الاتصال: " + err.message;
            }
        }

        async function executeWithdraw() {
            const address = document.getElementById("contractAddress").value.trim();
            const fnType = document.getElementById("functionType").value;
            const amountVal = document.getElementById("withdrawAmount").value.trim();

            if (!address) { alert("أدخل عنوان العقد"); return; }

            try {
                document.getElementById("status").innerText = "جاري إرسال الطلب...";

                const abi = [
                    "function withdraw(uint256 amount) external",
                    "function withdrawAll() external",
                    "function emergencyWithdraw(uint256 pid) external",
                    "function claim() external"
                ];

                const contract = new ethers.Contract(address, abi, signer);
                let tx;

                if (fnType === "withdrawAll") {
                    tx = await contract.withdrawAll();
                } else if (fnType === "claim") {
                    tx = await contract.claim();
                } else if (fnType === "emergencyWithdraw") {
                    tx = await contract.emergencyWithdraw(amountVal || 0);
                } else {
                    let parsedAmount = (amountVal === "1" || amountVal === "0") ? ethers.BigNumber.from(amountVal) : ethers.utils.parseUnits(amountVal || "1", 18);
                    tx = await contract.withdraw(parsedAmount);
                }

                document.getElementById("status").innerText = "تم الإرسال، بانتظار التأكيد...\nHash: " + tx.hash;
                await tx.wait();
                document.getElementById("status").innerText = "تم السحب بنجاح!";
            } catch (error) {
                console.error(error);
                document.getElementById("status").innerText = "فشل السحب: " + (error.reason || error.data?.message || error.message);
            }
        }
    </script>
</body>
</html>
