<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Degen Meme DEX - شراء الآن</title>
    
    <!-- استيراد خطوط عربية عصرية -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #050510;
            --neon-green: #39ff14;
            --neon-purple: #b026ff;
            --glass-bg: rgba(20, 10, 40, 0.65);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            /* تأثير شبكة النيون في الخلفية */
            background-image: 
                linear-gradient(var(--glass-bg) 2px, transparent 2px),
                linear-gradient(90deg, var(--glass-bg) 2px, transparent 2px),
                linear-gradient(rgba(176, 38, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(176, 38, 255, 0.1) 1px, transparent 1px);
            background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
            background-position: -2px -2px, -2px -2px, -1px -1px, -1px -1px;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; /* لمنع التمرير بسبب حركة العملات */
        }

        .container {
            position: relative;
            display: flex;
            align-items: center;
            gap: 40px;
            z-index: 10;
        }

        .meme-character {
            font-size: 120px;
            filter: drop-shadow(0 0 20px var(--neon-purple));
            cursor: pointer;
            transition: transform 0.3s ease;
            animation: float 4s ease-in-out infinite;
            user-select: none;
        }

        .meme-character:hover {
            transform: scale(1.1) rotate(5deg);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        .neon-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid var(--neon-purple);
            border-radius: 20px;
            padding: 40px;
            width: 350px;
            box-shadow: 
                0 0 20px rgba(176, 38, 255, 0.5),
                inset 0 0 20px rgba(176, 38, 255, 0.3);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* تأثير لمعان داخل البطاقة */
        .neon-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(176, 38, 255, 0.1) 0%, transparent 60%);
            animation: pulse 4s infinite alternate;
            z-index: -1;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px var(--neon-purple);
        }

        .price-tag {
            margin: 20px 0;
            font-size: 24px;
            font-weight: 700;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .price-tag .up {
            font-size: 16px;
            background: rgba(57, 255, 20, 0.1);
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid var(--neon-green);
        }

        .input-group {
            margin-bottom: 30px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            color: #aaa;
            text-shadow: 0 0 5px rgba(255,255,255,0.3);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper span {
            position: absolute;
            left: 15px;
            color: var(--neon-purple);
            font-weight: bold;
        }

        input[type="number"] {
            width: 100%;
            padding: 15px;
            padding-left: 50px; /* مساحة لرمز العملة */
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(176, 38, 255, 0.5);
            border-radius: 10px;
            color: white;
            font-size: 18px;
            font-family: 'Cairo', sans-serif;
            outline: none;
            transition: all 0.3s;
            box-sizing: border-box;
        }

        input[type="number"]:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
        }

        .buy-btn {
            width: 100%;
            padding: 15px;
            font-size: 24px;
            font-weight: 900;
            font-family: 'Cairo', sans-serif;
            color: var(--neon-green);
            background: transparent;
            border: 3px solid var(--neon-green);
            border-radius: 15px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 
                0 0 15px rgba(57, 255, 20, 0.3),
                inset 0 0 15px rgba(57, 255, 20, 0.3);
            text-shadow: 0 0 10px var(--neon-green);
            transition: all 0.2s ease-out;
            position: relative;
            overflow: hidden;
        }

        .buy-btn:hover {
            background: var(--neon-green);
            color: #000;
            box-shadow: 
                0 0 40px var(--neon-green),
                inset 0 0 20px #fff;
            text-shadow: none;
            transform: scale(1.05);
        }

        /* تأثير التموج للزر */
        .buy-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s ease-out, height 0.6s ease-out, opacity 0.6s;
        }

        .buy-btn:active::after {
            width: 300px;
            height: 300px;
            opacity: 0;
            transition: 0s;
        }

        /* تنسيق العملات الطائرة المتولدة عبر الجافاسكربت */
        .flying-coin {
            position: fixed;
            font-size: 30px;
            pointer-events: none;
            z-index: 9999;
            filter: drop-shadow(0 0 10px gold);
        }

        /* شاشات الموبايل */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                gap: 20px;
            }
            .meme-character {
                font-size: 90px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- شخصية الميم التفاعلية -->
        <div class="meme-character" id="ape-meme" title="Degen Ape">
            🦍
        </div>

        <!-- بطاقة الشراء -->
        <div class="neon-card">
            <div class="header">
                <h1>$MEME</h1>
            </div>
            
            <div class="price-tag">
                $0.1542 
                <span class="up">+8.9% 🚀</span>
            </div>

            <div class="input-group">
                <label>الكمية المراد دفعها (سولانا):</label>
                <div class="input-wrapper">
                    <input type="number" placeholder="مثال: 5.5" step="0.1" min="0">
                    <span>SOL</span>
                </div>
            </div>

            <button class="buy-btn" id="buy-btn">
                شراء الآن
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const buyBtn = document.getElementById('buy-btn');
            const apeMeme = document.getElementById('ape-meme');
            
            let isAnimating = false;

            // استدعاء دالة رمي العملات عند تمرير الماوس فوق الزر
            buyBtn.addEventListener('mouseenter', () => {
                if (isAnimating) return; // منع التكرار المفرط
                isAnimating = true;
                
                throwCoins(10); // رمي 10 عملات
                
                // إعادة تفعيل التأثير بعد ثانية
                setTimeout(() => {
                    isAnimating = false;
                }, 1000);
            });

            function throwCoins(amount) {
                // الحصول على إحداثيات شخصية الميم والزر
                const apeRect = apeMeme.getBoundingClientRect();
                const btnRect = buyBtn.getBoundingClientRect();

                // نقطة البداية (من فم/يد القرد تقريباً)
                const startX = apeRect.left + (apeRect.width / 2);
                const startY = apeRect.top + (apeRect.height / 2);

                for (let i = 0; i < amount; i++) {
                    setTimeout(() => {
                        createAndAnimateCoin(startX, startY, btnRect);
                    }, i * 60); // تأخير بين كل عملة والأخرى (Stagger effect)
                }
                
                // تأثير اهتزاز بسيط لشخصية الميم عند الرمي
                apeMeme.style.transform = 'scale(1.2) rotate(-15deg)';
                setTimeout(() => {
                    apeMeme.style.transform = ''; // العودة للحالة الطبيعية
                }, 200);
            }

            function createAndAnimateCoin(startX, startY, targetRect) {
                const coin = document.createElement('div');
                coin.classList.add('flying-coin');
                // التنويع بين عملة وشنطة أموال للمتعة
                coin.innerText = Math.random() > 0.8 ? '💰' : '🪙'; 
                
                document.body.appendChild(coin);

                // نقطة النهاية (مكان عشوائي على زر الشراء)
                const endX = targetRect.left + (Math.random() * targetRect.width) - 15; // -15 لتعويض حجم العملة
                const endY = targetRect.top + (Math.random() * targetRect.height) - 15;

                // إعداد موضع البداية
                coin.style.left = `${startX}px`;
                coin.style.top = `${startY}px`;

                // إنشاء مسار منحني (Arc) باستخدام حسابات رياضية بسيطة في الـ Keyframes
                // نقطة وسطى لعمل انحناء للأعلى
                const midX = startX + (endX - startX) / 2;
                const midY = Math.min(startY, endY) - 100 - (Math.random() * 50);

                // استخدام Web Animations API للحركة
                const animation = coin.animate([
                    { 
                        transform: `translate(0, 0) scale(0.5) rotate(0deg)`, 
                        opacity: 1,
                        offset: 0
                    },
                    {
                        // النقطة الوسطى (المنحنى)
                        transform: `translate(${midX - startX}px, ${midY - startY}px) scale(1.5) rotate(180deg)`,
                        offset: 0.5
                    },
                    { 
                        transform: `translate(${endX - startX}px, ${endY - startY}px) scale(1) rotate(360deg)`, 
                        opacity: 0,
                        offset: 1
                    }
                ], {
                    duration: 600 + Math.random() * 300, // مدة عشوائية لتبدو طبيعية أكثر
                    easing: 'ease-in-out',
                    fill: 'forwards'
                });

                // إزالة العنصر من الـ DOM بعد انتهاء الحركة لتوفير الموارد
                animation.onfinish = () => {
                    coin.remove();
                };
            }
        });
    </script>
</body>
</html>
