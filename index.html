<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سحب السيولة - PancakeSwap V2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080b11;
            --card: #121824;
            --inner: #1b2234;
            --accent: #1fc7d4;
            --text: #f4f6f8;
            --muted: #8a99ad;
            --border: #273147;
        }
        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .box { width: 100%; max-width: 460px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn-connect { background: var(--accent); color: #000; border: none; padding: 8px 16px; border-radius: 12px; font-weight: 800; cursor: pointer; }
        .card-inner { background: var(--inner); border-radius: 14px; padding: 15px; margin-bottom: 15px; }
        .pct-title { color: var(--muted); font-size: 0.9rem; margin-bottom: 5px; }
        .pct-val { font-size: 2.2rem; font-weight: 800; color: var(--accent); text-align: center; }
        .slider { width: 100%; margin: 15px 0; accent-color: var(--accent); cursor: pointer; }
        .presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .btn-p { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--accent); padding: 6px; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .btn-p.active { background: var(--accent); color: #000; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 600; }
        .btn-action { width: 100%; padding: 14px; border: none; border-radius: 14px; background: var(--accent); color: #000; font-size: 1.1rem; font-weight: 800; cursor: pointer; margin-top: 5px; }
        .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { margin-top: 10px; font-size: 0.85rem; text-align: center; color: var(--muted); word-break: break-all; }
    </style>
</head>
<body>

<div class="box">
    <div class="header">
        <h3>سحب السيولة (yay / BNB)</h3>
        <button class="btn-connect" id="connectBtn" onclick="connectWallet()">ربط المحفظة</button>
    </div>

    <div class="card-inner">
        <div class="pct-title">نسبة السحب</div>
        <div class="pct-val" id="pctVal">100%</div>
        <input type="range" min="1" max="100" value="100" class="slider" id="slider" oninput="updatePct(this.value)">
        <div class="presets">
            <button class="btn-p" onclick="updatePct(25)">25%</button>
            <button class="btn-p" onclick="updatePct(50)">50%</button>
            <button class="btn-p" onclick="updatePct(75)">75%</button>
            <button class="btn-p active" id="p100" onclick="updatePct(100)">100%</button>
        </div>
    </div>

    <div class="card-inner">
        <div class="info-row">
            <span>رصيد توكنات LP:</span>
            <span id="lpBalance">0.00</span>
        </div>
        <div class="info-row">
            <span>المبلغ السلس المراد سحبه:</span>
            <span id="removeAmount">0.00</span>
        </div>
    </div>

    <button class="btn-action" id="approveBtn" onclick="approveLP()" disabled>1. الموافقة (Approve)</button>
    <button class="btn-action" id="removeBtn" onclick="removeLiquidity()" disabled style="margin-top: 8px; background: #31d0aa;">2. تأكيد السحب</button>

    <div class="status" id="statusBox">قم بربط المحفظة للمتابعة</div>
</div>

<script>
    // العناوين الخاصة بالشبكة (BSC Mainnet)
    const ROUTER_ADDRESS = "0x10ED433C71B354367343be24170a6742a4638b0B"; // PancakeSwap V2 Router
    const PAIR_ADDRESS = "0x0000000000000000000000000000000000000000"; // ضعي عنوان زوج السيولة (LP Token Address) هنا
    const YAY_ADDRESS = "0x40ac920000000000000000000000000000000000";  // ضعي عنوان توكن yay الصحيح هنا

    const ABI_PAIR = [
        "function balanceOf(address owner) view returns (uint256)",
        "function allowance(address owner, address spender) view returns (uint256)",
        "function approve(address spender, uint256 value) returns (bool)",
        "function decimals() view returns (uint8)"
    ];

    const ABI_ROUTER = [
        "function removeLiquidityETH(address token, uint liquidity, uint amountTokenMin, uint amountETHMin, address to, uint deadline) external returns (uint amountToken, uint amountETH)"
    ];

    let provider, signer, userAddress;
    let pairContract, routerContract;
    let rawBalance = ethers.BigNumber.from(0);
    let currentPct = 100;

    async function connectWallet() {
        if (window.ethereum) {
            try {
                provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                signer = provider.getSigner();
                userAddress = await signer.getAddress();
                
                document.getElementById('connectBtn').innerText = userAddress.substring(0,6) + "..." + userAddress.substring(38);
                document.getElementById('statusBox').innerText = "تم ربط المحفظة بنجاح";

                pairContract = new ethers.Contract(PAIR_ADDRESS, ABI_PAIR, signer);
                routerContract = new ethers.Contract(ROUTER_ADDRESS, ABI_ROUTER, signer);

                fetchBalance();
            } catch (err) {
                document.getElementById('statusBox').innerText = "فشل الربط: " + err.message;
            }
        } else {
            alert("يرجى فتح الصفحة من داخل متصفح Web3 مثل MetaMask أو Mises/Kiwi Browser");
        }
    }

    async function fetchBalance() {
        if (!pairContract) return;
        rawBalance = await pairContract.balanceOf(userAddress);
        const formatted = ethers.utils.formatEther(rawBalance);
        document.getElementById('lpBalance').innerText = parseFloat(formatted).toFixed(6);
        updateCalculations();
        
        document.getElementById('approveBtn').disabled = false;
    }

    function updatePct(val) {
        currentPct = val;
        document.getElementById('pctVal').innerText = val + '%';
        document.getElementById('slider').value = val;
        updateCalculations();
    }

    function updateCalculations() {
        if (rawBalance.isZero()) return;
        const withdrawAmount = rawBalance.mul(currentPct).div(100);
        document.getElementById('removeAmount').innerText = parseFloat(ethers.utils.formatEther(withdrawAmount)).toFixed(6);
    }

    async function approveLP() {
        try {
            const withdrawAmount = rawBalance.mul(currentPct).div(100);
            document.getElementById('statusBox').innerText = "جاري إرسال طلب الموافقة...";
            const tx = await pairContract.approve(ROUTER_ADDRESS, withdrawAmount);
            await tx.wait();
            document.getElementById('statusBox').innerText = "تمت الموافقة بنجاح! يمكنك الآن السحب.";
            document.getElementById('removeBtn').disabled = false;
        } catch (err) {
            document.getElementById('statusBox').innerText = "خطأ في الموافقة: " + err.message;
        }
    }

    async function removeLiquidity() {
        try {
            const withdrawAmount = rawBalance.mul(currentPct).div(100);
            const deadline = Math.floor(Date.now() / 1000) + 60 * 10; // 10 دقائق

            document.getElementById('statusBox').innerText = "جاري تنفيذ معاملة السحب...";
            
            // تعيين الحد الأدنى للمقبول لضمان عدم الفشل (سليباج)
            const tx = await routerContract.removeLiquidityETH(
                YAY_ADDRESS,
                withdrawAmount,
                0, // amountTokenMin (يمكن تعديلها بحسب نسبة السليباج)
                0, // amountETHMin
                userAddress,
                deadline
            );

            await tx.wait();
            document.getElementById('statusBox').innerText = "تم سحب السيولة بنجاح إلى محفظتك!";
            fetchBalance();
        } catch (err) {
            document.getElementById('statusBox').innerText = "خطأ أثناء السحب: " + err.message;
        }
    }
</script>

</body>
</html>
