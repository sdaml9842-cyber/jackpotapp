<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChainPump Base - Launchpad</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 480px; background: #121826; border-radius: 20px; padding: 20px; border: 1px solid #1e293b; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #38bdf8; font-size: 24px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .header p { color: #94a3b8; font-size: 13px; margin-top: 5px; }
        
        .progress-box { background: #1e293b; padding: 12px; border-radius: 12px; margin-bottom: 15px; }
        .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
        .progress-bar { width: 100%; height: 8px; background: #334155; border-radius: 4px; overflow: hidden; }
        .progress-fill { width: 100%; height: 100%; background: #10b981; border-radius: 4px; }

        .btn-connect { width: 100%; background: #0284c7; color: white; border: none; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; margin-bottom: 20px; }
        .btn-connect:hover { background: #0369a1; }
        .wallet-status { text-align: center; font-size: 12px; color: #94a3b8; margin-top: -12px; margin-bottom: 15px; }

        .section-card { background: #161e2e; border: 1px solid #1e293b; border-radius: 14px; padding: 15px; margin-bottom: 15px; }
        .section-title { font-size: 14px; color: #cbd5e1; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 5px; text-align: left; }
        .input-field, .select-field { width: 100%; background: #0b0f19; border: 1px solid #334155; color: white; padding: 12px; border-radius: 10px; font-size: 14px; outline: none; }
        .input-field:focus, .select-field:focus { border-color: #38bdf8; }
        .fee-info { font-size: 11px; color: #38bdf8; text-align: left; margin-top: 4px; }

        .btn-submit { width: 100%; background: linear-gradient(135deg, #f59e0b, #d97706); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .btn-submit:hover { opacity: 0.9; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>ChainPump Base ⚡</h1>
        <p>Next-Gen Secure Launchpad</p>
    </div>

    <div class="progress-box">
        <div class="progress-label"><span>مؤشر جاهزية الإطلاق</span><span>100%</span></div>
        <div class="progress-bar"><div class="progress-fill"></div></div>
    </div>

    <button id="connectBtn" class="btn-connect" onclick="connectWallet()">ربط المحفظة (Base Network) 👛</button>
    <div id="walletStatus" class="wallet-status">المحفظة غير متصلة</div>

    <div class="section-card">
        <div class="section-title">🪙 إعدادات الرمز وشعاره</div>
        
        <div class="input-group">
            <label>اسم الرمز (Token Name)</label>
            <input type="text" id="tokenName" class="input-field" placeholder="مثال: ChainPump Base Asset" value="ChainPump Base Asset">
        </div>

        <div class="input-group">
            <label>رمز التداول (Token Symbol)</label>
            <input type="text" id="tokenSymbol" class="input-field" placeholder="مثال: CPUMP" value="CPUMP">
        </div>

        <div class="input-group">
            <label>هدف التخرج (Graduation Target BNB)</label>
            <select id="gradTarget" class="select-field">
                <option value="4">4 BNB</option>
                <option value="10" selected>10 BNB</option>
                <option value="20">20 BNB</option>
                <option value="50">50 BNB</option>
            </select>
        </div>
        <div class="fee-info">رسوم الإطلاق: تُقرأ ديناميكياً من عقد المصنع (مرنة بالكامل)</div>
    </div>

    <button class="btn-submit" onclick="createToken()">إطلاق التوكن الآن ⚡</button>
</div>

<script>
    const FACTORY_ADDRESS = "0xb641f9B099963443951180Eea91ad59390Bd1A7a";
    const FACTORY_ABI = [
        "function createViralToken(string memory name, string memory symbol, uint256 graduationTargetBnb) external payable returns (address)",
        "function creationFee() external view returns (uint256)"
    ];

    let provider, signer, factoryContract;

    async function connectWallet() {
        if (window.ethereum) {
            try {
                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: '0x2105' }], // Base Mainnet (8453)
                    });
                } catch (switchError) {
                    if (switchError.code === 4902) {
                        await window.ethereum.request({
                            method: 'wallet_addEthereumChain',
                            params: [{
                                chainId: '0x2105',
                                chainName: 'Base Mainnet',
                                rpcUrls: ['https://mainnet.base.org'],
                                nativeCurrency: { name: 'ETH', symbol: 'ETH', decimals: 18 },
                                blockExplorerUrls: ['https://basescan.org']
                            }]
                        });
                    }
                }

                provider = new ethers.providers.Web3Provider(window.ethereum, { name: "base", chainId: 8453 });
                await provider.send("eth_requestAccounts", []);

                signer = provider.getSigner();
                const address = await signer.getAddress();
                document.getElementById("connectBtn").innerText = "متصل: " + address.substring(0, 6) + "..." + address.substring(38);
                document.getElementById("walletStatus").innerText = "متصل بنجاح بشبكة Base";
                
                factoryContract = new ethers.Contract(FACTORY_ADDRESS, FACTORY_ABI, signer);
            } catch (error) {
                console.error(error);
                alert("فشل ربط المحفظة: " + error.message);
            }
        } else {
            alert("يرجى استخدام متصفح يدعم Web3 مثل MetaMask أو Mises Browser.");
        }
    }

    async function createToken() {
        if (!factoryContract) {
            alert("يرجى ربط المحفظة أولاً!");
            return;
        }

        const name = document.getElementById("tokenName").value;
        const symbol = document.getElementById("tokenSymbol").value;
        const targetBnbEth = document.getElementById("gradTarget").value;

        if (!name || !symbol || !targetBnbEth) {
            alert("يرجى ملء جميع الحقول المطلوبة!");
            return;
        }

        const graduationTargetBnb = ethers.utils.parseEther(targetBnbEth);

        try {
            // جلب الرسم الحالي من المصنع وتحويله إلى Hex String صالح لـ value
            const creationFeeWei = await factoryContract.creationFee();
            const feeValue = `0x${BigInt(creationFeeWei.toString()).toString(16)}`;

            alert("جاري إرسال معاملة إطلاق التوكن على شبكة Base...");

            const tx = await factoryContract.createViralToken(
                name,
                symbol,
                graduationTargetBnb,
                { value: feeValue }
            );

            alert("تم إرسال المعاملة بنجاح! رقم المعاملة: " + tx.hash);

            await tx.wait();
            alert("تم إطلاق العملة بنجاح تام على شبكة Base! 🎉");
        } catch (error) {
            console.error(error);
            alert("حدث خطأ أثناء الإطلاق: " + (error.data?.message || error.message));
        }
    }
</script>

</body>
</html>
