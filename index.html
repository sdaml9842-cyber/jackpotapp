<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة العقد الذكي</title>
    <!-- تضمين مكتبات Tailwind CSS و Ethers.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-6 font-sans">

    <div class="max-w-3xl mx-auto space-y-6">
        
        <!-- الهيدر والاتصال بالمحفظة -->
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex flex-col sm:flex-row justify-between items-center gap-4 shadow-xl">
            <div>
                <h1 class="text-xl font-bold text-amber-400">لوحة التحكم بالعقد الذكي</h1>
                <p class="text-xs text-slate-400 font-mono mt-1">العقد: <span id="contract-address" class="text-slate-200">0x40ac9223409C4ca1B04c875b0A60446C850063c0</span></p>
            </div>
            <button id="connect-btn" onclick="connectWallet()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-5 py-2.5 rounded-xl shadow-lg transition">
                اتصال بالمحفظة
            </button>
        </div>

        <!-- حالة المحفظة -->
        <div id="wallet-info" class="hidden bg-slate-900/60 border border-slate-800 p-4 rounded-xl text-sm grid grid-cols-1 sm:grid-cols-2 gap-2">
            <div>المحفظة: <span id="wallet-address" class="font-mono text-amber-300">-</span></div>
            <div>الشبكة: <span id="network-info" class="font-mono text-amber-300">-</span></div>
        </div>

        <!-- قراءة البيانات من العقد (Read) -->
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-xl space-y-4">
            <h2 class="text-lg font-semibold text-blue-400 border-b border-slate-800 pb-2">قراءة بيانات العقد (Read)</h2>
            
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div class="bg-slate-950 p-3 border border-slate-800 rounded-xl text-center">
                    <button onclick="readData('name', 'val-name')" class="w-full bg-slate-800 hover:bg-slate-700 py-1.5 rounded-lg text-xs font-bold mb-2 transition">اسم التوكن</button>
                    <div id="val-name" class="text-sm font-mono text-amber-400">-</div>
                </div>

                <div class="bg-slate-950 p-3 border border-slate-800 rounded-xl text-center">
                    <button onclick="readData('symbol', 'val-symbol')" class="w-full bg-slate-800 hover:bg-slate-700 py-1.5 rounded-lg text-xs font-bold mb-2 transition">رمز التوكن</button>
                    <div id="val-symbol" class="text-sm font-mono text-amber-400">-</div>
                </div>

                <div class="bg-slate-950 p-3 border border-slate-800 rounded-xl text-center">
                    <button onclick="readData('totalSupply', 'val-supply')" class="w-full bg-slate-800 hover:bg-slate-700 py-1.5 rounded-lg text-xs font-bold mb-2 transition">الإمداد الكلي</button>
                    <div id="val-supply" class="text-sm font-mono text-amber-400">-</div>
                </div>
            </div>
        </div>

        <!-- تنفيذ المعاملات (Write) -->
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-xl space-y-4">
            <h2 class="text-lg font-semibold text-emerald-400 border-b border-slate-800 pb-2">تنفيذ الأوامر والتحويل (Write)</h2>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">عنوان المستلم</label>
                    <input type="text" id="transfer-to" placeholder="0x..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-amber-500 font-mono">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">الكمية المراد إرسالها</label>
                    <input type="number" id="transfer-amount" placeholder="100" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-amber-500 font-mono">
                </div>
                <button onclick="executeTransfer()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2.5 rounded-xl text-sm transition">
                    إرسال المعاملة (Transfer)
                </button>
            </div>
        </div>

        <!-- سجل الأخطاء والعمليات -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-xl">
            <h3 class="text-xs font-bold text-slate-400 mb-2">سجل الأحداث (Console Log)</h3>
            <div id="log-output" class="bg-slate-950 border border-slate-800 rounded-xl p-3 h-32 overflow-y-auto font-mono text-xs text-slate-300 space-y-1">
                <div>[جاهز] بانتظار الاتصال بالشبكة...</div>
            </div>
        </div>

    </div>

    <script>
        const CONTRACT_ADDRESS = "0x40ac9223409C4ca1B04c875b0A60446C850063c0";
        const CONTRACT_ABI = [
            "function name() view returns (string)",
            "function symbol() view returns (string)",
            "function totalSupply() view returns (uint256)",
            "function balanceOf(address account) view returns (uint256)",
            "function transfer(address recipient, uint256 amount) returns (bool)"
        ];

        let provider, signer, contract;

        function printLog(msg) {
            const box = document.getElementById("log-output");
            box.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        async function connectWallet() {
            if (window.ethereum) {
                try {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = provider.getSigner();
                    
                    const address = await signer.getAddress();
                    const network = await provider.getNetwork();

                    document.getElementById("wallet-info").classList.remove("hidden");
                    document.getElementById("wallet-address").innerText = address.slice(0, 6) + "..." + address.slice(-4);
                    document.getElementById("network-info").innerText = network.name + " (Chain ID: " + network.chainId + ")";
                    document.getElementById("connect-btn").innerText = "تم الاتصال";

                    contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
                    printLog("تم الاتصال بالمحفظة: " + address);
                } catch (err) {
                    printLog("خطأ أثناء الاتصال: " + err.message);
                }
            } else {
                alert("يرجى تثبيت محفظة متوافقة مع Web3 (مثل MetaMask أو Mises/Kiwi Browser).");
            }
        }

        async function readData(method, elementId) {
            try {
                // استخدام Provider عام لقراءة البيانات إن لم تكن المحفظة متصلة
                let activeProvider = provider || new ethers.providers.JsonRpcProvider("https://bsc-dataseed.binance.org/");
                let readContract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, activeProvider);
                
                printLog(`جاري طلب ${method}...`);
                let result = await readContract[method]();

                if (method === "totalSupply") {
                    result = ethers.utils.formatUnits(result, 18);
                }

                document.getElementById(elementId).innerText = result;
                printLog(`نتيجة ${method}: ${result}`);
            } catch (err) {
                printLog(`خطأ في قراءة ${method}: ` + err.message);
            }
        }

        async function executeTransfer() {
            if (!contract) {
                alert("قم بالاتصال بالمحفظة أولاً!");
                return;
            }

            const to = document.getElementById("transfer-to").value;
            const amount = document.getElementById("transfer-amount").value;

            if (!to || !amount) {
                alert("يرجى إدخال جميع البيانات المطلوب إرسالها.");
                return;
            }

            try {
                printLog("جاري إنشاء وإرسال المعاملة...");
                const parsedAmount = ethers.utils.parseUnits(amount, 18);
                const tx = await contract.transfer(to, parsedAmount);
                printLog("تم إرسال المعاملة، بانتظار التأكيد على الشبكة... Hash: " + tx.hash);

                await tx.wait();
                printLog("تم تأكيد وتنفيذ المعاملة بنجاح!");
                alert("تم التحويل بنجاح!");
            } catch (err) {
                printLog("فشلت المعاملة: " + (err.data?.message || err.message));
            }
        }
    </script>
</body>
</html>
