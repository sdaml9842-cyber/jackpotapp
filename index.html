<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViralLaunchpad - منصة الإطلاق اللامركزية على Base</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151922;
            --accent-green: #00ecb7;
            --accent-purple: #8247e5;
            --text-main: #ffffff;
            --text-secondary: #94a3b8;
            --border-color: #262b35;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 12px;
            max-width: 480px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 16px;
        }
        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-green);
        }
        .connect-btn {
            background: var(--accent-purple);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .stats-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            text-align: center;
        }
        .stat-item h3 {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .stat-item p {
            font-size: 1rem;
            font-weight: bold;
            color: var(--accent-green);
        }
        .section-title {
            font-size: 1rem;
            margin-bottom: 10px;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .token-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .token-header {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .token-icon {
            width: 36px;
            height: 36px;
            background: var(--accent-purple);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-left: 10px;
        }
        .token-info h4 {
            font-size: 0.95rem;
        }
        .token-info span {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            width: 45%;
            height: 100%;
            background: var(--accent-green);
        }
        .trade-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }
        .btn {
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            font-size: 0.9rem;
        }
        .btn-buy {
            background: var(--accent-green);
            color: #0b0e14;
        }
        .btn-sell {
            background: #ef4444;
            color: white;
        }
        .footer-note {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🚀 ViralLaunchpad</div>
        <button class="connect-btn" id="connectWalletBtn" onclick="connectWallet()">ربط المحفظة</button>
    </header>

    <div class="stats-card">
        <div class="stat-item">
            <h3>إجمالي حجم التداول</h3>
            <p id="totalVolume">$124,580</p>
        </div>
        <div class="stat-item">
            <h3>العملات المُطلقة</h3>
            <p>18 توكن</p>
        </div>
        <div class="stat-item">
            <h3>شبكة التشغيل</h3>
            <p style="color: #3b82f6;">Base Mainnet</p>
        </div>
    </div>

    <div class="section-title">
        <span>أحدث العملات المتاحة للتداول الفوري</span>
        <span style="font-size: 0.75rem; color: var(--accent-green);">● بث حي</span>
    </div>

    <div class="token-card">
        <div class="token-header">
            <div class="token-icon">V</div>
            <div class="token-info">
                <h4>ViralBase ($VBASE)</h4>
                <span>تم الإنشاء عبر عقد المصنع الموثق</span>
            </div>
        </div>
        <div style="font-size: 0.8rem; color: var(--text-secondary); display: flex; justify-content: space-between;">
            <span>السيولة المتبقية لاكتمال المنحنى:</span>
            <span style="color: var(--text-main);">5.4 ETH / 10 ETH</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" style="width: 54%;"></div>
        </div>
        <div class="trade-buttons">
            <button class="btn btn-buy" onclick="buyToken()">شراء سريع</button>
            <button class="btn btn-sell" onclick="sellToken()">بيع</button>
        </div>
    </div>

    <div class="footer-note">
        عقد المصنع المرتبط: <span style="font-family: monospace; color: var(--accent-green);">0xb641f9...d1A7a</span>
    </div>

    <script>
        // إعدادات العقد الحقيقي على شبكة Base
        const FACTORY_ADDRESS = "0xb641f9B099963443951180Eea91ad59390Bd1A7a";
        const BASE_CHAIN_ID = 8453; // 0x2105 بالعشري

        let provider;
        let signer;

        async function connectWallet() {
            if (window.ethereum) {
                try {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = provider.getSigner();
                    
                    // التحقق من الشبكة
                    const network = await provider.getNetwork();
                    if (network.chainId !== BASE_CHAIN_ID) {
                        alert("يرجى التحويل إلى شبكة Base (Chain ID: 8453) في محفظتك.");
                        try {
                            await window.ethereum.request({
                                method: 'wallet_switchEthereumChain',
                                params: [{ chainId: '0x2105' }],
                            });
                        } catch (switchError) {
                            console.error(switchError);
                        }
                    }

                    const address = await signer.getAddress();
                    const shortAddr = address.substring(0, 6) + "..." + address.substring(address.length - 4);
                    document.getElementById("connectWalletBtn").innerText = shortAddr;
                    alert("تم ربط المحفظة بنجاح!");
                } catch (error) {
                    console.error(error);
                    alert("فشل ربط المحفظة.");
                }
            } else {
                alert("يرجى فتح هذه الصفحة من متصفح يدعم Web3 (مثل متصفح MetaMask أو Mises).");
            }
        }

        function buyToken() {
            alert("جاهز لتنفيذ عملية الشراء عبر عقد المصنع المرتبط على Base!");
        }

        function sellToken() {
            alert("جاهز لتنفيذ عملية البيع الفوري!");
        }
    </script>
</body>
</html>
