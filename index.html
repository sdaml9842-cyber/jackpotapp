<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة إطلاق العملات - Base Launchpad</title>
    <!-- Tailwind CSS للتصميم الاحترافي -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ethers.js v6 للتفاعل مع البلوكتشين -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-white">

    <!-- الهيدر -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center font-black text-xl shadow-lg shadow-cyan-500/20">🚀</div>
                <span class="font-bold text-xl bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">MemeFactory Pro</span>
            </div>
            <button id="connectWalletBtn" onclick="connectWallet()" class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold px-6 py-2.5 rounded-xl shadow-lg shadow-cyan-500/20 transition-all duration-200 text-sm">
                ربط المحفظة
            </button>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="max-w-xl mx-auto px-4 py-12 w-full flex-grow">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
            
            <div class="text-center mb-8">
                <h1 class="text-2xl sm:text-3xl font-black mb-2">أنشئ عملتك الرقمية فوراً</h1>
                <p class="text-slate-400 text-sm">أطلق عملة الميم الخاصة بك على شبكة Base بضغطة زر وبأمان تام.</p>
            </div>

            <!-- نموذج الإطلاق -->
            <form id="launchForm" onsubmit="handleLaunch(event)" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold mb-2 text-slate-300">اسم العملة (Token Name)</label>
                    <input type="text" id="tokenName" required placeholder="مثال: Super Doge" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 focus:outline-none focus:border-cyan-500 transition-colors text-slate-100 placeholder:text-slate-600">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-2 text-slate-300">رمز العملة (Token Symbol)</label>
                    <input type="text" id="tokenSymbol" required placeholder="مثال: DOGE" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 focus:outline-none focus:border-cyan-500 transition-colors text-slate-100 placeholder:text-slate-600 uppercase">
                </div>

                <div class="bg-slate-950/50 border border-slate-800/80 rounded-xl p-4 text-xs space-y-2 text-slate-400">
                    <div class="flex justify-between">
                        <span>إجمالي التوكنات المصدرة:</span>
                        <span class="font-bold text-slate-200">1,000,000,000</span>
                    </div>
                    <div class="flex justify-between">
                        <span>رسوم الإطلاق للمنصة:</span>
                        <span class="font-bold text-cyan-400">0.00025 ETH</span>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 font-bold py-3.5 rounded-xl shadow-lg shadow-cyan-500/20 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
                    إطلاق العملة الآن 🚀
                </button>
            </form>

            <!-- صندوق الحالة والرسائل -->
            <div id="statusBox" class="mt-6 hidden p-4 rounded-xl text-sm border"></div>
        </div>
    </main>

    <!-- الفوتر -->
    <footer class="border-t border-slate-900 text-center py-6 text-xs text-slate-500">
        جميع الحقوق محفوطة © 2026 - يعمل على شبكة Base الآمنة
    </footer>

    <!-- سكربت التشغيل ومنطق الاتصال -->
    <script>
        const CONTRACT_ADDRESS = "0x92aBcf983Bf92f24A74D97A05d3F4e7F46A64E45";
        const BASE_CHAIN_ID = "0x2105"; // 8453 بالعشري

        const CONTRACT_ABI = [
            {
                "inputs": [
                    { "internalType": "string", "name": "name", "type": "string" },
                    { "internalType": "string", "name": "symbol", "type": "string" }
                ],
                "name": "deployNewToken",
                "outputs": [{ "internalType": "address", "name": "", "type": "address" }],
                "stateMutability": "payable",
                "type": "function"
            },
            {
                "inputs": [{ "internalType": "address", "name": "_feeRecipient", "type": "address" }],
                "stateMutability": "nonpayable",
                "type": "constructor"
            },
            {
                "inputs": [{ "internalType": "address", "name": "owner", "type": "address" }],
                "name": "OwnableInvalidOwner",
                "type": "error"
            },
            {
                "inputs": [{ "internalType": "address", "name": "account", "type": "address" }],
                "name": "OwnableUnauthorizedAccount",
                "type": "error"
            },
            {
                "inputs": [],
                "name": "ReentrancyGuardReentrantCall",
                "type": "error"
            },
            {
                "anonymous": false,
                "inputs": [
                    { "indexed": true, "internalType": "address", "name": "previousOwner", "type": "address" },
                    { "indexed": true, "internalType": "address", "name": "newOwner", "type": "address" }
                ],
                "name": "OwnershipTransferred",
                "type": "event"
            },
            {
                "inputs": [],
                "name": "renounceOwnership",
                "outputs": [],
                "stateMutability": "nonpayable",
                "type": "function"
            },
            {
                "inputs": [{ "internalType": "uint256", "name": "_newFee", "type": "uint256" }],
                "name": "setCreationFee",
                "outputs": [],
                "stateMutability": "nonpayable",
                "type": "function"
            },
            {
                "inputs": [{ "internalType": "address", "name": "_newRecipient", "type": "address" }],
                "name": "setFeeRecipient",
                "outputs": [],
                "stateMutability": "nonpayable",
                "type": "function"
            },
            {
                "anonymous": false,
                "inputs": [
                    { "indexed": true, "internalType": "address", "name": "tokenAddress", "type": "address" },
                    { "indexed": false, "internalType": "string", "name": "name", "type": "string" },
                    { "indexed": false, "internalType": "string", "name": "symbol", "type": "string" },
                    { "indexed": true, "internalType": "address", "name": "creator", "type": "address" }
                ],
                "name": "TokenLaunched",
                "type": "event"
            },
            {
                "inputs": [{ "internalType": "address", "name": "newOwner", "type": "address" }],
                "name": "transferOwnership",
                "outputs": [],
                "stateMutability": "nonpayable",
                "type": "function"
            },
            {
                "inputs": [],
                "name": "withdrawStuckEther",
                "outputs": [],
                "stateMutability": "nonpayable",
                "type": "function"
            },
            {
                "stateMutability": "payable",
                "type": "receive"
            },
            {
                "inputs": [{ "internalType": "uint256", "name": "", "type": "uint256" }],
                "name": "allTokens",
                "outputs": [{ "internalType": "address", "name": "", "type": "address" }],
                "stateMutability": "view",
                "type": "function"
            },
            {
                "inputs": [],
                "name": "creationFee",
                "outputs": [{ "internalType": "uint256", "name": "", "type": "uint256" }],
                "stateMutability": "view",
                "type": "function"
            },
            {
                "inputs": [],
                "name": "feeRecipient",
                "outputs": [{ "internalType": "address", "name": "", "type": "address" }],
                "stateMutability": "view",
                "type": "function"
            },
            {
                "inputs": [],
                "name": "getAllTokensCount",
                "outputs": [{ "internalType": "uint256", "name": "", "type": "uint256" }],
                "stateMutability": "view",
                "type": "function"
            },
            {
                "inputs": [],
                "name": "owner",
                "outputs": [{ "internalType": "address", "name": "", "type": "address" }],
                "stateMutability": "view",
                "type": "function"
            }
        ];

        let provider, signer, contract;

        async function connectWallet() {
            if (typeof window.ethereum === "undefined") {
                showStatus("يرجى استخدام محفظة ويب 3 مدعومة مثل Binance أو MetaMask.", "error");
                return;
            }

            try {
                await window.ethereum.request({ method: "eth_requestAccounts" });
                
                const chainId = await window.ethereum.request({ method: "eth_chainId" });
                if (chainId !== BASE_CHAIN_ID) {
                    try {
                        await window.ethereum.request({
                            method: "wallet_switchEthereumChain",
                            params: [{ chainId: BASE_CHAIN_ID }]
                        });
                    } catch (switchError) {
                        showStatus("يرجى التحويل إلى شبكة Base الرئيسية في محفظتك.", "error");
                        return;
                    }
                }

                provider = new ethers.BrowserProvider(window.ethereum);
                signer = await provider.getSigner();
                contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

                const address = await signer.getAddress();
                const shortAddr = address.substring(0, 6) + "..." + address.substring(address.length - 4);
                
                const btn = document.getElementById("connectWalletBtn");
                btn.innerText = shortAddr;
                btn.className = "bg-slate-800 border border-slate-700 text-slate-200 font-semibold px-4 py-2 rounded-xl text-sm";
                
                showStatus("تم اتصال المحفظة بنجاح!", "success");
            } catch (error) {
                console.error(error);
                showStatus("فشل الاتصال بالمحفظة: " + (error.reason || error.message), "error");
            }
        }

        async function handleLaunch(event) {
            event.preventDefault();
            
            if (!contract) {
                showStatus("يرجى ربط المحفظة أولاً!", "error");
                await connectWallet();
                return;
            }

            const name = document.getElementById("tokenName").value.trim();
            const symbol = document.getElementById("tokenSymbol").value.trim();
            const submitBtn = document.getElementById("submitBtn");

            try {
                submitBtn.disabled = true;
                submitBtn.innerText = "جاري إعداد المعاملة...";

                // القيمة الدقيقة للرسوم بالـ Wei (0.00025 ETH)
                const requiredFee = 250000000000000n; 

                // خيارات المعاملة مع تحديد حد الغاز يدوياً لتجاوز مشاكل المحاكاة في الهواتف
                const txOptions = {
                    value: requiredFee,
                    gasLimit: 600000n 
                };

                showStatus("يرجى تأكيد المعاملة في محفظتك...", "info");

                const tx = await contract.deployNewToken(name, symbol, txOptions);
                
                submitBtn.innerText = "جاري تأكيد المعاملة على البلوكتشين...";
                showStatus(`تم إرسال المعاملة! جارٍ التأكيد... <a href="https://basescan.org/tx/${tx.hash}" target="_blank" class="underline font-bold text-cyan-400">عرض على البس سكان</a>`, "info");

                const receipt = await tx.wait();

                submitBtn.disabled = false;
                submitBtn.innerText = "إطلاق العملة الآن 🚀";
                
                showStatus(`🎉 تم إطلاق العملة بنجاح وتوزيع الحصص تلقائياً!<br><a href="https://basescan.org/tx/${receipt.hash}" target="_blank" class="underline font-bold text-cyan-400">رابط المعاملة النهائية</a>`, "success");
                
                document.getElementById("launchForm").reset();

            } catch (error) {
                console.error(error);
                submitBtn.disabled = false;
                submitBtn.innerText = "إطلاق العملة الآن 🚀";
                
                let errorMsg = error.reason || error.message || "حدث خطأ غير معروف";
                if (errorMsg.includes("user rejected") || errorMsg.includes("ACTION_REJECTED")) {
                    errorMsg = "تم إلغاء المعاملة من قِبل المستخدم.";
                } else if (errorMsg.includes("insufficient funds") || errorMsg.includes("exceeds balance")) {
                    errorMsg = "عذراً، رصيدك من الإيثيريوم على شبكة Base غير كافي لدفع رسوم الإطلاق والغاز.";
                }
                showStatus("خطأ: " + errorMsg, "error");
            }
        }

        function showStatus(message, type) {
            const box = document.getElementById("statusBox");
            box.classList.remove("hidden", "bg-emerald-950/40", "border-emerald-800", "text-emerald-300", "bg-rose-950/40", "border-rose-800", "text-rose-300", "bg-cyan-950/40", "border-cyan-800", "text-cyan-300");
            
            if (type === "success") {
                box.classList.add("bg-emerald-950/40", "border-emerald-800", "text-emerald-300");
            } else if (type === "error") {
                box.classList.add("bg-rose-950/40", "border-rose-800", "text-rose-300");
            } else {
                box.classList.add("bg-cyan-950/40", "border-cyan-800", "text-cyan-300");
            }
            box.innerHTML = message;
        }
    </script>
</body>
</html>
