<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم العقد | Quantum Launchpad</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4 font-sans">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <div class="inline-flex items-center gap-2 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-full text-emerald-400 text-xs font-semibold">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                عقد المفترس نشط
            </div>
            <h1 class="text-2xl font-extrabold tracking-tight text-white">لوحة الإدارة والتفعيل</h1>
            <p class="text-xs text-slate-400 font-mono break-all bg-slate-950 p-2 rounded-xl border border-slate-800">
                0x93eb91E922784eE08bFf436b5be1F0A86990eDD1
            </p>
        </div>

        <!-- Connect Button -->
        <button id="connectBtn" onclick="connectWallet()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-2xl transition shadow-lg shadow-blue-950 flex items-center justify-center gap-2">
            <span>ربط المحفظة</span>
        </button>

        <hr class="border-slate-800">

        <!-- Actions -->
        <div class="space-y-4">
            <!-- Activate Trading -->
            <button onclick="activateTrading()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-4 rounded-2xl transition shadow-xl shadow-emerald-950/50 flex flex-col items-center justify-center">
                <span class="text-base">🚀 تفعيل التداول (Activate Trading)</span>
                <span class="text-[10px] text-emerald-200 font-normal">استدعاء الدالة لفتح حظر التداول مباشرة</span>
            </button>

            <!-- Test Buy -->
            <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3">
                <label class="block text-xs font-medium text-slate-400">إجراء شراء تجريبي لتنشيط الـ Mempool (اختياري)</label>
                <div class="flex gap-2">
                    <input type="number" id="buyAmount" value="0.0005" step="0.0001" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-white text-sm text-center focus:outline-none focus:border-emerald-500">
                    <button onclick="executeBuy()" class="bg-slate-800 hover:bg-slate-700 text-emerald-400 font-bold px-4 py-2 rounded-xl text-xs whitespace-nowrap transition border border-emerald-500/30">
                        شراء الآن
                    </button>
                </div>
            </div>
        </div>

        <!-- Status Log -->
        <div id="status" class="text-center text-xs text-slate-400 bg-slate-950/50 p-3 rounded-xl min-h-[40px] flex items-center justify-center border border-slate-900">
            بانتظار ربط المحفظة...
        </div>

    </div>

    <script>
        const contractAddress = "0x93eb91E922784eE08bFf436b5be1F0A86990eDD1";
        const contractABI = [
            "function activateTrading() external",
            "function executePredatorBuy() external payable"
        ];

        let provider, signer, contract;

        async function connectWallet() {
            if (window.ethereum) {
                try {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = provider.getSigner();
                    contract = new ethers.Contract(contractAddress, contractABI, signer);
                    
                    const address = await signer.getAddress();
                    document.getElementById("connectBtn").innerText = "تم الربط: " + address.substring(0, 6) + "..." + address.substring(38);
                    document.getElementById("connectBtn").classList.replace("bg-blue-600", "bg-slate-800");
                    document.getElementById("status").innerText = "المحفظة متصلة جاهز للتفعيل.";
                } catch (err) {
                    console.error(err);
                    document.getElementById("status").innerText = "فشل الاتصال بالمحفظة.";
                }
            } else {
                alert("يرجى فتح الصفحة داخل متصفح المحفظة (مثل MetaMask Mobile)!");
            }
        }

        async function activateTrading() {
            if (!contract) {
                alert("يرجى ربط المحفظة أولاً!");
                return;
            }
            try {
                document.getElementById("status").innerText = "جاري إرسال طلب تفعيل التداول...";
                const tx = await contract.activateTrading();
                document.getElementById("status").innerText = "تم إرسال المعاملة، بانتظار التأكيد: " + tx.hash.substring(0, 10) + "...";
                await tx.wait();
                document.getElementById("status").innerHTML = "<span class='text-emerald-400 font-bold'>✅ تم تفعيل التداول بنجاح! العقد جاهز الآن.</span>";
            } catch (err) {
                console.error(err);
                document.getElementById("status").innerText = "خطأ: " + (err.data?.message || err.message);
            }
        }

        async function executeBuy() {
            if (!contract) {
                alert("يرجى ربط المحفظة أولاً!");
                return;
            }
            try {
                const amount = document.getElementById("buyAmount").value;
                const txValue = ethers.utils.parseEther(amount);
                
                document.getElementById("status").innerText = "جاري إرسال معاملة الشراء التجريبية...";
                const tx = await contract.executePredatorBuy({ value: txValue });
                document.getElementById("status").innerText = "تم الإرسال، بانتظار التأكيد: " + tx.hash.substring(0, 10) + "...";
                await tx.wait();
                document.getElementById("status").innerHTML = "<span class='text-emerald-400 font-bold'>✅ تم الشراء بنجاح وتنشيط الـ Mempool!</span>";
            } catch (err) {
                console.error(err);
                document.getElementById("status").innerText = "خطأ: " + (err.data?.message || err.message);
            }
        }
    </script>
</body>
</html>
