<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pump Style | إطلاق وتداول العملات</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ethers.js v6 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.11.1/ethers.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Tajawal', 'sans-serif'] },
                    colors: {
                        pumpBg: '#0f172a',
                        pumpCard: '#1e293b',
                        pumpGreen: '#22c55e',
                        pumpPink: '#ec4899',
                        pumpYellow: '#eab308'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Tajawal', sans-serif; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- شاشة الهيدر والربط -->
    <header class="bg-pumpCard border-b border-slate-800 p-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <span class="text-2xl">🚀</span>
            <span class="font-black text-lg tracking-wider text-pumpYellow">MEME PUMP</span>
        </div>
        <button id="connectBtn" onclick="connectWallet()" class="bg-pumpYellow hover:bg-yellow-500 text-slate-950 font-bold px-4 py-2 rounded-xl text-sm transition-all shadow-lg shadow-yellow-500/10">
            ربط المحفظة
        </button>
    </header>

    <!-- المحتوى الرئيسي (موبايل فيرست) -->
    <main class="flex-1 p-4 max-w-md mx-auto w-full flex flex-col gap-5 pb-10">
        
        <!-- التبويبات -->
        <div class="flex bg-pumpCard p-1 rounded-2xl border border-slate-800">
            <button onclick="switchTab('create')" id="tabCreate" class="flex-1 py-3 text-center font-bold rounded-xl text-sm bg-pumpYellow text-slate-950 transition-all">إطلاق عملة</button>
            <button onclick="switchTab('trade')" id="tabTrade" class="flex-1 py-3 text-center font-bold rounded-xl text-sm text-slate-400 transition-all">تداول عملة</button>
        </div>

        <!-- 1. نموذج إطلاق العملة -->
        <div id="sectionCreate" class="bg-pumpCard border border-slate-800 rounded-3xl p-5 space-y-4 shadow-xl">
            <h2 class="text-lg font-black text-pumpYellow">إنشاء عملة ميم جديدة</h2>
            
            <div>
                <label class="text-xs text-slate-400 block mb-1">اسم العملة</label>
                <input type="text" id="tokenName" placeholder="مثال: Super Doge" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-pumpYellow">
            </div>

            <div>
                <label class="text-xs text-slate-400 block mb-1">رمز العملة (Symbol)</label>
                <input type="text" id="tokenSymbol" placeholder="مثال: DOGE" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm uppercase focus:outline-none focus:border-pumpYellow">
            </div>

            <div>
                <label class="text-xs text-slate-400 block mb-1">هدف التخرج (BNB)</label>
                <select id="tokenTarget" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-pumpYellow">
                    <option value="4000000000000000000">4 BNB</option>
                    <option value="10000000000000000000" selected>10 BNB</option>
                    <option value="20000000000000000000">20 BNB</option>
                </select>
            </div>

            <button onclick="createToken()" id="btnCreate" class="w-full bg-pumpYellow hover:bg-yellow-500 text-slate-950 font-black py-4 rounded-xl text-base transition-all shadow-lg shadow-yellow-500/20">
                إطلاق العملة الآن 🚀
            </button>
        </div>

        <!-- 2. نموذج التداول الشراء والبيع -->
        <div id="sectionTrade" class="bg-pumpCard border border-slate-800 rounded-3xl p-5 space-y-4 shadow-xl hidden">
            <h2 class="text-lg font-black text-pumpGreen">تداول العملة</h2>
            
            <div>
                <label class="text-xs text-slate-400 block mb-1">عنوان عقد العملة</label>
                <input type="text" id="tradeTokenAddress" placeholder="0x..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-xs font-mono focus:outline-none focus:border-pumpGreen">
            </div>

            <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 flex justify-between text-xs">
                <span class="text-slate-400">السيولة الحالية:</span>
                <span id="reserveDisplay" class="font-mono text-pumpGreen font-bold">0.00 BNB</span>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <button onclick="executeBuy()" id="btnBuy" class="bg-pumpGreen hover:bg-green-600 text-slate-950 font-black py-3 rounded-xl text-sm transition-all">
                    شراء (BUY)
                </button>
                <button onclick="executeSell()" id="btnSell" class="bg-pumpPink hover:bg-pink-600 text-white font-black py-3 rounded-xl text-sm transition-all">
                    بيع (SELL)
                </button>
            </div>

            <div>
                <label class="text-xs text-slate-400 block mb-1">المبلغ (BNB للشراء أو كمية التوكن للبيع)</label>
                <input type="number" id="tradeAmount" placeholder="0.1" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm font-mono focus:outline-none focus:border-pumpGreen">
            </div>
        </div>

    </main>

    <!-- رسائل التنبيه العائمة -->
    <div id="alertBox" class="fixed bottom-5 left-4 right-4 bg-slate-900 border border-slate-700 text-white p-4 rounded-2xl shadow-2xl transition-all duration-300 transform translate-y-32 z-50 text-center font-bold text-sm">
        <span id="alertMsg">رسالة التنبيه</span>
    </div>

    <script>
        // عناوين عقودك الأساسية
        const FACTORY_ADDRESS = "0xb641f9B099963443951180Eea91ad59390Bd1A7a"; 
        
        // عنوان محفظتك لاستقبال الرسوم فوراً
        const FEE_RECEIVER_ADDRESS = "0xf0cc066F5fC2667F8A0AF74e5AF3eb61FeeE0d44";

        const FACTORY_ABI = [
            "function createViralToken(string name, string symbol, uint256 graduationTargetBnb) payable returns (address)",
            "function creationFee() view returns (uint256)"
        ];

        const TOKEN_ABI = [
            "function realBnbReserve() view returns (uint256)",
            "function buy(uint256 minTokensOut, address referrer) payable",
            "function sell(uint256 tokenAmount, uint256 minBnbOut, address referrer)"
        ];

        let provider, signer, userAddress;

        function showAlert(msg) {
            const box = document.getElementById('alertBox');
            document.getElementById('alertMsg').innerText = msg;
            box.style.transform = 'translateY(0)';
            setTimeout(() => { box.style.transform = 'translateY(150px)'; }, 4000);
        }

        function switchTab(tab) {
            if(tab === 'create') {
                document.getElementById('sectionCreate').classList.remove('hidden');
                document.getElementById('sectionTrade').classList.add('hidden');
                document.getElementById('tabCreate').className = "flex-1 py-3 text-center font-bold rounded-xl text-sm bg-pumpYellow text-slate-950 transition-all";
                document.getElementById('tabTrade').className = "flex-1 py-3 text-center font-bold rounded-xl text-sm text-slate-400 transition-all";
            } else {
                document.getElementById('sectionCreate').classList.add('hidden');
                document.getElementById('sectionTrade').classList.remove('hidden');
                document.getElementById('tabTrade').className = "flex-1 py-3 text-center font-bold rounded-xl text-sm bg-pumpGreen text-slate-950 transition-all";
                document.getElementById('tabCreate').className = "flex-1 py-3 text-center font-bold rounded-xl text-sm text-slate-400 transition-all";
            }
        }

        async function connectWallet() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    provider = new ethers.BrowserProvider(window.ethereum);
                    signer = await provider.getSigner();
                    userAddress = accounts[0];

                    document.getElementById('connectBtn').innerText = userAddress.slice(0,4) + "..." + userAddress.slice(-4);
                    document.getElementById('connectBtn').className = "bg-slate-800 text-pumpYellow font-bold px-4 py-2 rounded-xl text-sm border border-slate-700";
                    showAlert("تم ربط المحفظة بنجاح!");
                } catch (e) {
                    showAlert("فشل ربط المحفظة.");
                }
            } else {
                showAlert("يرجى استخدام متصفح يدعم المحافظ مثل TrustWallet أو MetaMask.");
            }
        }

        async function createToken() {
            if (!signer) { showAlert("يرجى ربط المحفظة أولاً!"); return; }
            const name = document.getElementById('tokenName').value.trim();
            const symbol = document.getElementById('tokenSymbol').value.trim();
            const target = document.getElementById('tokenTarget').value;

            if(!name || !symbol) { showAlert("الرجاء تعبئة اسم ورمز العملة"); return; }

            try {
                const factory = new ethers.Contract(FACTORY_ADDRESS, FACTORY_ABI, signer);
                const fee = await factory.creationFee();
                
                showAlert("جاري تأكيد إنشاء العملة...");
                const tx = await factory.createViralToken(name, symbol, target, { value: fee });
                await tx.wait();
                
                showAlert("تم إطلاق العملة بنجاح! 🎉");
                document.getElementById('tokenName').value = '';
                document.getElementById('tokenSymbol').value = '';
            } catch(e) {
                showAlert("فشلت عملية الإطلاق.");
            }
        }

        async function executeBuy() {
            if (!signer) { showAlert("يرجى ربط المحفظة أولاً!"); return; }
            const tokenAddr = document.getElementById('tradeTokenAddress').value.trim();
            const amount = document.getElementById('tradeAmount').value;

            if(!ethers.isAddress(tokenAddr) || !amount) { showAlert("تأكد من عنوان العقد والمبلغ"); return; }

            try {
                const tokenContract = new ethers.Contract(tokenAddr, TOKEN_ABI, signer);
                showAlert("جاري تنفيذ الشراء...");
                
                // تمرير محفظتك كـ referrer لضمان وصول الرسوم إليك
                const tx = await tokenContract.buy(0, FEE_RECEIVER_ADDRESS, { value: ethers.parseEther(amount) });
                await tx.wait();
                
                showAlert("تم الشراء بنجاح! 🚀");
            } catch(e) {
                showAlert("فشلت عملية الشراء.");
            }
        }

        async function executeSell() {
            if (!signer) { showAlert("يرجى ربط المحفظة أولاً!"); return; }
            const tokenAddr = document.getElementById('tradeTokenAddress').value.trim();
            const amount = document.getElementById('tradeAmount').value;

            if(!ethers.isAddress(tokenAddr) || !amount) { showAlert("تأكد من عنوان العقد والكمية"); return; }

            try {
                const tokenContract = new ethers.Contract(tokenAddr, TOKEN_ABI, signer);
                showAlert("جاري تنفيذ البيع...");
                
                const tx = await tokenContract.sell(ethers.parseEther(amount), 0, FEE_RECEIVER_ADDRESS);
                await tx.wait();
                
                showAlert("تم البيع بنجاح! 💰");
            } catch(e) {
                showAlert("فشلت عملية البيع.");
            }
        }
    </script>
</body>
</html>
