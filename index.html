<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - Apex Predator Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 10px 0;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #2563eb; }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
            text-align: center;
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #38bdf8;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Apex Predator / MevFlash</h2>
        <p style="font-size: 12px; color: #94a3b8;">العقد: 0xA021080086f19B8D38a1A63d0597d6da90f79Ea8</p>
        
        <button onclick="connectWallet()">ربط المحفظة</button>
        <p id="walletAddress" class="status">المحفظة غير متصلة</p>

        <hr style="border-color: #475569; margin: 20px 0;">

        <h3>1. تفعيل التداول (للصاحب فقط)</h3>
        <button onclick="activateTrading()">تفعيل التداول (activateTrading)</button>

        <hr style="border-color: #475569; margin: 20px 0;">

        <h3>2. الشراء / إطلاق الشرارة الأولى</h3>
        <input type="number" id="bnbAmount" placeholder="كمية BNB للشراء (مثال: 0.0005)" value="0.0005" step="0.0001">
        <button onclick="buyTokens()">شراء / تنفيذ الشرارة (executePredatorBuy)</button>

        <p id="txStatus" class="status"></p>
    </div>

    <script>
        const contractAddress = "0xA021080086f19B8D38a1A63d0597d6da90f79Ea8";
        const contractABI = [
            "function activateTrading() external",
            "function executePredatorBuy() external payable"
        ];

        let provider, signer, contract;

        async::connectWallet = async function() {
            if (window.ethereum) {
                try {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = provider.getSigner();
                    const address = await signer.getAddress();
                    document.getElementById("walletAddress").innerText = "متصل: " + address;
                    contract = new ethers.Contract(contractAddress, contractABI, signer);
                } catch (error) {
                    alert("فشل الاتصال بالمحفظة: " + error.message);
                }
            } else {
                alert("الرجاء فتح هذه الصفحة من متصفح داعم للمحفظة مثل MetaMask أو Mises Browser");
            }
        }

        async function activateTrading() {
            if (!contract) { alert("يرجى ربط المحفظة أولاً"); return; }
            try {
                document.getElementById("txStatus").innerText = "جاري إرسال معاملة التفعيل...";
                const tx = await contract.activateTrading();
                await tx.wait();
                document.getElementById("txStatus").innerText = "تم تفعيل التداول بنجاح! ✅";
            } catch (error) {
                document.getElementById("txStatus").innerText = "خطأ: " + (error.data?.message || error.message);
            }
        }

        async function buyTokens() {
            if (!contract) { alert("يرجى ربط المحفظة أولاً"); return; }
            try {
                const bnbVal = document.getElementById("bnbAmount").value;
                const valueWei = ethers.utils.parseEther(bnbVal);
                
                document.getElementById("txStatus").innerText = "جاري تنفيذ معاملة الشراء...";
                const tx = await contract.executePredatorBuy({ value: valueWei });
                await tx.wait();
                document.getElementById("txStatus").innerText = "تمت عملية الشراء وإطلاق الشرارة بنجاح! 🚀";
            } catch (error) {
                document.getElementById("txStatus").innerText = "خطأ: " + (error.data?.message || error.message);
            }
        }
    </script>
</body>
</html>
