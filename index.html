<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChainPump Base - Launchpad</title>
    <!-- مكتبة ethers.js للتعامل مع البلوكشين -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: 40px auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
        .btn { width: 100%; padding: 14px; background: #0284c7; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 15px; font-weight: bold; transition: background 0.3s; }
        .btn:hover { background: #0369a1; }
        input { width: 100%; padding: 12px; margin: 8px 0 16px 0; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        label { font-size: 14px; color: #94a3b8; display: block; margin-top: 10px; }
        .status { text-align: center; margin-bottom: 20px; font-size: 14px; color: #22c55e; background: #0f172a; padding: 10px; border-radius: 6px; border: 1px solid #334155; }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚡ ChainPump Base</h2>
        <div id="walletStatus" class="status">غير متصل بالمحفظة</div>
        <button id="connectBtn" class="btn" onclick="connectWallet()">ربط المحفظة</button>
        
        <hr style="border-color: #334155; margin: 25px 0;">

        <label>اسم التوكن (Token Name)</label>
        <input type="text" id="tokenName" placeholder="مثال: My Meme Token">

        <label>رمز التوكن (Token Symbol)</label>
        <input type="text" id="tokenSymbol" placeholder="مثال: MEME">

        <button id="launchBtn" class="btn" onclick="launchToken()" style="background: #10b981;">إطلاق التوكن الآن ⚡</button>
    </div>

    <script>
        const FACTORY_ADDRESS = "0xb641f9B099963443951180Eea91ad59390Bd1A7a";
        const FACTORY_ABI = [
            "function creationFee() view returns (uint256)",
            "function createToken(string memory name, string memory symbol) payable returns (address)"
        ];

        let provider, signer, factoryContract;

        async function connectWallet() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    
                    // التحقق من الشبكة (Base Mainnet ID: 8453 / 0x2105)
                    const network = await provider.getNetwork();
                    if (network.chainId !== 8453) {
                        try {
                            await window.ethereum.request({
                                method: 'wallet_switchEthereumChain',
                                params: [{ chainId: '0x2105' }],
                            });
                        } catch (switchError) {
                            alert("يرجى التبديل يدوياً إلى شبكة Base Mainnet في محفظتك.");
                            return;
                        }
                    }

                    signer = provider.getSigner();
                    const address = await signer.getAddress();
                    document.getElementById("walletStatus").innerText = "متصل: " + address.substring(0,6) + "..." + address.substring(38);
                    document.getElementById("connectBtn").innerText = "متصل بنجاح";
                    
                    factoryContract = new ethers.Contract(FACTORY_ADDRESS, FACTORY_ABI, signer);
                } catch (err) {
                    console.error(err);
                    alert("فشل الاتصال بالمحفظة: " + (err.message || err));
                }
            } else {
                alert("يرجى فتح الموقع من متصفح يدعم Web3 مثل MetaMask أو Binance Web3 Wallet.");
            }
        }

        async function launchToken() {
            try {
                if (!signer || !factoryContract) {
                    alert("يرجى ربط المحفظة أولاً!");
                    return;
                }

                const name = document.getElementById("tokenName").value.trim();
                const symbol = document.getElementById("tokenSymbol").value.trim();

                if (!name || !symbol) {
                    alert("يرجى إدخال اسم ورمز التوكن بشكل صحيح!");
                    return;
                }

                // جلب رسوم الإطلاق ديناميكياً من العقد
                const fee = await factoryContract.creationFee();

                // تنفيذ المعاملة مع تمرير القيمة بصيغة Hex لتجنب أخطاء BigNumber
                const tx = await factoryContract.createToken(name, symbol, {
                    value: fee.toHexString()
                });

                alert("تم إرسال المعاملة بنجاح! بانتظار التأكيد على الشبكة...");
                await tx.wait();
                alert("🎉 مبروك! تم إنشاء وإطلاق التوكن بنجاح تام على شبكة Base.");

            } catch (error) {
                console.error("Launch Error:", error);
                let errorMessage = error.message || error;

                // التعرّف على خطأ نقص الرصيد وعرض رسالة واضحة للمستخدم
                if (errorMessage.includes("OutOfFunds") || errorMessage.includes("insufficient funds") || errorMessage.includes("sender doesn't have enough funds")) {
                    alert("❌ عذراً، رصيد محفظتك غير كافٍ (OutOfFunds) لتغطية رسوم الإطلاق والغاز على شبكة Base. يرجى شحن رصيدك بالمحفظة.");
                } else if (errorMessage.includes("user rejected")) {
                    alert("تم إلغاء المعاملة من قبل المستخدم.");
                } else {
                    alert("حدث خطأ أثناء الإطلاق: " + errorMessage);
                }
            }
        }
    </script>
</body>
</html>
