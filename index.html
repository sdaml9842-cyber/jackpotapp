<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChainPump Protocol - Enterprise Token Engine</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ethers.js v6 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', 'Plus Jakarta Sans', sans-serif; background-color: #080c14; color: #f1f5f9; }
        .institutional-card {
            background: rgba(13, 20, 36, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.8);
        }
        .btn-institutional {
            background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 100%);
            border: 1px solid rgba(59, 130, 246, 0.3);
            box-shadow: 0 4px 14px 0 rgba(30, 58, 138, 0.4);
        }
        .btn-institutional:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%);
        }
        .step-active {
            border-color: #10b981;
            color: #34d399;
            background: rgba(16, 185, 129, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-blue-600 selection:text-white">

    <!-- شريط توثيق أمان البروتوكول -->
    <div class="bg-slate-950 border-b border-slate-800/80 text-slate-400 text-[11px] py-2 px-4">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2 space-x-reverse">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>شبكة التشغيل: <strong class="text-slate-200">Base Mainnet (ERC-20)</strong></span>
            </div>
            <div class="flex items-center space-x-2 space-x-reverse text-emerald-400 font-semibold">
                <span>🛡️ فحص الأمان وبرمجيات العقود: معتمدة بالكامل</span>
            </div>
        </div>
    </div>

    <!-- الهيدر المؤسسي -->
    <header class="border-b border-slate-800/80 bg-slate-950/90 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-2xl mx-auto px-4 py-3.5 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-9 h-9 rounded-xl bg-slate-900 border border-slate-700 flex items-center justify-center text-blue-400 font-bold text-base shadow-sm">
                    ⚡
                </div>
                <div>
                    <div class="flex items-center space-x-2 space-x-reverse">
                        <span class="font-extrabold text-base text-white tracking-tight">ChainPump</span>
                        <span class="text-[10px] bg-slate-800 text-slate-300 font-bold px-2 py-0.5 rounded border border-slate-700">PROTOCOL</span>
                    </div>
                    <span class="block text-[10px] text-slate-500 font-semibold tracking-wider">منصة إصدار الأصول الرقمية الموثقة</span>
                </div>
            </div>
            
            <button id="connectWalletBtn" onclick="connectWallet()" class="bg-slate-900 hover:bg-slate-800 border border-slate-700 text-blue-400 font-bold px-4 py-2 rounded-xl transition-all text-xs flex items-center space-x-2 space-x-reverse shadow-sm">
                <span class="w-2 h-2 rounded-full bg-blue-400"></span>
                <span>
