<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفعيل التداول الفوري</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
</head>
<body style="background: #0f172a; color: #fff; font-family: Tahoma; text-align: center; padding-top: 50px;">
    <h2>تفعيل عقد King of the Hill</h2>
    <p>تأكد من ربط محفظة المالك على شبكة BSC Mainnet</p>
    <button onclick="enableNow()" style="background: #10b981; color: #fff; padding: 15px 30px; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; font-weight: bold;">
        اضغط هنا لتفعيل التداول (enableTrading)
    </button>
    <p id="status" style="margin-top: 20px; color: #fbbf24;"></p>

    <script>
        const contractAddress = "0x9a8442D45d8adB7f8868Fe40f24E50bfb46d88a7";
        // البصمة البرمجية لدالة enableTrading() في سوليدتي
        const abi = ["function enableTrading() external"];

        async function enableNow() {
            if (typeof window.ethereum === 'undefined') {
                alert("الرجاء تثبيت محفظة متوافقة مع Web3");
                return;
            }
            try {
                document.getElementById('status').innerText = "جاري طلب الاتصال بالمحفظة...";
                const provider = new ethers.BrowserProvider(window.ethereum);
                
                // التأكد من الشبكة (BSC Chain ID: 56)
                const network = await provider.getNetwork();
                if (network.chainId !== 56n) {
                    alert("خطأ: يرجى تحويل شبكة محفظتك إلى Binance Smart Chain (BSC Mainnet)");
                    return;
                }

                const signer = await provider.getSigner();
                const contract = new ethers.Contract(contractAddress, abi, signer);

                document.getElementById('status').innerText = "جاري إرسال معاملة التفعيل، يرجى التأكيد من المحفظة...";
                const tx = await contract.enableTrading();
                
                document.getElementById('status').innerText = "تم إرسال المعاملة، بانتظار التأكيد...";
                await tx.wait();
                
                document.getElementById('status').style.color = "#34d399";
                document.getElementById('status').innerText = "🎉 تم تفعيل التداول بنجاح تام وبدأ العداد!";
            } catch (err) {
                console.error(err);
                document.getElementById('status').style.color = "#f87171";
                document.getElementById('status').innerText = "فشل التنفيذ: تأكد أنك مالك العقد وأن الرسوم كافية.";
            }
        }
    </script>
</body>
</html>
