<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم عقد تسونامي بوت</title>
    <!-- استخدام Tailwind CSS للتصميم السريع والأنيق -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبة Ethers.js للتفاعل مع البلوكشين -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 sm:p-8 space-y-6">
        
        <!-- رأس الصفحة -->
        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
            <h1 class="text-xl font-bold text-amber-400 flex items-center gap-2">
                ⚡ لوحة تحكم التوكن الذكي
            </h1>
            <button id="connectBtn" onclick="connectWallet()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold px-4 py-2 rounded-xl transition text-sm">
                ربط المحفظة
            </button>
        </div>

        <!-- حالة المحفظة -->
        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800/60 text-sm space-y-1">
            <p class="text-slate-400">حالة الاتصال: <span id="walletStatus" class="text-red-400 font-medium">غير متصل</span></p>
            <p class="text-slate-400 truncate">المحفظة: <span id="walletAddress" class="text-slate-200">-</span></p>
        </div>

        <!-- إدخال عنوان العقد -->
        <div class="space-y-2">
            <label class="block text-sm font-medium text-slate-300">عنوان العقد المنشور (Contract Address):</label>
            <input type="text" id="contractAddress" placeholder="0x..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-amber-500 text-slate-200">
            <button onclick="loadContractData()" class="w-full mt-2 bg-slate-800 hover:bg-slate-700 text-amber-400 font-medium py-2 rounded-xl transition text-sm">
                تحميل بيانات العقد والتحقق من الروتر
            </button>
        </div>

        <!-- بيانات وعتبات العقد -->
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 text-center">
                <p class="text-xs text-slate-400">رصيد صندوق المكافآت (Bounty Pool)</p>
                <p id="bountyBalance" class="text-lg font-bold text-amber-400 mt-1">0.00 BNB</p>
            </div>
            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 text-center">
                <p class="text-xs text-slate-400">عتبة التسونامي الحالية</p>
                <p id="currentThreshold" class="text-lg font-bold text-emerald-400 mt-1">0.00 BNB</p>
            </div>
        </div>

        <!-- خانة عرض والتحقق من عنوان الروتر المسجل في العقد -->
        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-1">
            <p class="text-xs text-slate-400">عنوان الروتر المسجل في العقد حالياً:</p>
            <p id="routerAddressDisplay" class="text-xs font-mono text-cyan-400 break-all">-</p>
        </div>

        <!-- أزرار التفاعل والإجراءات -->
        <div class="space-y-3 pt-2">
            <div class="flex gap-2">
                <input type="number" id="fundAmount" value="0.003" step="0.001" class="w-1/3 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-center text-slate-200">
                <button onclick="fundContract()" class="w-2/3 bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 rounded-xl transition text-sm">
                    تمويل العقد بـ BNB (إرسال مباشر)
                </button>
            </div>
            <button onclick="triggerUpkeep()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl transition text-sm">
                تشغيل دالة التسونامي (Perform Upkeep)
            </button>
        </div>

    </div>

    <!-- كود الجافاسكريبت للربط والعمليات -->
    <script>
        let provider, signer, contract;

        // الـ ABI المحدث يضم دالة pancakeRouter للتحقق الفوري
        const abi = [
            "function bountyPool() external view returns (uint256)",
            "function getCurrentThreshold() external view returns (uint256)",
            "function pancakeRouter() external view returns (address)",
            "function performUpkeep(bytes calldata performData) external",
            "receive() external payable"
        ];

        async function connectWallet() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    provider = new ethers.BrowserProvider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = await provider.getSigner();
                    const address = await signer.getAddress();
                    
                    document.getElementById('walletStatus').innerText = "متصل بنجاح";
                    document.getElementById('walletStatus').className = "text-emerald-400 font-medium";
                    document.getElementById('walletAddress').innerText = address;
                    document.getElementById('connectBtn').innerText = "متصل";
                } catch (error) {
                    alert("فشل الاتصال بالمحفظة: " + error.message);
                }
            } else {
                alert("يرجى تثبيت محفظة متوافقة مثل MetaMask أو Binance Web3 Wallet");
            }
        }

        async function loadContractData() {
            const addr = document.getElementById('contractAddress').value.trim();
            if (!ethers.isAddress(addr)) {
                alert("يرجى إدخال عنوان عقد صحيح!");
                return;
            }
            if (!provider) {
                alert("يرجى ربط المحفظة أولاً!");
                return;
            }

            try {
                contract = new ethers.Contract(addr, abi, signer);
                
                // جلب البيانات مباشرة من البلوكشين
                const pool = await contract.bountyPool();
                const threshold = await contract.getCurrentThreshold();
                const router = await contract.pancakeRouter();

                document.getElementById('bountyBalance').innerText = ethers.formatEther(pool) + " BNB";
                document.getElementById('currentThreshold').innerText = ethers.formatEther(threshold) + " BNB";
                document.getElementById('routerAddressDisplay').innerText = router;
            } catch (error) {
                alert("حدث خطأ أثناء قراءة بيانات العقد: " + error.message);
            }
        }

        async function fundContract() {
            const addr = document.getElementById('contractAddress').value.trim();
            const amount = document.getElementById('fundAmount').value;
            if (!contract || !ethers.isAddress(addr)) {
                alert("يرجى تحميل العقد أولاً!");
                return;
            }

            try {
                const tx = await signer.sendTransaction({
                    to: addr,
                    value: ethers.parseEther(amount)
                });
                alert("جاري ارسال معاملة التمويل...");
                await tx.wait();
                alert("تم تمويل العقد بنجاح وتمت تعبئة صندوق المكافآت!");
                loadContractData();
            } catch (error) {
                alert("فشلت عملية التمويل: " + error.message);
            }
        }

        async function triggerUpkeep() {
            if (!contract) {
                alert("يرجى تحميل العقد أولاً!");
                return;
            }

            try {
                const tx = await contract.performUpkeep("0x");
                alert("جاري تنفيذ التسونامي...");
                await tx.wait();
                alert("تم تنفيذ موجة التسونامي بنجاح!");
                loadContractData();
            } catch (error) {
                alert("فشل التنفيذ (قد لا تكون الشروط مكتملة بعد): " + error.message);
            }
        }
    </script>
</body>
</html>
