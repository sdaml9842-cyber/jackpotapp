            color: #f8fafc;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        .neon-glow {
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
        }
        .btn-primary {
            background: linear-gradient(135deg, #0ea5e9, #3b82f6);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.6);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Header / Navbar -->
    <header class="w-full max-w-5xl flex justify-between items-center py-6 mb-10 border-b border-slate-700">
        <h1 class="text-3xl font-black tracking-wider text-sky-400 neon-glow">VIRAL LAUNCHPAD</h1>
        <button id="connectWalletBtn" class="btn-primary text-white font-bold py-2 px-6 rounded-full">
            ربط المحفظة
        </button>
    </header>

    <!-- Main Content -->
    <main class="w-full max-w-lg glass-panel rounded-2xl p-8 relative overflow-hidden">
        <div class="absolute top-0 right-0 w-32 h-32 bg-sky-500 rounded-full mix-blend-screen filter blur-3xl opacity-20"></div>
        <div class="absolute bottom-0 left-0 w-32 h-32 bg-indigo-500 rounded-full mix-blend-screen filter blur-3xl opacity-20"></div>
        
        <h2 class="text-2xl font-bold text-center mb-6">أطلق عملتك نحو المستقبل</h2>
        
        <form id="launchForm" class="space-y-5 relative z-10">
            <div>
                <label class="block text-sm font-bold text-slate-300 mb-2">اسم العملة (Name)</label>
                <input type="text" id="tokenName" required class="w-full bg-slate-900 border border-slate-600 rounded-lg py-3 px-4 text-white focus:outline-none focus:border-sky-400 focus:ring-1 focus:ring-sky-400 transition-colors" placeholder="مثال: Viral Token">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-300 mb-2">رمز العملة (Symbol)</label>
                <input type="text" id="tokenSymbol" required class="w-full bg-slate-900 border border-slate-600 rounded-lg py-3 px-4 text-white focus:outline-none focus:border-sky-400 focus:ring-1 focus:ring-sky-400 transition-colors" placeholder="مثال: VRL">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-300 mb-2">هدف التخرج (Graduation Target - BNB)</label>
                <select id="gradTarget" class="w-full bg-slate-900 border border-slate-600 rounded-lg py-3 px-4 text-white focus:outline-none focus:border-sky-400 transition-colors">
                    <option value="4">4 BNB</option>
                    <option value="10">10 BNB</option>
                    <option value="20">20 BNB</option>
                    <option value="50">50 BNB</option>
                </select>
            </div>

            <button type="submit" id="createBtn" disabled class="w-full btn-primary text-white font-bold text-lg py-3 rounded-lg opacity-50 cursor-not-allowed mt-4">
                يرجى ربط المحفظة أولاً
            </button>
        </form>

        <!-- Status & Logs -->
        <div id="statusBox" class="mt-6 p-4 rounded-lg bg-slate-900 border border-slate-700 hidden text-sm"></div>
    </main>

    <footer class="mt-12 text-slate-500 text-sm">
        مبني على شبكة Base للسيولة العميقة والسرعة الفائقة
    </footer>
