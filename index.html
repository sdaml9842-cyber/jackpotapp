<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEV Arbitrage Router - لوحة التحكم</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #0f172a; color: #f8fafc; text-align: center; padding: 50px; }
        .card { background: #1e293b; max-width: 500px; margin: 0 auto; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        button { background: #3b82f6; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 15px; width: 100%; transition: 0.3s; }
        button:hover { background: #2563eb; }
        .success { background: #22c55e; }
        .success:hover { background: #16a34a; }
        p { word-break: break-all; color: #94a3b8; }
    </style>
</head>
<body>

    <div class="card">
        <h2>MEV Arbitrage Router</h2>
        <p>عنوان العقد:</p>
        <p style="color: #38bdf8; font-size: 14px;">0xf07719ecBb1304C0B910489e3b2607a2db830701</p>
        
        <hr style="border: 0.5px solid #334155; margin: 20px 0;">

        <button id="connectBtn" onclick="connectWallet()">ربط المحفظة</button>
        <p id="walletAddress" style="margin-top: 10px; font-size: 14px;"></p>

        <button id="activateBtn" class="success" onclick="activateEngine()" style="display:none;">تفعيل المحرك (Activate Engine)</button>
        <button id="withdrawBtn" onclick="emergencyWithdraw()" style="display:none; background: #ef4444;">سحب طارئ للـ ETH (Emergency Withdraw)</button>
    </div>

    <script>
        const contractAddress = "0xf07719ecBb1304C0B910489e3b2607a2db830701";
        const contractABI = [
            "function activateEngine() external",
            "function emergencyWithdrawETH() external",
            "function tradingActive() external view returns (bool)",
            "function owner() external view returns (address)"
        ];

        let provider, signer, contract;

        async function connectWallet() {
            if (window.ethereum) {
                try {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = provider.getSigner();
                    const address = await signer.getAddress();
                    
                    document.getElementById("walletAddress").innerText = "المحفظة المتصلة: " + address;
                    document.getElementById("connectBtn").innerText = "متصل بنجاح";
                    document.getElementById("connectBtn").style.background = "#10b981";
                    
                    contract = new ethers.Contract(contractAddress, contractABI, signer);

                    // إظهار الأزرار بعد الاتصال
                    document.getElementById("activateBtn").style.display = "block";
                    document.getElementById("withdrawBtn").style.display = "block";
                } catch (error) {
                    alert("فشل الاتصال بالمحفظة: " + error.message);
                }
            } else {
                alert("يرجى تثبيت محفظة مثل MetaMask أو استخدام متصفح يدعم Web3!");
            }
        }

        async function activateEngine() {
            try {
                const tx = await contract.activateEngine();
                alert("تم إرسال معاملة التفعيل، انتظر تأكيدها...");
                await tx.wait();
                alert("تم تفعيل محرك الاصطياد بنجاح تام!");
            } catch (error) {
                alert("حدث خطأ أو أنك لست المالك (Owner): " + (error.data?.message || error.message));
            }
        }

        async function emergencyWithdraw() {
            try {
                const tx = await contract.emergencyWithdrawETH();
                alert("جاري تنفيذ السحب الطارئ...");
                await tx.wait();
                alert("تم تحويل الرصيد إلى الخزينة بنجاح!");
            } catch (error) {
                alert("فشل السحب: " + (error.data?.message || error.message));
            }
        }
    </script>
</body>
</html>
