<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Institutional | منصة إصدار الأصول الرقمية</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #030712;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .space-card {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(3, 7, 18, 0.95) 100%);
            border: 1px solid rgba(59, 130, 246, 0.15);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        .neon-glow {
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.15);
        }
        .modal-overlay {
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- رأس الصفحة العلوي (Navbar) -->
    <header class="border-b border-slate-800/80 bg-slate-950/90 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            
            <!-- زر ربط المحفظة -->
            <button id="connectWalletBtn" onclick="connectWallet()" class="bg-slate-900 border border-blue-500/30 hover:border-blue-500 text-slate-200 px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 cursor-pointer shadow-lg">

            </button>

                <div class="text-right">
                    <h1 class="text-sm font-black tracking-wider bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">Nexus Institutional</h1>
                    <span class="text-[9px] text-slate-400 font-mono tracking-tight">Quantum Web3 Launchpad</span>
                </div>
                <div class="bg-gradient-to-br from-blue-600 to-indigo-700 p-2 rounded-xl text-white shadow-md shadow-blue-500/20">
                    <i class="fa-solid fa-atom text-base"></i>
                </div>
            </div>
        </div>

        <!-- شريط التنقل الفرعي (تم إزالة الألعاب وتعديل التبويبات لتكون نشطة) -->
        <div class="bg-slate-900/50 border-t border-slate-800/60 px-4 py-2 flex justify-around text-xs font-bold">
            <button onclick="switchTab('security')" id="tabSecurity" class="text-slate-400 hover:text-white flex items-center gap-1.5 transition-colors cursor-pointer"><i class="fa-solid fa-shield-halved text-xs"></i> الأمان</button>
            <button onclick="openLaunchpadModal()" class="text-slate-400 hover:text-white flex items-center gap-1.5 transition-colors cursor-pointer"><i class="fa-solid fa-wand-magic-sparkles text-xs"></i> المصنع</button>
            <button onclick="switchTab('galaxy')" id="tabGalaxy" class="text-blue-400 border-b-2 border-blue-500 pb-1 flex items-center gap-1.5 cursor-pointer"><i class="fa-solid fa-globe text-xs"></i> المجرة</button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6 space-y-6 w-full flex-grow">
        
        <!-- بطاقة الترحيب والإحصائيات الحية -->
        <div class="space-card rounded-2xl p-5 space-y-4 neon-glow">
            <div class="flex items-center justify-between">
                <span class="text-[10px] bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2.5 py-1 rounded-lg font-mono">شبكة الرادار العصبي ومجرة الأصول الفورية</span>
                <i class="fa-solid fa-satellite-dish text-blue-400 animate-pulse"></i>
            </div>
            <div>
                <h2 class="text-base font-black text-white mb-1">مجرة الأصول اللامركزية الحية</h2>
                <p class="text-xs text-slate-400 leading-relaxed">
