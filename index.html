<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم عقد King of the Hill</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Ethers.js v6 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans antialiased">
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8 bg-gray-900 p-6 rounded-2xl border border-gray-800 shadow-xl">
            <div>
                <h1 class="text-2xl font-black text-amber-400">King of the Hill 👑</h1>
                <p class="text-xs text-gray-400 mt-1">لوحة التحكم التفاعلية المباشرة</p>
            </div>
            <button id="connectBtn" onclick="connectWallet()" class="bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold px-5 py-2.5 rounded-xl transition duration-200 cursor-pointer shadow-lg shadow-amber-500/20 text-sm">
                ربط المحفظة
            </button>
        </div>

        <!-- Contract Info Card -->
        <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800 mb-6 shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                <span class="text-gray-400 text-sm">حالة الشبكة:</span>
                <span id="networkStatus" class="text-red-400 font-semibold text-sm">غير متصل</span>
            </div>
            <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                <span class="text-gray-400 text-sm">عنوان المحفظة:</span>
                <span id="walletAddress" class="text-amber-300 font-mono text-xs">---</span>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-gray-400 text-sm">صندوق الجائزة الحالي:</span>
                <span id="jackpotBalance" class="text-emerald-400 font-bold text-lg">0.0 BNB</span>
            </div>
        </div>

        <!-- Owner Actions Panel -->
        <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800 mb-6 shadow-xl space-y-4">
            <h2 class="text-lg font-bold text-amber-400 mb-2 border-b border-gray-800 pb-2">لوحة المالك (Owner Panel)</h2>
            
            <button onclick="enableTrading()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl transition duration-200 cursor-pointer shadow-lg shadow-emerald-600/20 text-sm">
                🚀 تفعيل التداول (enableTrading)
            </button>

            <div class="flex gap-2 pt-2">
                <input type="text" id="jackpotAmount" placeholder="قيمة الـ BNB للتمويل" class="flex-1 bg-gray-950 border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-gray-100 focus:outline-none focus:border-amber-500">
                <button onclick="fundJackpot()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2.5 rounded-xl transition duration-200 cursor-pointer text-sm">
                    تمويل الجائزة
                </button>
            </div>
        </div>

        <!-- Public Actions Panel -->
        <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800 shadow-xl space-y-4">
            <h2 class="text-lg font-bold text-amber-400 mb-2 border-b border-gray-800 pb-2">سحب الجائزة (Public Action)</h2>
            <button onclick="claimJackpot()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded-xl transition duration-200 cursor-pointer shadow-lg shadow-purple-600/20 text-sm">
                🏆 المطالبة بالجائزة الكبرى (claimJackpot)
            </button>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const contractAddress = "0x9a8442D45d8adB7f8868Fe40f24E50bfb46d88a7";
        const contractABI = [
            "function enableTrading() external",
            "function fundJackpot() external payable",
            "function claimJackpot() external",
            "function tradingEnabled() view returns (bool)"
        ];

        let provider, signer, contract;

        async function connectWallet() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    provider = new ethers.BrowserProvider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = await provider.getSigner();
                    const address = await signer.getAddress();
                    
                    document.getElementById('walletAddress').innerText = address.substring(0, 6) + "..." + address.substring(address.length - 4);
                    document.getElementById('connectBtn').innerText = "متصل";
                    document.getElementById('connectBtn').classList.remove('bg-amber-500', 'hover:bg-amber-600');
                    document.getElementById('connectBtn').classList.add('bg-emerald-500', 'text-gray-950');

                    const network = await provider.getNetwork();
                    document.getElementById('networkStatus').innerText = `ID: ${network.chainId}`;
                    document.getElementById('networkStatus').classList.remove('text-red-400');
                    document.getElementById('networkStatus').classList.add('text-emerald-400');

                    contract = new ethers.Contract(contractAddress, contractABI, signer);
                    updateJackpotBalance();
                } catch (error) {
                    console.error("خطأ في الربط:", error);
                    alert("فشل ربط المحفظة!");
                }
            } else {
                alert("الرجاء تثبيت محفظة مثل MetaMask أو استخدام متصفح يدعم Web3!");
            }
        }

        async function updateJackpotBalance() {
            if (!provider) return;
            try {
                const balanceWei = await provider.getBalance(contractAddress);
                const balanceBnb = ethers.formatEther(balanceWei);
                document.getElementById('jackpotBalance').innerText = balanceBnb + " BNB";
            } catch (error) {
                console.error("خطأ في جلب الرصيد:", error);
            }
        }

        async function enableTrading() {
            if (!contract) { alert("الرجاء ربط المحفظة أولاً!"); return; }
            try {
                const tx = await contract.enableTrading();
                alert("تم إرسال المعاملة بنجاح، بانتظار التأكيد...");
                await tx.wait();
                alert("تم تفعيل التداول بنجاح! 🚀");
            } catch (error) {
                console.error(error);
                alert("حدث خطأ أو أنك لست مالك العقد.");
            }
        }

        async function fundJackpot() {
            if (!contract) { alert("الرجاء ربط المحفظة أولاً!"); return; }
            const amount = document.getElementById('jackpotAmount').value;
            if (!amount || isNaN(amount)) { alert("الرجاء إدخال قيمة صحيحة للـ BNB"); return; }
            try {
                const tx = await contract.fundJackpot({ value: ethers.parseEther(amount) });
                alert("جاري إرسال تمويل الجائزة...");
                await tx.wait();
                alert("تم تمويل الجائزة بنجاح! 🏆");
                updateJackpotBalance();
            } catch (error) {
                console.error(error);
                alert("فشل تمويل الجائزة.");
            }
        }

        async function claimJackpot() {
            if (!contract) { alert("الرجاء ربط المحفظة أولاً!"); return; }
            try {
                const tx = await contract.claimJackpot();
                alert("جاري إرسال معاملة المطالبة بالجائزة...");
                await tx.wait();
                alert("مبروك! تم سحب الجائزة بنجاح 🎉");
                updateJackpotBalance();
            } catch (error) {
                console.error(error);
                alert("شروط سحب الجائزة غير متوفرة بعد (الوقت لم ينته أو لست آخر مشتري).");
            }
        }
    </script>
</body>
</html>
