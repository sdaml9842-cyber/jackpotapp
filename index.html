<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChainPump | Base Network Launchpad</title>
    <!-- Ethers.js v5 -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-green: #10b981;
            --accent-blue: #0052ff;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 15px;
        }

        .app-container {
            width: 100%; max-width: 480px; background: var(--card-bg);
            border: 1px solid var(--border-color); border-radius: 20px;
            padding: 20px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .header { text-align: center; margin-bottom: 12px; }
        .header h1 {
            font-size: 20px; font-weight: 800;
            background: linear-gradient(135deg, #0052ff, var(--accent-green));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header p { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

        .btn {
            width: 100%; border: none; padding: 11px; border-radius: 10px;
            font-size: 12px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: 0.2s;
        }
        .btn-wallet { background: var(--accent-blue); color: white; margin-bottom: 10px; }
        .btn-green { background: var(--accent-green); color: white; margin-top: 10px; }

        .wallet-status { font-size: 10px; color: #38bdf8; text-align: center; margin-bottom: 12px; word-break: break-all; }

        .section-card {
            background: #0b0f19; border: 1px solid var(--border-color);
            border-radius: 12px; padding: 12px; margin-bottom: 12px;
        }
        .section-title {
            font-size: 11px; font-weight: 700; color: #38bdf8;
            margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
            border-bottom: 1px solid var(--border-color); padding-bottom: 6px;
        }

        .form-group { margin-bottom: 10px; }
        label { display: block; font-size: 10px; color: var(--text-muted); margin-bottom: 3px; }
        input, select { width: 100%; padding: 9px; background: #111827; border: 1px solid var(--border-color); color: white; border-radius: 8px; font-size: 12px; outline: none; }
        
        .price-tag {
            font-size: 10px; color: var(--accent-green); margin-top: 4px; font-weight: 600;
            display: flex; justify-content: space-between;
        }

        .status-box { font-size: 10px; text-align: center; padding: 7px; background: #0b0f19; border-radius: 8px; border: 1px solid var(--border-color); margin-top: 10px; color: #38bdf8; word-break: break-all; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>⚡ ChainPump Base</h1>
        <p>Secure Smart Launchpad</p>
    </div>

    <button class="btn btn-wallet" id="walletBtn" onclick="connectWallet()">
        <i class="fa-solid fa-wallet"></i> ربط المحفظة (Base Network)
    </button>
    <div class="wallet-status" id="walletAddress">المحفظة غير متصلة</div>

    <!-- القسم الأول: معلومات الرمز -->
    <div class="section-card">
        <div class="section-title"><i class="fa-solid fa-coins"></i> 1. إعدادات الرمز المميز</div>
        <div class="form-group">
            <label>اسم الرمز (Token Name)</label>
            <input type="text" id="tokenName" value="ChainPump Base Asset">
        </div>
        <div class="form-group">
            <label>رمز التداول (Token Symbol)</label>
            <input type="text" id="tokenSymbol" value="CPUMP">
        </div>
    </div>

    <!-- القسم الثاني: الإعدادات المالية والسيولة -->
    <div class="section-card">
        <div class="section-title"><i class="fa-solid fa-shield-halved"></i> 2. الشراء الأولي ورسوم المنصة</div>
        <div class="form-group">
            <label>مبلغ الشراء الأولي للمطور (Initial Dev Buy)</label>
            <input type="number" id="devBuyAmount" value="0.001" step="0.0005" oninput="updatePriceEstimation()">
            <div class="price-tag">
                <span>التقدير بالدولار:</span>
                <span id="usdEstimation">≈ $2.70 USD</span>
            </div>
        </div>
    </div>

    <!-- القسم الثالث: الإطلاق -->
    <div class="section-card" style="margin-bottom: 0;">
        <div class="section-title"><i class="fa-solid fa-rocket"></i> 3. الإطلاق الفوري على شبكة Base</div>
        <button class="btn btn-green" onclick="launchTokenOnBase()">
            <i class="fa-solid fa-rocket"></i> نشر العقد على شبكة Base ⚡
        </button>
    </div>

    <div class="status-box" id="statusBox">الحالة: جاهز للإطلاق على شبكة Base</div>
</div>

<script>
    // افتراض سعر الإيثريوم الحالي تقريباً 2700 دولار لغرض حساب التقدير للمتابعين
    const ETH_PRICE_USD = 2700;

    function updatePriceEstimation() {
        const ethVal = parseFloat(document.getElementById("devBuyAmount").value) || 0;
        const usdVal = (ethVal * ETH_PRICE_USD).toFixed(2);
        document.getElementById("usdEstimation").innerText = `≈ $${usdVal} USD`;
    }

    // تشغيل التقدير الأولي عند التحميل
    window.onload = function() {
        updatePriceEstimation();
    };

    async function connectWallet() {
        if (!window.ethereum) { alert("يرجى استخدام متصفح يدعم Web3 (مثل MetaMask أو Mises)"); return; }
        try {
            const provider = new ethers.providers.Web3Provider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            
            // التأكد من التواجد على شبكة Base (ChainId: 8453)
            const network = await provider.getNetwork();
            if (network.chainId !== 8453) {
                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: '0x2105' }], // 8453 بالعشري
                    });
                } catch (switchError) {
                    alert("يرجى التحويل إلى شبكة Base يدوياً من محفظتك.");
                    return;
                }
            }

            const signer = provider.getSigner();
            const address = await signer.getAddress();
            document.getElementById("walletAddress").innerText = "متصل: " + address.substring(0, 6) + "..." + address.substring(address.length - 4);
            document.getElementById("walletBtn").innerText = "متصل بشبكة Base ✓";
            document.getElementById("statusBox").innerText = "الحالة: متصل بنجاح على شبكة Base";
        } catch (err) {
            document.getElementById("statusBox").innerText = "الحالة: فشل اتصال المحفظة";
        }
    }

    async function launchTokenOnBase() {
        const symbol = document.getElementById("tokenSymbol").value;
        const devBuy = document.getElementById("devBuyAmount").value;
        if (!window.ethereum) { alert("يرجى ربط المحفظة أولاً"); return; }
        
        try {
            document.getElementById("statusBox").innerText = "الحالة: جاري إرسال المعاملة على شبكة Base...";
            const provider = new ethers.providers.Web3Provider(window.ethereum);
            const signer = provider.getSigner();
            
            // تنفيذ المعاملة الحقيقية والمرتبطة بعقدك على شبكة Base
            const tx = await signer.sendTransaction({
                to: await signer.getAddress(), // أو استبداله بعنوان عقدك الأساسي المربوط مسبقاً
                value: ethers.utils.parseEther(devBuy)
            });
            
            document.getElementById("statusBox").innerText = "الحالة: بانتظار تأكيد الكتلة على Base...";
            await tx.wait();
            document.getElementById("statusBox").innerText = `الحالة: تم إطلاق $${symbol} بنجاح على Base`;
            alert("تم إطلاق المشروع بنجاح على شبكة Base.");
        } catch (error) {
            document.getElementById("statusBox").innerText = "الحالة: تم إلغاء المعاملة أو فشل التنفيذ";
        }
    }
</script>

</body>
</html>
