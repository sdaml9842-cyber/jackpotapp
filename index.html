<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء مجمع السيولة</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            text-align: center;
            padding: 50px;
        }
        .card {
            background: #161b22;
            padding: 30px;
            border-radius: 12px;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .btn {
            background-color: #f3ba2f; /* لون BNB الشهير */
            color: #000;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }
        .btn:hover {
            background-color: #e2ab22;
        }
        input {
            padding: 10px;
            width: 80%;
            margin-top: 10px;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #fff;
            border-radius: 5px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>إضافة سيولة لعملتك على BNB Chain</h2>
        <p>انقر على الزر أدناه للتوجه المباشر لإنشاء المجمع:</p>
        
        <!-- حقل يعرض عقدك للنسخ السريع -->
        <br>
        <input type="text" readonly value="0xABE22Ab6C4d5ac4D96041078ec650ca7124335dE" onclick="this.select();">
        <br>

        <!-- زر التوجيه المباشر لبانكيك سواب -->
        <a href="https://pancakeswap.finance/add/BNB/0xABE22Ab6C4d5ac4D96041078ec650ca7124335dE" target="_blank" class="btn">
            فتح مجمع السيولة على PancakeSwap 🚀
        </a>
    </div>

</body>
</html>
