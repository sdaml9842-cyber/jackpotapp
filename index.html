<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Predator Control</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-6 font-sans">

    <header class="max-w-xl mx-auto w-full flex justify-between items-center border-b border-slate-800 pb-4">
        <h1 class="font-bold text-lg text-emerald-400">لوحة تحكم المفترس</h1>
        <button id="connectBtn" onclick="connectWallet()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-lg">
            ربط المحفظة
        </button>
    </header>

    <main class="max-w-xl mx-auto w-full space-y-6 my-auto py-6">
        
        <!-- معلومات العقد -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
            <p class="text-xs text-slate-400 mb-1">عنوان العقد المنشور:</p>
            <p class="font-mono text-xs text-emerald-400 break-all bg-slate-950 p-2 rounded-lg border border-slate-800">0x93eb91E922784eE08bFf436b5be1F0A86990eDD1</p>
        </div>

        <!-- الخطوة الأولى: تفعيل التداول -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-3">
            <h2 class="text-sm font-bold text-slate-200">الخطوة 1: فتح وتفعيل التداول</h2>
            <p class="text-xs text-slate-400">يجب تنفيذ هذه الدالة مرة واحدة لفتح باب استقبال المعاملات.</p>
            <button onclick="activateTrading()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 rounded-xl transition text-sm">
                تفعيل التداول (activateTrading)
            </button>
        </div>

        <!-- الخطوة الثانية: تنفيذ أول عملية شراء (الـ Bait) -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-3">
            <h2 class="text-sm font-bold text-slate-200">الخطوة 2: إرسال أول عملية شراء (تحريك الميمبول)</h2>
            <div>
                <label class="block text-xs text-slate-400 mb-1">قيمة الـ BNB للشراء التجريبي:</label>
                <input type="number" id="bnbAmount" value="0.001" step="0.0001" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-emerald-500">
            </div>
            <button onclick="executeBuy()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition text-sm shadow-lg">
                تنفيذ الشراء المفترس (executePredatorBuy)
            </button>
        </div>

        <!-- صندوق الحالة -->
        <div id="status" class="bg-slate-950 border border-slate-800 rounded-xl p-4 text-xs text-slate-400 text-center font-mono">
            الحالة: في انتظار اتصال المحفظة...
        </div>

    </main>

    <footer class="max-w-xl mx-auto w-full text-center text-xs text-slate-600 pt-4 border-t border-slate-900">
        Quantum Predator System &copy; 2026
    </footer>

    <script>
        const contractAddress = "0x93eb91E922784eE08bFf436b5be1F0A86990eDD1";
        const contractABI = [
            "function activateTrading() external",
            "function executePredatorBuy() external payable"
        ];

        let provider, signer, contract;

        async function connectWallet() {
            if (window.ethereum) {
                try {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", [],);
                    signer = provider.getSigner();
                    contract = new ethers.Contract(contractAddress, contractABI, signer);
                    
                    const address = await signer.getAddress();
                    document.getElementById("connectBtn").innerText = address.substring(0, 6) + "..." + address.substring(38);
                    document.getElementById("status").innerText = "تم اتصال المحفظة بنجاح!";
                } catch (err) {
                    console.error(err);
                    document.getElementById("status").innerText = "فشل الاتصال بالمحفظة.";
                }
            } else {
                alert("يرجى استخدام متصفح يدعم Web3 مثل MetaMask أو Mises.");
            }
        }

        async function activateTrading() {
            if (!contract) {
                alert("الرجاء ربط المحفظة أولاً!");
                return;
            }
            try {
                document.getElementById("status").innerText = "جاري إرسال معاملة تفعيل التداول...";
                const tx = await contract.activateTrading();
                document.getElementById("status").innerText = "تم الإرسال، في انتظار التأكيد: " + tx.hash;
                await tx.wait();
                document.getElementById("status").innerText = "✅ تم تفعيل التداول بنجاح تام!";
            } catch (err) {
                console.error(err);
                document.getElementById("status").innerText = "خطأ: " + (err.data?.message || err.message);
            }
        }

        async function executeBuy() {
            if (!contract) {
                alert("الرجاء ربط المحفظة أولاً!");
                return;
            }
            try {
                const amount = document.getElementById("bnbAmount").value;
                const txValue = ethers.utils.parseEther(amount);
                
                document.getElementById("status").innerText = "جاري إرسال عملية الشراء الأولى...";
                const tx = await contract.executePredatorBuy({ value: txValue });
                document.getElementById("status").innerText = "تم إرسال المعاملة: " + tx.hash;
                await tx.wait();
                document.getElementById("status").innerText = "🚀 تمت عملية الشراء الأولى بنجاح وتحرك الميمبول!";
            } catch (err) {
                console.error(err);
                document.getElementById("status").innerText = "خطأ: " + (err.data?.message || err.message);
            }
        }
    </script>
</body>
</html>
