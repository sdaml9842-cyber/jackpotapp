<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumLaunchpad Controller</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            text-align: center;
        }
        .card {
            max-width: 500px;
            margin: 20px auto;
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-success { background: #22c55e; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        button:hover { opacity: 0.85; }
        input {
            width: calc(100% - 20px);
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            text-align: center;
        }
        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            background: #334155;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <h2>لوحة تحكم العقد: QuantumLaunchpad</h2>

    <div class="card">
        <button id="connectBtn" class="btn-primary" onclick="connectWallet()">ربط المحفظة</button>
        <div id="walletAddress" style="margin-top: 10px; font-size: 14px; color: #94a3b8;"></div>
    </div>

    <div class="card">
        <h3>تفعيل التداول</h3>
        <p style="font-size: 13px; color: #94a3b8;">اضغط لتشغيل دالة activateTrading() والسماح بالشراء</p>
        <button class="btn-success" onclick="activateTrading()">تفعيل التداول الآن 🚀</button>
    </div>

    <div class="card">
        <h3>إدارة الاستثناء (Set Excluded)</h3>
        <input type="text" id="excludeAddress" placeholder="عنوان المحفظة 0x..." />
        <button class="btn-primary" onclick="setExcluded(true)">استثناء العنوان</button>
        <button class="btn-danger" onclick="setExcluded(false)">إلغاء الاستثناء</button>
    </div>

    <div class="card">
        <h3>الحالة والإشعارات</h3>
        <div id="statusLog" class="status">جاهز للربط...</div>
    </div>

    <script>
        const CONTRACT_ADDRESS = "0xe97836C00f04D3E51aa2Fb17f74B1a29b6bC5334";
        
        const CONTRACT_ABI = [
            "function activateTrading() external",
            "function setExcluded(address account, bool status) external",
            "function tradingActive() external view returns (bool)",
            "function owner() external view returns (address)"
        ];

        let provider, signer, contract;

        async function connectWallet() {
            if (window.ethereum) {
                try {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = provider.getSigner();
                    const address = await signer.getAddress();
                    
                    document.getElementById("walletAddress").innerText = "المحفظة المرتبطة: " + address;
                    document.getElementById("connectBtn").innerText = "تم الربط بنجاح ✅";
                    
                    contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
                    logStatus("تم ربط المحفظة والعقد بنجاح.");
                } catch (error) {
                    logStatus("خطأ أثناء ربط المحفظة: " + error.message);
                }
            } else {
                alert("يرجى فتح الصفحة من داخل متصفح يقتني محفظة Web3 مثل MetaMask أو Mises");
            }
        }

        async function activateTrading() {
            if (!contract) return alert("قم بربط المحفظة أولاً!");
            try {
                logStatus("جاري إرسال معاملة تفعيل التداول...");
                const tx = await contract.activateTrading();
                logStatus("تم إرسال المعاملة، بانتظار التأكيد: " + tx.hash);
                await tx.wait();
                logStatus("تم تفعيل التداول بنجاح! 🚀");
            } catch (error) {
                logStatus("خطأ في التفعيل: " + (error.reason || error.message));
            }
        }

        async function setExcluded(status) {
            if (!contract) return alert("قم بربط المحفظة أولاً!");
            const targetAddress = document.getElementById("excludeAddress").value.trim();
            if (!targetAddress) return alert("يرجى إدخال عنوان صحيح!");

            try {
                logStatus("جاري تحديث الاستثناء للعنوان...");
                const tx = await contract.setExcluded(targetAddress, status);
                logStatus("تم إرسال المعاملة: " + tx.hash);
                await tx.wait();
                logStatus("تم تحديث حالة الاستثناء بنجاح!");
            } catch (error) {
                logStatus("خطأ: " + (error.reason || error.message));
            }
        }

        function logStatus(msg) {
            document.getElementById("statusLog").innerText = msg;
        }
    </script>
</body>
</html>
