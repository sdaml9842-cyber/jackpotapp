<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSUNAMI | The Ultimate Base Launchpad</title>
    <!-- Tailwind CSS (JIT) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ethers.js v6 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.11.1/ethers.umd.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Tajawal', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    animation: {
                        'spin-slow': 'spin 3s linear infinite',
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'slide-up': 'slideUp 0.4s ease-out'
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050b14; color: #ffffff; overflow-x: hidden; }
        /* Glassmorphism */
        .glass-panel {
            background: rgba(13, 22, 37, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(6, 182, 212, 0.15);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        .neon-text { text-shadow: 0 0 10px rgba(6, 182, 212, 0.7); }
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #050b14; }
        ::-webkit-scrollbar-thumb { background: #06b6d4; border-radius: 4px; }
        
        /* Toast Notifications */
        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { padding: 12px 24px; border-radius: 12px; font-weight: 700; font-size: 14px; animation: slideUp 0.3s forwards; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 8px; }
        .toast.success { background: rgba(16, 185, 129, 0.9); border: 1px solid #059669; }
        .toast.error { background: rgba(239, 68, 68, 0.9); border: 1px solid #b91c1c; }
        .toast.info { background: rgba(59, 130, 246, 0.9); border: 1px solid #2563eb; }
    </style>
</head>
<body class="min-h-screen bg-grid flex flex-col items-center relative">

    <!-- Toast Notifications Container -->
    <div id="toast-container"></div>

    <!-- Header -->
    <header class="w-full max-w-6xl mx-auto p-6 flex justify-between items-center z-10">
        <div class="flex items-center gap-3 cursor-pointer" onclick="showView('launchpad')">
            <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-cyan-400 to-blue-600 flex justify-center items-center text-2xl shadow-[0_0_15px_rgba(6,182,212,0.6)]">🌊</div>
            <div>
                <h1 class="text-2xl font-black tracking-widest bg-clip-text text-transparent bg-gradient-to-r from-cyan-300 to-blue-500">TSUNAMI</h1>
                <p class="text-[10px] text-cyan-500 font-mono tracking-widest uppercase">Base Liquidity Engine</p>
            </div>
        </div>
        <button id="connectBtn" onclick="connectWallet()" class="glass-panel hover:bg-cyan-900/40 text-cyan-300 font-bold py-2.5 px-6 rounded-full transition-all duration-300 flex items-center gap-2 border-cyan-500/30 hover:border-cyan-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
            <span id="connectText">ربط المحفظة</span>
        </button>
    </header>

    <!-- Main App Content -->
    <main class="w-full max-w-4xl mx-auto px-4 py-8 flex-1 z-10 flex flex-col items-center justify-center">

        <!-- ========================================== -->
        <!-- VIEW 1: LAUNCHPAD (Factory)                -->
        <!-- ========================================== -->
        <div id="view-launchpad" class="w-full max-w-md animate-fade-in space-y-6">
            
            <div class="glass-panel p-8 rounded-3xl relative overflow-hidden">
                <!-- Background decoration -->
                <div class="absolute -top-20 -right-20 w-40 h-40 bg-cyan-500 rounded-full mix-blend-multiply filter blur-[64px] opacity-20"></div>
                
                <h2 class="text-2xl font-black text-center mb-6 neon-text">إطلاق عملة فيروسية 🚀</h2>
                
                <div class="space-y-5">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1.5 ml-1">اسم العملة</label>
                        <input type="text" id="tokenName" placeholder="Tsunami Coin" class="w-full bg-[#0a101d] border border-gray-700/50 rounded-xl p-4 text-white focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500 outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1.5 ml-1">رمز العملة (Ticker)</label>
                        <input type="text" id="tokenSymbol" placeholder="$TSUNAMI" class="w-full bg-[#0a101d] border border-gray-700/50 rounded-xl p-4 text-white focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500 outline-none transition-all uppercase">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1.5 ml-1">هدف التخرج لـ DEX (ETH)</label>
                        <div class="relative">
                            <select id="tokenTarget" class="w-full bg-[#0a101d] border border-gray-700/50 rounded-xl p-4 text-white focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500 outline-none appearance-none cursor-pointer">
                                <option value="4">4 ETH (سريع جداً)</option>
                                <option value="10" selected>10 ETH (متوازن)</option>
                                <option value="20">20 ETH (للحيتان)</option>
                            </select>
                            <div class="absolute left-4 top-1/2 -translate-y-1/2 pointer-events-none text-gray-400">▼</div>
                        </div>
                    </div>
                    
                    <button id="btnCreate" onclick="createToken()" class="w-full relative group overflow-hidden rounded-xl p-[1px]">
                        <span class="absolute inset-0 bg-gradient-to-r from-cyan-500 via-blue-500 to-purple-600 rounded-xl opacity-70 group-hover:opacity-100 transition-opacity"></span>
                        <div class="relative bg-[#0d1625] px-4 py-4 rounded-xl flex items-center justify-center gap-2 transition-all group-hover:bg-opacity-0">
                            <span id="btnCreateText" class="font-black text-lg text-white">نشر العقد الذكي</span>
                            <div id="btnCreateSpinner" class="hidden w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                        </div>
                    </button>
                </div>
            </div>

            <!-- Divider -->
            <div class="flex items-center gap-4 my-4 opacity-50">
                <div class="h-px bg-gray-600 flex-1"></div>
                <span class="text-xs font-bold">أو</span>
                <div class="h-px bg-gray-600 flex-1"></div>
            </div>

            <!-- Enter Existing Token -->
            <div class="glass-panel p-6 rounded-3xl">
                <p class="text-xs text-gray-400 text-center mb-4">الدخول إلى منصة تداول لعملة موجودة:</p>
                <div class="flex gap-2">
                    <input type="text" id="existingTokenInput" placeholder="0x..." class="flex-1 bg-[#0a101d] border border-gray-700/50 rounded-xl px-4 py-3 text-sm font-mono focus:ring-1 focus:ring-cyan-500 outline-none">
                    <button id="btnLoadToken" onclick="loadToken()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold px-6 py-3 rounded-xl transition-colors flex items-center gap-2">
                        <span id="btnLoadText">فتح</span>
                        <div id="btnLoadSpinner" class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                    </button>
                </div>
            </div>
        </div>


        <!-- ========================================== -->
        <!-- VIEW 2: TRADING TERMINAL                   -->
        <!-- ========================================== -->
        <div id="view-terminal
